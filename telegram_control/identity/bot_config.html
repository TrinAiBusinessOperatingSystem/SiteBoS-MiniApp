    <script>
(function() {
    // Riferimento locale e temporaneo all'SDK per il controllo iniziale
    const tempTg = window.Telegram?.WebApp;
    const isTelegramSession = tempTg && tempTg.initData && tempTg.initData !== "" && tempTg.platform !== "unknown";

    if (!isTelegramSession) {
        const currentPath = window.location.pathname;
        let redirectPath = "index.html";

        if (currentPath.includes('/telegram_control/')) {
            const parts = currentPath.split('/telegram_control/');
            const subPath = parts[1] || '';
            if (subPath.includes('/')) {
                redirectPath = "../../index.html";
            } else {
                redirectPath = "../index.html";
            }
        }

        window.location.replace(redirectPath);
    }
})();

        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#000000', bg: '#fafafa', surface: '#ffffff', border: '#eeeeee' },
                    borderRadius: { '3xl': '1.5rem' }
                }
            }
        }
    </script>

        body { font-family: 'Inter', sans-serif; background-color: #fafafa; color: #000; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .switch { position: relative; display: inline-block; width: 38px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #e2e8f0; transition: .3s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #000; }
        input:checked + .slider:before { transform: translateX(18px); }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loader { border: 2px solid #f3f3f3; border-top: 2px solid #000; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }

<body class="safe-area-inset h-screen flex flex-col overflow-hidden bg-[#fafafa]">

                    <select id="role_persona" class="w-full bg-gray-50 p-3.5 rounded-xl text-[11px] font-bold border border-transparent focus:border-black outline-none appearance-none">

            <!-- 2. PERMESSI -->

                <div class="flex items-center justify-between py-1">

                        <label class="text-[9px] font-black text-gray-500 uppercase ml-1">Token Massimi Chat</label>

    <!-- FOOTER STICKY (Appare solo se ci sono modifiche) -->
    <div id="save-footer" class="fixed bottom-0 left-0 right-0 p-4 bg-white/90 backdrop-blur-lg border-t border-gray-100 z-50 hidden transition-all duration-300">
        <div class="max-w-md mx-auto">
            <button class="w-full h-12 bg-black text-white rounded-xl font-black uppercase tracking-widest text-[10px] active:scale-95 transition-all flex items-center justify-center gap-2" onclick="saveData()">
                <i class="fas fa-save text-[10px]"></i> <span id="btn-label">Salva Configurazione</span>
            </button>
            <div id="save-loader" class="hidden flex justify-center py-2"><div class="loader"></div></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        if (tg.setHeaderColor) tg.setHeaderColor('#ffffff');
        if (tg.setBackgroundColor) tg.setBackgroundColor('#ffffff');
        const WEBHOOK_URL = 'https://prod.workflow.trinai.it/webhook/8eb69e84-d20d-486e-a70e-9acf31c3da9e';
        
        const urlParams = new URLSearchParams(window.location.search);
        let ash = urlParams.get('ash');
        let msg = urlParams.get('msg');

        if (ash && ash.includes('?msg=')) {
            const parts = ash.split('?msg=');
            ash = parts[0];
            if (!msg) msg = parts[1];
        }
        let fullConfig = {}; 

        tg.expand();
        tg.ready();

        window.goBackToMenu = function() {
            if (window.Telegram?.WebApp?.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
            }
            const currentParams = new URLSearchParams(window.location.search);
            const ashVal = currentParams.get('ash') || ash || '';
            const msgVal = currentParams.get('msg') || msg || '';
            location.href = `../dashboard/dashboard.html?ash=${ashVal}&msg=${msgVal}&menu=identity_hub`;
        };

        if (tg.BackButton) {
            tg.BackButton.show();
            tg.BackButton.onClick(() => {
                goBackToMenu();
            });
        }

        async function loadData() {
            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ _auth: tg.initData, user_id: tg.initDataUnsafe.user?.id, action: "get_bot_config", ash: ash, msg: msg })
                });
                fullConfig = await response.json();

                document.getElementById('agent_name').value = fullConfig.identity.agent_name;
                document.getElementById('role_persona').value = fullConfig.identity.role_persona;
                document.getElementById('allow_images').checked = fullConfig.permissions.allow_images;
                document.getElementById('allow_files').checked = fullConfig.permissions.allow_files;
                document.getElementById('tone').value = fullConfig.personality.tone || 'professional';
                
                const vibeSel = document.getElementById('vibe');
                vibeSel.value = mapLegacyVibe(fullConfig.personality.vibe);

                document.getElementById('language_style').value = fullConfig.personality.language_style || 'formal';
                document.getElementById('emoji_usage').value = fullConfig.personality.emoji_usage || 'moderate';
                document.getElementById('custom_instructions').value = fullConfig.personality.custom_instructions || '';

                const goalSel = document.getElementById('primary_goal');
                goalSel.value = mapLegacyGoal(fullConfig.business_logic.primary_goal);

                document.getElementById('max_daily_messages').value = fullConfig.system_safety_limits.max_daily_messages_per_user || 100;
                document.getElementById('max_tokens').value = fullConfig.system_safety_limits.max_tokens_per_chat || 4000;

                document.getElementById('main-loader').style.display = 'none';
                document.getElementById('config-form').classList.remove('hidden');

                // Attach Dirty Check listeners and capture initial state
                setTimeout(() => {
                    initialConfigState = getSerializedConfigState();
                    const formEl = document.getElementById('config-form');
                    formEl.removeEventListener('input', checkDirtyState);
                    formEl.removeEventListener('change', checkDirtyState);
                    formEl.addEventListener('input', checkDirtyState);
                    formEl.addEventListener('change', checkDirtyState);
                    checkDirtyState();
                }, 100);
            } catch (err) { tg.showAlert("Errore caricamento."); }
        }

        let initialConfigState = "";

        function mapLegacyVibe(val) {
            if (!val) return 'empatica_accogliente';
            const lower = val.toLowerCase();
            if (lower.includes('lead') || lower.includes('vendit')) return 'dinamico_innovativo';
            if (lower.includes('empat') || lower.includes('accoglient') || lower.includes('friendly') || lower.includes('helpful')) return 'empatica_accogliente';
            if (lower.includes('dirett') || lower.includes('autorevol') || lower.includes('authoritative') || lower.includes('professional')) return 'diretto_autorevole';
            if (lower.includes('dinamic') || lower.includes('innovat')) return 'dinamico_innovativo';
            if (lower.includes('formal') || lower.includes('istituzional')) return 'formale_istituzionale';
            if (lower.includes('calm') || lower.includes('rassicuran')) return 'calmo_rassicurante';
            return 'empatica_accogliente';
        }

        function mapLegacyGoal(val) {
            if (!val) return 'supporto_assistenza';
            const lower = val.toLowerCase();
            if (lower.includes('lead') || lower.includes('lead_generation') || lower.includes('contatt')) return 'generazione_lead';
            if (lower.includes('assistenz') || lower.includes('support') || lower.includes('helpful_assistant') || lower.includes('customer_support') || lower.includes('helpdesk')) return 'supporto_assistenza';
            if (lower.includes('prenotaz') || lower.includes('appuntament') || lower.includes('booking')) return 'prenotazione_appuntamenti';
            if (lower.includes('vendit') || lower.includes('catalog') || lower.includes('prodott') || lower.includes('sales')) return 'vendita_catalogo';
            if (lower.includes('faq') || lower.includes('domande') || lower.includes('rispost')) return 'informazione_faq';
            return 'supporto_assistenza';
        }

        function getSerializedConfigState() {
            return JSON.stringify({
                agent_name: document.getElementById('agent_name').value,
                role_persona: document.getElementById('role_persona').value,
                allow_images: document.getElementById('allow_images').checked,
                allow_files: document.getElementById('allow_files').checked,
                tone: document.getElementById('tone').value,
                vibe: document.getElementById('vibe').value,
                language_style: document.getElementById('language_style').value,
                emoji_usage: document.getElementById('emoji_usage').value,
                custom_instructions: document.getElementById('custom_instructions').value,
                primary_goal: document.getElementById('primary_goal').value,
                max_daily_messages: document.getElementById('max_daily_messages').value,
                max_tokens: document.getElementById('max_tokens').value
            });
        }

        window.checkDirtyState = function() {
            if (!initialConfigState) return;
            const currentState = getSerializedConfigState();
            const isDirty = currentState !== initialConfigState;
            const footer = document.getElementById('save-footer');
            if (footer) {
                if (isDirty) {
                    footer.classList.remove('hidden');
                } else {
                    footer.classList.add('hidden');
                }
            }
        };

        async function saveData() {
            const btnLabel = document.getElementById('btn-label');
            const saveLoader = document.getElementById('save-loader');
            
            btnLabel.innerText = "Salvataggio...";
            saveLoader.classList.remove('hidden');
            
            fullConfig.identity.agent_name = document.getElementById('agent_name').value;
            fullConfig.identity.role_persona = document.getElementById('role_persona').value;
            fullConfig.permissions.allow_images = document.getElementById('allow_images').checked;
            fullConfig.permissions.allow_files = document.getElementById('allow_files').checked;
            fullConfig.personality.tone = document.getElementById('tone').value;
            fullConfig.personality.vibe = document.getElementById('vibe').value;
            fullConfig.personality.language_style = document.getElementById('language_style').value;
            fullConfig.personality.emoji_usage = document.getElementById('emoji_usage').value;
            fullConfig.personality.custom_instructions = document.getElementById('custom_instructions').value;
            fullConfig.business_logic.primary_goal = document.getElementById('primary_goal').value;
            fullConfig.system_safety_limits.max_daily_messages_per_user = parseInt(document.getElementById('max_daily_messages').value);
            fullConfig.system_safety_limits.max_tokens_per_chat = parseInt(document.getElementById('max_tokens').value);

            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ _auth: tg.initData, user_id: tg.initDataUnsafe.user?.id, action: "save_bot_config", config: fullConfig, ash: ash, msg: msg })
                });
                if (response.ok) {
                    btnLabel.innerText = "Configurazione Salvata!";
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                    initialConfigState = getSerializedConfigState();
                    setTimeout(() => {
                        btnLabel.innerText = "Salva Configurazione";
                        saveLoader.classList.add('hidden');
                        checkDirtyState();
                    }, 1500);
                }
            } catch (err) { 
                tg.showAlert("Errore."); 
                btnLabel.innerText = "Salva Configurazione";
                saveLoader.classList.add('hidden');
            }
        }
        let voiceAudio = null;
        let isAudioPlaying = false;

        window.toggleAudio = function() {
            const btn = document.getElementById('btn-nav-audio');
            const icon = btn ? btn.querySelector('i') : null;
            
            if (!voiceAudio) {
                voiceAudio = new Audio('bot_config.wav');
                voiceAudio.addEventListener('ended', () => {
                    isAudioPlaying = false;
                    voiceAudio.currentTime = 0;
                    if (icon) {
                        icon.className = 'fas fa-volume-high text-xs';
                        btn.classList.remove('bg-black', 'text-white', 'border-black');
                        btn.classList.add('bg-white', 'text-slate-500', 'border-gray-200');
                    }
                });
            }

            if (isAudioPlaying) {
                voiceAudio.pause();
                voiceAudio.currentTime = 0;
                isAudioPlaying = false;
                if (icon) {
                    icon.className = 'fas fa-volume-high text-xs';
                    btn.classList.remove('bg-black', 'text-white', 'border-black');
                    btn.classList.add('bg-white', 'text-slate-500', 'border-gray-200');
                }
            } else {
                voiceAudio.play().then(() => {
                    isAudioPlaying = true;
                    if (icon) {
                        icon.className = 'fas fa-stop text-xs';
                        btn.classList.remove('bg-white', 'text-slate-500', 'border-gray-200');
                        btn.classList.add('bg-black', 'text-white', 'border-black');
                    }
                }).catch(err => {
                    console.error("Errore riproduzione audio:", err);
                });
            }
        };

        window.openUserGuide = function(url) {
            const overlay = document.getElementById('userguide-drawer-overlay');
            const drawer = document.getElementById('userguide-drawer');
            const iframe = document.getElementById('userguide-iframe');
            if (!overlay || !drawer || !iframe) return;

            if (typeof window.toggleAudio === 'function' && isAudioPlaying) {
                window.toggleAudio(); // Toggle off if playing
            }

            iframe.src = url;
            overlay.classList.remove('hidden');
            setTimeout(() => {
                overlay.classList.remove('opacity-0');
                drawer.classList.remove('translate-y-full');
            }, 10);
        };

        window.closeUserGuide = function() {
            const overlay = document.getElementById('userguide-drawer-overlay');
            const drawer = document.getElementById('userguide-drawer');
            if (!overlay || !drawer) return;

            overlay.classList.add('opacity-0');
            drawer.classList.add('translate-y-full');
            setTimeout(() => {
                overlay.classList.add('hidden');
                document.getElementById('userguide-iframe').src = "";
            }, 300);
        };

        window.onload = loadData;
    </script>
    <!-- User Guide Drawer -->
    <div id="userguide-drawer-overlay" class="fixed inset-0 bg-slate-950/40 backdrop-blur-sm z-[99999] hidden opacity-0 transition-opacity duration-300" onclick="closeUserGuide()">
        <div id="userguide-drawer" class="fixed inset-0 max-w-md mx-auto h-screen bg-white shadow-2xl flex flex-col translate-y-full transition-transform duration-300 z-[100000]" onclick="event.stopPropagation()">
            <!-- Drawer Header / Handle -->
            <div class="w-full flex items-center justify-between p-4 border-b border-slate-100 shrink-0 select-none">
                <div class="flex items-center gap-2">
