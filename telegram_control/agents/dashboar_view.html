<!DOCTYPE html>
<html lang="it" class="bg-slate-50 text-slate-900 antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="color-scheme" content="light">
    <meta name="dashboar-html-hash" content="">
    <title>DashBoar | Cruscotto Operativo</title>

    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Fonts: Plus Jakarta Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- FontAwesome 6 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Chart.js 4.x CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

    <!-- Shared Micro-Runtime Bootstrap -->
    <script src="dashboar_bootstrap.js"></script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* Shimmer loading animation for skeletons */
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .is-loading {
            background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            pointer-events: none;
            color: transparent !important;
        }

        .is-loading * {
            visibility: hidden;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-50 flex flex-col selection:bg-indigo-100 selection:text-indigo-900">

    <!-- Fixed Header -->
    <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-slate-200 px-4 sm:px-6 py-3.5 flex items-center justify-between shadow-xs">
        <div class="flex items-center gap-3.5 min-w-0">
            <a href="dashboar_hub.html" class="flex-shrink-0 w-9 h-9 flex items-center justify-center rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 transition-colors" title="Torna all'Hub">
                <i class="fa-solid fa-arrow-left text-sm"></i>
            </a>

            <div class="flex-shrink-0 relative">
                <img src="../../images/dashBoar.jpg" alt="DashBoar Logo" class="w-9 h-9 object-cover rounded-xl border border-slate-200 shadow-xs" onerror="this.onerror=null; this.src='data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 40 40\'%3E%3Crect width=\'40\' height=\'40\' rx=\'10\' fill=\'%230f172a\'/%3E%3Ctext x=\'50%25\' y=\'55%25\' font-size=\'18\' font-weight=\'bold\' fill=\'%23fff\' text-anchor=\'middle\' dominant-baseline=\'middle\'%3E🐗%3C/text%3E%3C/svg%3E';">
            </div>

            <div class="min-w-0">
                <h1 data-global="board_title" class="text-sm sm:text-base font-extrabold text-slate-900 tracking-tight truncate">
                    Caricamento cruscotto...
                </h1>
                <div class="flex items-center gap-2 mt-0.5">
                    <span class="relative flex h-2 w-2">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                    </span>
                    <span data-global="last_update" class="text-[11px] font-medium text-slate-400 truncate">
                        Sincronizzazione in corso...
                    </span>
                </div>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <button data-dashboar-reload type="button" class="p-2 text-slate-400 hover:text-slate-700 rounded-xl hover:bg-slate-100 transition-colors" title="Aggiorna dati">
                <i class="fa-solid fa-rotate-right text-xs"></i>
            </button>
        </div>
    </header>

    <!-- Main Mounting Point for AI-Generated HTML View Markup -->
    <main id="dashboar-mount" class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 space-y-6">
        <!-- Initial skeleton while loading -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="h-36 rounded-2xl bg-white border border-slate-200 p-5 is-loading"></div>
            <div class="h-36 rounded-2xl bg-white border border-slate-200 p-5 is-loading"></div>
            <div class="h-36 rounded-2xl bg-white border border-slate-200 p-5 is-loading"></div>
            <div class="h-72 md:col-span-2 rounded-2xl bg-white border border-slate-200 p-5 is-loading"></div>
            <div class="h-72 rounded-2xl bg-white border border-slate-200 p-5 is-loading"></div>
        </div>
    </main>

    <!-- Full-page Error State (Hidden by default) -->
    <div id="dashboar-error-state" class="hidden flex-1 flex flex-col items-center justify-center p-6 text-center max-w-md mx-auto my-auto">
        <div class="w-16 h-16 rounded-3xl bg-rose-50 border border-rose-100 flex items-center justify-center text-rose-600 text-2xl mb-4 shadow-xs">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <h2 data-error-title class="text-lg font-bold text-slate-900 tracking-tight mb-2">
            Impossibile caricare il cruscotto
        </h2>
        <p data-error-desc class="text-xs text-slate-500 leading-relaxed mb-6">
            Si è verificato un errore durante il recupero della board. Verifica l'URL o riprova più tardi.
        </p>
        <div class="flex items-center gap-3">
            <a href="dashboar_hub.html" class="px-4 py-2 bg-slate-900 hover:bg-black text-white text-xs font-bold rounded-xl transition-colors shadow-xs">
                Torna all'Hub Board
            </a>
            <button data-dashboar-reload type="button" class="px-4 py-2 bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 text-xs font-bold rounded-xl transition-colors shadow-xs">
                Ricarica Pagina
            </button>
        </div>
    </div>

    <!-- Floating Toast Container -->
    <div id="dashboar-toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full px-4 pointer-events-none"></div>

</body>
</html>
