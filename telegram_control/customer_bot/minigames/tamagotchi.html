<!DOCTYPE html>
<html lang="it">
<head>
    <meta color-scheme="light">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tamagotchi Express | Minigioco SiteBoS</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="cx_tamagotchi.js"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #ffffff; color: #0f172a; }
    </style>
</head>
<body class="min-h-screen p-4 flex flex-col justify-between max-w-md mx-auto bg-white text-slate-900">
    <header class="border-b border-slate-100 pb-3 flex items-center justify-between">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-xl bg-black text-white flex items-center justify-center font-bold">
                <i class="fas fa-robot"></i>
            </div>
            <div>
                <h1 class="text-xs font-black uppercase tracking-wider text-slate-900 m-0">7. Tamagotchi Express</h1>
                <p class="text-[9px] text-slate-500 font-bold m-0">Cucciolo Virtuale · Premio +25 PT</p>
            </div>
        </div>
        <span id="pts-display" class="text-xs font-black bg-slate-100 px-2.5 py-1 rounded-xl border border-slate-200">250 PT</span>
    </header>

    <main class="flex-1 flex flex-col items-center justify-center space-y-4 my-4">
        <div class="p-6 bg-slate-50 border border-slate-200 rounded-3xl w-full text-center space-y-4 shadow-sm">
            <div class="w-24 h-24 rounded-full bg-black text-white flex items-center justify-center text-4xl mx-auto shadow-md animate-bounce">
                🐶
            </div>
            <div>
                <h2 id="pet-status-name" class="text-sm font-black uppercase text-slate-900">Cucciolo Felice (100%)</h2>
                <p id="pet-status-desc" class="text-xs text-slate-500">Nutri e coccola il tuo pet per accumulare il premio sconto!</p>
            </div>
        </div>
    </main>

    <footer class="grid grid-cols-3 gap-2">
        <button onclick="interactPet('nutri')" class="py-3 bg-slate-100 border border-slate-200 text-slate-900 font-bold text-xs rounded-xl active:scale-95">
            🍎 NUTRI
        </button>
        <button onclick="interactPet('gioca')" class="py-3 bg-black text-white font-black text-xs rounded-xl shadow active:scale-95">
            🎾 GIOCA
        </button>
        <button onclick="interactPet('coccola')" class="py-3 bg-slate-100 border border-slate-200 text-slate-900 font-bold text-xs rounded-xl active:scale-95">
            ❤️ COCROLA
        </button>
    </footer>

    <script>
        let pts = 250;

        function interactPet(action) {
            pts += 25;
            document.getElementById('pts-display').innerText = `${pts} PT`;
            document.getElementById('pet-status-name').innerText = `Cucciolo Entusiasta (+25 PT)!`;
            document.getElementById('pet-status-desc').innerText = `Azione "${action}" completata con successo!`;
            if (window.Telegram?.WebApp?.HapticFeedback) window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
        }
    </script>
</body>
</html>
