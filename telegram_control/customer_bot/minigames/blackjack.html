<!DOCTYPE html>
<html lang="it">
<head>
    <meta color-scheme="light">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mini Blackjack | Minigioco SiteBoS</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="cx_blackjack.js"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #ffffff; color: #0f172a; }
    </style>
</head>
<body class="min-h-screen p-4 flex flex-col justify-between max-w-md mx-auto bg-white text-slate-900">
    <header class="border-b border-slate-100 pb-3 flex items-center justify-between">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-xl bg-black text-white flex items-center justify-center font-bold">
                <i class="fas fa-spade"></i>
            </div>
            <div>
                <h1 class="text-xs font-black uppercase tracking-wider text-slate-900 m-0">5. Mini Blackjack</h1>
                <p class="text-[9px] text-slate-500 font-bold m-0">Tavolo Carte · Premio +45 PT</p>
            </div>
        </div>
        <span id="pts-display" class="text-xs font-black bg-slate-100 px-2.5 py-1 rounded-xl border border-slate-200">250 PT</span>
    </header>

    <main class="flex-1 flex flex-col justify-between my-4 space-y-4">
        <!-- DEALER HAND -->
        <div class="p-4 bg-slate-50 border border-slate-200 rounded-2xl space-y-2">
            <span class="text-[9px] font-black uppercase tracking-widest text-slate-400">Banco (Dealer)</span>
            <div id="dealer-cards" class="flex gap-2">
                <div class="w-12 h-16 bg-black text-white rounded-lg flex items-center justify-center font-black text-sm shadow">🂠</div>
                <div class="w-12 h-16 bg-white border border-slate-300 rounded-lg flex items-center justify-center font-black text-sm text-black shadow-sm">🂡 10</div>
            </div>
        </div>

        <!-- PLAYER HAND -->
        <div class="p-4 bg-slate-50 border border-slate-200 rounded-2xl space-y-2">
            <div class="flex items-center justify-between">
                <span class="text-[9px] font-black uppercase tracking-widest text-slate-400">La tua mano</span>
                <span id="player-score" class="text-xs font-black text-black">Punteggio: 21</span>
            </div>
            <div id="player-cards" class="flex gap-2">
                <div class="w-12 h-16 bg-white border border-slate-300 rounded-lg flex items-center justify-center font-black text-sm text-red-600 shadow-sm">🂱 A</div>
                <div class="w-12 h-16 bg-white border border-slate-300 rounded-lg flex items-center justify-center font-black text-sm text-black shadow-sm">🂫 K</div>
            </div>
        </div>

        <p id="bj-status-msg" class="text-xs font-bold text-center text-slate-600">Fai 21 per vincere subito il premio in punti!</p>
    </main>

    <footer class="grid grid-cols-2 gap-2">
        <button onclick="hitCard()" class="py-3.5 bg-slate-100 hover:bg-slate-200 text-slate-900 border border-slate-200 font-black text-xs uppercase tracking-wider rounded-2xl transition active:scale-95">
            🃏 CARTA
        </button>
        <button onclick="standHand()" class="py-3.5 bg-black hover:bg-slate-800 text-white font-black text-xs uppercase tracking-wider rounded-2xl shadow transition active:scale-95">
            ✋ STAI & VINCI (+45 PT)
        </button>
    </footer>

    <script>
        let pts = 250;

        function hitCard() {
            const container = document.getElementById('player-cards');
            const card = document.createElement('div');
            card.className = "w-12 h-16 bg-white border border-slate-300 rounded-lg flex items-center justify-center font-black text-sm text-black shadow-sm";
            card.innerHTML = "🂧 10";
            container.appendChild(card);
            document.getElementById('player-score').innerText = "Punteggio: 21 (BLACKJACK!)";
            if (window.Telegram?.WebApp?.HapticFeedback) window.Telegram.WebApp.HapticFeedback.selectionChanged();
        }

        function standHand() {
            pts += 45;
            document.getElementById('pts-display').innerText = `${pts} PT`;
            document.getElementById('bj-status-msg').innerText = "🎉 BLACKJACK VINTO! +45 PT Accreditati!";
            if (window.Telegram?.WebApp?.HapticFeedback) window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
        }
    </script>
</body>
</html>
