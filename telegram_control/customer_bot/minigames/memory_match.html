<!DOCTYPE html>
<html lang="it">
<head>
    <meta color-scheme="light">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Memory Pairs Match | Minigioco SiteBoS</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="cx_memory_match.js"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #ffffff; color: #0f172a; }
    </style>
</head>
<body class="min-h-screen p-4 flex flex-col justify-between max-w-md mx-auto bg-white text-slate-900">
    <header class="border-b border-slate-100 pb-3 flex items-center justify-between">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-xl bg-black text-white flex items-center justify-center font-bold">
                <i class="fas fa-puzzle-piece"></i>
            </div>
            <div>
                <h1 class="text-xs font-black uppercase tracking-wider text-slate-900 m-0">8. Memory Pairs Match</h1>
                <p class="text-[9px] text-slate-500 font-bold m-0">Coppie carte &amp; memoria · Premio +35 PT</p>
            </div>
        </div>
        <span id="pts-display" class="text-xs font-black bg-slate-100 px-2.5 py-1 rounded-xl border border-slate-200">250 PT</span>
    </header>

    <main class="flex-1 flex flex-col items-center justify-center space-y-4 my-4">
        <div id="memory-grid" class="grid grid-cols-4 gap-2.5 w-full max-w-xs">
            <!-- 16 Carte Memory -->
        </div>
        <p id="memory-msg" class="text-xs font-bold text-center text-slate-600">Trova le coppie identiche per sbloccare i punti!</p>
    </main>

    <footer>
        <button onclick="autoSolveMemory()" class="w-full py-3.5 bg-black hover:bg-slate-800 text-white font-black text-xs uppercase tracking-wider rounded-2xl shadow transition active:scale-95 flex items-center justify-center gap-2">
            <i class="fas fa-puzzle-piece text-amber-400"></i>
            <span>SCOPRI COPPIA PERFETTA (+35 PT)</span>
        </button>
    </footer>

    <script>
        let pts = 250;
        const icons = ['fa-crown', 'fa-brain', 'fa-shield-halved', 'fa-bolt', 'fa-heart', 'fa-star', 'fa-gem', 'fa-atom'];
        const deck = [...icons, ...icons].sort(() => 0.5 - Math.random());

        function initMemory() {
            const grid = document.getElementById('memory-grid');
            grid.innerHTML = deck.map((ic, i) => `
                <div id="card-${i}" onclick="flipCard(${i}, '${ic}')" class="h-16 bg-slate-100 border border-slate-200 rounded-xl flex items-center justify-center cursor-pointer text-slate-400 hover:border-black transition active:scale-95 shadow-sm">
                    <i class="fas fa-question text-xs"></i>
                </div>
            `).join('');
        }

        function flipCard(idx, ic) {
            const card = document.getElementById(`card-${idx}`);
            card.className = "h-16 bg-black text-white rounded-xl flex items-center justify-center text-sm shadow-md";
            card.innerHTML = `<i class="fas ${ic}"></i>`;
            if (window.Telegram?.WebApp?.HapticFeedback) window.Telegram.WebApp.HapticFeedback.selectionChanged();
        }

        function autoSolveMemory() {
            deck.forEach((ic, i) => flipCard(i, ic));
            pts += 35;
            document.getElementById('pts-display').innerText = `${pts} PT`;
            document.getElementById('memory-msg').innerText = "🎉 MEMORY COMPLETATO! +35 PT Accreditati!";
            if (window.Telegram?.WebApp?.HapticFeedback) window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
        }

        document.addEventListener('DOMContentLoaded', initMemory);
    </script>
</body>
</html>
