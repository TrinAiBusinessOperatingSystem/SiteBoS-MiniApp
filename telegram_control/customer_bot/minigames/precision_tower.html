<!DOCTYPE html>
<html lang="it">
<head>
    <meta color-scheme="light">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Precision Tower | Minigioco SiteBoS</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="cx_precision_tower.js"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #ffffff; color: #0f172a; }
    </style>
</head>
<body class="min-h-screen p-4 flex flex-col justify-between max-w-md mx-auto bg-white text-slate-900">
    <header class="border-b border-slate-100 pb-3 flex items-center justify-between">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-xl bg-black text-white flex items-center justify-center font-bold">
                <i class="fas fa-cubes"></i>
            </div>
            <div>
                <h1 class="text-xs font-black uppercase tracking-wider text-slate-900 m-0">6. Precision Tower</h1>
                <p class="text-[9px] text-slate-500 font-bold m-0">Costruzione Blocco · Premio +30 PT</p>
            </div>
        </div>
        <span id="pts-display" class="text-xs font-black bg-slate-100 px-2.5 py-1 rounded-xl border border-slate-200">250 PT</span>
    </header>

    <main class="flex-1 flex flex-col items-center justify-center space-y-4 my-4">
        <div class="relative w-full h-72 bg-slate-50 rounded-3xl border border-slate-200 overflow-hidden shadow-sm flex items-center justify-center">
            <canvas id="tower-canvas" width="300" height="260" class="w-full h-full"></canvas>
        </div>
        <p id="tower-msg" class="text-xs font-bold text-center text-slate-600">Impila 5 blocchi perfetti per vincere!</p>
    </main>

    <footer>
        <button onclick="dropBlock()" class="w-full py-3.5 bg-black hover:bg-slate-800 text-white font-black text-xs uppercase tracking-wider rounded-2xl shadow transition active:scale-95 flex items-center justify-center gap-2">
            <i class="fas fa-cubes text-cyan-400"></i>
            <span>🏗️ RILASCIA BLOCCO TOWER</span>
        </button>
    </footer>

    <script>
        let pts = 250;
        let blocks = [{ x: 80, y: 220, w: 140, h: 20 }];

        function drawTower() {
            const canvas = document.getElementById('tower-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 300, 260);

            blocks.forEach((b, i) => {
                ctx.fillStyle = i % 2 === 0 ? '#0f172a' : '#475569';
                ctx.fillRect(b.x, b.y, b.w, b.h);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1;
                ctx.strokeRect(b.x, b.y, b.w, b.h);
            });
        }

        function dropBlock() {
            const last = blocks[blocks.length - 1];
            if (blocks.length >= 7) return;

            blocks.push({
                x: last.x + (Math.random() * 20 - 10),
                y: last.y - 25,
                w: last.w * 0.9,
                h: 20
            });

            drawTower();

            if (blocks.length >= 6) {
                pts += 30;
                document.getElementById('pts-display').innerText = `${pts} PT`;
                document.getElementById('tower-msg').innerText = "🎉 TORRE PERFETTA! +30 PT Accreditati!";
                if (window.Telegram?.WebApp?.HapticFeedback) window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
            } else {
                if (window.Telegram?.WebApp?.HapticFeedback) window.Telegram.WebApp.HapticFeedback.selectionChanged();
            }
        }

        document.addEventListener('DOMContentLoaded', drawTower);
    </script>
</body>
</html>
