<!DOCTYPE html>
<html lang="it">
<head>
    <meta color-scheme="light">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GTA City Sandbox | Minigioco SiteBoS</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="cx_gta_sandbox.js"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #ffffff; color: #0f172a; }
    </style>
</head>
<body class="min-h-screen p-4 flex flex-col justify-between max-w-md mx-auto bg-white text-slate-900">
    <header class="border-b border-slate-100 pb-3 flex items-center justify-between">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-xl bg-black text-white flex items-center justify-center font-bold">
                <i class="fas fa-car"></i>
            </div>
            <div>
                <h1 class="text-xs font-black uppercase tracking-wider text-slate-900 m-0">4. GTA City Sandbox</h1>
                <p class="text-[9px] text-slate-500 font-bold m-0">Top-Down Driving · Premio +35 PT</p>
            </div>
        </div>
        <span id="pts-display" class="text-xs font-black bg-slate-100 px-2.5 py-1 rounded-xl border border-slate-200">250 PT</span>
    </header>

    <main class="flex-1 flex flex-col items-center justify-center space-y-4 my-4">
        <div class="relative w-full h-72 bg-slate-100 rounded-3xl border border-slate-200 overflow-hidden shadow-sm flex items-center justify-center">
            <canvas id="gta-canvas" width="300" height="260" class="w-full h-full"></canvas>
        </div>
        <p id="gta-status-msg" class="text-xs font-bold text-center text-slate-600">Guida la vettura e completa il percorso cittadino!</p>
    </main>

    <footer class="space-y-2">
        <button onclick="driveCar()" class="w-full py-3.5 bg-black hover:bg-slate-800 text-white font-black text-xs uppercase tracking-wider rounded-2xl shadow transition active:scale-95 flex items-center justify-center gap-2">
            <i class="fas fa-car text-amber-400"></i>
            <span>🏎️ ACCELERA VETTURA (+35 PT)</span>
        </button>
    </footer>

    <script>
        let pts = 250;
        let carX = 150, carY = 130;
        let angle = 0;

        function drawGta() {
            const canvas = document.getElementById('gta-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 300, 260);

            // Mappa strade
            ctx.fillStyle = '#cbd5e1';
            ctx.fillRect(0, 0, 300, 260);
            ctx.fillStyle = '#64748b';
            ctx.fillRect(40, 0, 80, 260);
            ctx.fillRect(0, 100, 300, 60);

            // Car
            ctx.save();
            ctx.translate(carX, carY);
            ctx.rotate(angle);
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(-15, -8, 30, 16);
            ctx.fillStyle = '#38bdf8';
            ctx.fillRect(0, -6, 8, 12);
            ctx.restore();
        }

        function driveCar() {
            carX += Math.cos(angle) * 20;
            carY += Math.sin(angle) * 20;
            angle += 0.4;
            if (carX > 280 || carX < 20) carX = 150;
            if (carY > 240 || carY < 20) carY = 130;

            drawGta();
            pts += 35;
            document.getElementById('pts-display').innerText = `${pts} PT`;
            document.getElementById('gta-status-msg').innerText = "🏎️ Percorso completato! +35 PT Accreditati!";
            if (window.Telegram?.WebApp?.HapticFeedback) window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
        }

        document.addEventListener('DOMContentLoaded', drawGta);
    </script>
</body>
</html>
