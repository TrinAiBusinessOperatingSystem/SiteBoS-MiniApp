<!DOCTYPE html>
<html lang="it">
<head>
    <meta color-scheme="light">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sfera Preferenze 3D | Minigioco SiteBoS</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="cx_dna_sphere.js"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #ffffff; color: #0f172a; }
    </style>
</head>
<body class="min-h-screen p-4 flex flex-col justify-between max-w-md mx-auto bg-white text-slate-900">
    <header class="border-b border-slate-100 pb-3 flex items-center justify-between">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-xl bg-black text-white flex items-center justify-center font-bold">
                <i class="fas fa-atom"></i>
            </div>
            <div>
                <h1 class="text-xs font-black uppercase tracking-wider text-slate-900 m-0">9. Sfera Preferenze 3D</h1>
                <p class="text-[9px] text-slate-500 font-bold m-0">Visualizzazione DNA · 27 Nodi Attivi</p>
            </div>
        </div>
        <span class="text-xs font-black bg-slate-100 px-2.5 py-1 rounded-xl border border-slate-200">DNA CORE</span>
    </header>

    <main class="flex-1 flex flex-col items-center justify-center space-y-4 my-4">
        <div class="relative w-full h-80 bg-white border border-slate-200 rounded-3xl overflow-hidden shadow-sm flex items-center justify-center">
            <canvas id="dna-sphere-canvas" class="w-full h-full"></canvas>
            <div class="absolute top-3 left-3 bg-white/90 border border-slate-200 px-3 py-1 rounded-xl text-[9px] font-bold shadow-sm">
                <span>Ruota la sfera nello spazio</span>
            </div>
        </div>

        <div class="grid grid-cols-5 gap-1.5 w-full text-center text-[8.5px] font-black uppercase">
            <div class="p-2 bg-slate-50 border border-slate-200 rounded-xl">🧠 Mente</div>
            <div class="p-2 bg-slate-50 border border-slate-200 rounded-xl">❤️ Cuore</div>
            <div class="p-2 bg-slate-900 text-white rounded-xl">⚡ Energia</div>
            <div class="p-2 bg-slate-50 border border-slate-200 rounded-xl">🛡️ Guardia</div>
            <div class="p-2 bg-slate-50 border border-slate-200 rounded-xl">🔄 Flusso</div>
        </div>
    </main>

    <footer>
        <button onclick="if(window.Telegram?.WebApp?.HapticFeedback) window.Telegram.WebApp.HapticFeedback.notificationOccurred('success'); alert('Mappa DNA sincronizzata con la segreteria dello studio!')" class="w-full py-3.5 bg-black hover:bg-slate-800 text-white font-black text-xs uppercase tracking-wider rounded-2xl shadow transition active:scale-95 flex items-center justify-center gap-2">
            <i class="fas fa-check-circle text-white"></i>
            <span>CONFERMA PREFERENZE DNA</span>
        </button>
    </footer>

    <script>
        function initSphereView() {
            const canvas = document.getElementById('dna-sphere-canvas');
            if (!canvas || typeof THREE === 'undefined') return;

            const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
            renderer.setSize(canvas.clientWidth, canvas.clientHeight);

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(45, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);
            camera.position.z = 3.6;

            const geometry = new THREE.IcosahedronGeometry(1.25, 1);
            const material = new THREE.MeshBasicMaterial({ color: 0x000000, wireframe: true });
            const sphere = new THREE.Mesh(geometry, material);
            scene.add(sphere);

            const positions = [
                [0, 1.25, 0], [1.15, 0.35, 0], [-1.15, 0.35, 0], [0.65, -1.05, 0.5], [-0.65, -1.05, -0.5]
            ];
            positions.forEach(pos => {
                const nGeom = new THREE.SphereGeometry(0.12, 12, 12);
                const nMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
                const nMesh = new THREE.Mesh(nGeom, nMat);
                nMesh.position.set(...pos);
                sphere.add(nMesh);
            });

            function animate() {
                requestAnimationFrame(animate);
                sphere.rotation.x += 0.005;
                sphere.rotation.y += 0.008;
                renderer.render(scene, camera);
            }
            animate();
        }

        document.addEventListener('DOMContentLoaded', initSphereView);
    </script>
</body>
</html>
