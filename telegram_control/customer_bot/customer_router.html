<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SiTeBoS — Inizializzazione Sessione</title>

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- FontAwesome & Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #090d16;
      color: #ffffff;
      min-height: 100vh;
    }
    :root {
      --accent: #229ED9;
      --accent-text: #ffffff;
      --accent-glow: rgba(34, 158, 217, 0.35);
      --accent-subtle: rgba(34, 158, 217, 0.12);
    }
    .spinner-accent {
      border-color: var(--accent-subtle);
      border-top-color: var(--accent) !important;
    }
    .accent-text {
      color: var(--accent) !important;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.3s ease-out forwards;
    }
  </style>
</head>
<body class="flex flex-col items-center justify-center p-6 text-center select-none">

  <!-- Moduli Condivisi -->
  <script src="sitebos_passport.js"></script>
  <script src="phygital_local_first.js"></script>

  <main id="routerRoot" class="flex flex-col items-center justify-center gap-5 max-w-sm w-full">
    <div class="relative w-20 h-20 flex items-center justify-center">
      <div class="absolute inset-0 rounded-full border-2 spinner-accent animate-spin"></div>
      <i class="fa-solid fa-compass text-3xl accent-text"></i>
    </div>
    <div>
      <h1 id="statusTitle" class="text-xl font-bold text-white mb-1">Accesso in Corso...</h1>
      <p id="statusDesc" class="text-slate-400 text-xs leading-relaxed">
        Riconciliazione passaporto e verifica dei servizi disponibili.
      </p>
    </div>
  </main>

  <script>
    (function () {
      'use strict';

      var tg = window.Telegram && window.Telegram.WebApp;
      if (tg) {
        try {
          tg.ready();
          tg.expand();
          if (typeof tg.requestFullscreen === 'function') {
            tg.requestFullscreen();
          }
        } catch (e) {
          console.warn('Fullscreen Telegram non disponibile:', e);
        }
      }

      var urlParams = new URLSearchParams(window.location.search);
      var vatNumber = urlParams.get('vat');

      function applyThemeAccent(accentHex) {
        var hex = accentHex || '#229ED9';
        if (!hex.startsWith('#')) hex = '#' + hex;
        if (hex.length === 4) hex = '#' + hex[1] + hex[1] + hex[2] + hex[2] + hex[3] + hex[3];
        var num = parseInt(hex.replace('#', ''), 16);
        var r = isNaN(num) ? 34 : (num >> 16) & 255;
        var g = isNaN(num) ? 158 : (num >> 8) & 255;
        var b = isNaN(num) ? 217 : num & 255;
        var luminance = (0.299 * r + 0.587 * g + 0.114 * b);
        var textOnAccent = luminance > 180 ? '#0f172a' : '#ffffff';
        var glowRgba = 'rgba(' + r + ', ' + g + ', ' + b + ', 0.35)';
        var subtleBgRgba = 'rgba(' + r + ', ' + g + ', ' + b + ', 0.12)';

        document.documentElement.style.setProperty('--accent', hex);
        document.documentElement.style.setProperty('--accent-text', textOnAccent);
        document.documentElement.style.setProperty('--accent-glow', glowRgba);
        document.documentElement.style.setProperty('--accent-subtle', subtleBgRgba);
      }

      window.SitebosRouterNav = function (url) {
        if (tg && tg.HapticFeedback) {
          try {
            tg.HapticFeedback.impactOccurred('medium');
          } catch (e) {}
        }
        window.location.replace(url);
      };

      if (!vatNumber) {
        // Tentativo di recupero da cache
        try {
          var lastChatId = localStorage.getItem('sitebos_last_active_chat_id');
          if (lastChatId) {
            var rawPassport = localStorage.getItem('sitebos_passport_' + lastChatId);
            if (rawPassport) {
              var p = JSON.parse(rawPassport);
              if (p.visited_owners && p.visited_owners.length > 0) {
                vatNumber = p.visited_owners[p.visited_owners.length - 1].vat_number;
              }
            }
          }
        } catch (e) {}
      }

      if (vatNumber) {
        try {
          var cachedOwnerRaw = localStorage.getItem('sitebos_' + vatNumber + '_owner_data');
          if (cachedOwnerRaw) {
            var cachedOwner = JSON.parse(cachedOwnerRaw);
            if (cachedOwner && cachedOwner.theme_accent) {
              applyThemeAccent(cachedOwner.theme_accent);
            }
          }
        } catch (e) {}
      }

      if (!vatNumber) {
        document.getElementById('statusTitle').textContent = 'Codice Attività Mancante';
        document.getElementById('statusDesc').textContent = 'Impossibile identificare l\'attività di destinazione.';
        return;
      }

      // Imposta il tenant corrente per i moduli
      window.SITEBOS_TENANT_ID = vatNumber;

      // 1. Carica il Passaporto Cliente (Fast-Path locale o refresh server)
      Promise.all([
        window.SitebosPassport.load(),
        window.PhygitalLocalFirst.checkWifiGuestProximity(),
        fetchOwnerProfile(vatNumber)
      ]).then(function (results) {
        var passport = results[0];
        var proximity = results[1];
        var ownerData = results[2];

        if (ownerData && ownerData.theme_accent) {
          applyThemeAccent(ownerData.theme_accent);
        }

        // Controlla se c'è un Job attivo per questo owner (priorità massima ripresa turno)
        // e se questa è la prima visita a questo owner specifico (nessuna voce
        // corrispondente in visited_owners del Passaporto).
        var activeJobRef = null;
        var isFirstVisit = true;
        if (passport && Array.isArray(passport.visited_owners)) {
          for (var i = 0; i < passport.visited_owners.length; i++) {
            if (passport.visited_owners[i].vat_number === vatNumber) {
              activeJobRef = passport.visited_owners[i].active_job_ref;
              isFirstVisit = false;
              break;
            }
          }
        }

        var onsite = !!(proximity && proximity.validated);
        var onsiteFlag = onsite ? 'true' : 'false';
        var ashParam = urlParams.get('ash') ? '&ash=' + encodeURIComponent(urlParams.get('ash')) : '';

        // Se c'è un lavoro già in corso, riprendi direttamente
        if (activeJobRef && activeJobRef.has_active_job && activeJobRef.job_id) {
          window.location.replace('booking.html?vat=' + encodeURIComponent(vatNumber) + '&job_id=' + encodeURIComponent(activeJobRef.job_id) + '&onsite=' + onsiteFlag + ashParam);
          return;
        }

        // Routing guidato da verticale e presenza: ecommerce.html è la
        // destinazione di default reale del sistema (ogni tenant vende
        // sempre sia servizi che prodotti, il sistema li drafta a vicenda).
        // Solo alla prima visita su una verticale a consulenza si atterra
        // su preventivi.html: prima si capisce il bisogno, poi si vende.
        var CONSULTATION_VERTICALS = ['dental', 'health', 'professional', 'construction'];
        var vertical = (ownerData && ownerData.vertical_id) ? String(ownerData.vertical_id) : '';
        var hasAnyCatalog = Boolean(ownerData && (ownerData.has_services || ownerData.has_products));

        if (!hasAnyCatalog) {
          // Rete di sicurezza: tenant senza nessun dato ancora configurato
          renderEmptyCatalogState(ownerData);
        } else if (isFirstVisit && CONSULTATION_VERTICALS.indexOf(vertical) !== -1) {
          window.location.replace('preventivi.html?vat=' + encodeURIComponent(vatNumber) + '&onsite=' + onsiteFlag + ashParam);
        } else {
          window.location.replace('ecommerce.html?vat=' + encodeURIComponent(vatNumber) + '&onsite=' + onsiteFlag + ashParam);
        }
      }).catch(function (err) {
        console.error('[CustomerRouter] Errore routing:', err);
        // Fallback di default sicuro su ecommerce.html
        var ashFallback = urlParams.get('ash') ? '&ash=' + encodeURIComponent(urlParams.get('ash')) : '';
        window.location.replace('ecommerce.html?vat=' + encodeURIComponent(vatNumber) + '&onsite=false' + ashFallback);
      });

      function renderEmptyCatalogState(owner) {
        var root = document.getElementById('routerRoot');
        if (!root) return;

        var brandName = (owner && owner.ragione_sociale) ? owner.ragione_sociale : 'Attività Partner';

        root.className = 'w-full max-w-sm flex flex-col items-center justify-center gap-4 animate-fade-in text-center';
        root.innerHTML = 
          '<div class="w-16 h-16 rounded-2xl flex items-center justify-center text-2xl mb-1" style="background: var(--accent-subtle); color: var(--accent);">' +
            '<i class="fa-solid fa-circle-info"></i>' +
          '</div>' +
          '<div>' +
            '<h1 class="text-lg font-bold text-white mb-1">' + escapeHtml(brandName) + '</h1>' +
            '<p class="text-xs text-slate-400 leading-relaxed max-w-xs">' +
              'Il catalogo di questa attività è in fase di configurazione. Torna presto a trovarci.' +
            '</p>' +
          '</div>' +
          '<button onclick="if(window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.close) { window.Telegram.WebApp.close(); }" class="mt-2 px-5 py-2.5 rounded-xl text-xs font-semibold bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-300 transition-all cursor-pointer">' +
            'Chiudi' +
          '</button>';
      }

      function escapeHtml(str) {
        if (!str) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function fetchOwnerProfile(vat) {
        return fetch('https://prod.workflow.trinai.it/webhook/customer_auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'get_owner_public_profile', vat_number: vat })
        }).then(function (r) {
          if (!r.ok) return null;
          return r.json();
        }).then(function (data) {
          return (data && data.owner_public) ? data.owner_public : null;
        }).catch(function () {
          return null;
        });
      }

    })();
  </script>
</body>
</html>
