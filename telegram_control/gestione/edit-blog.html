<!DOCTYPE html>
<html lang="it">

<head>
    <meta name="color-scheme" content="light">
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Content Architect | SiteBoS</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
(function() {
    // Riferimento locale e temporaneo all'SDK per il controllo iniziale
    const tempTg = window.Telegram?.WebApp;
    const isTelegramSession = tempTg && tempTg.initData && tempTg.initData !== "" && tempTg.platform !== "unknown";

    if (!isTelegramSession) {
        const currentPath = window.location.pathname;
        let redirectPath = "index.html";

        if (currentPath.includes('/telegram_control/')) {
            const parts = currentPath.split('/telegram_control/');
            const subPath = parts[1] || '';
            if (subPath.includes('/')) {
                redirectPath = "../../index.html";
            } else {
                redirectPath = "../index.html";
            }
        }

        window.location.replace(redirectPath);
    }
})();

        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#000000', bg: '#fafafa', border: '#eeeeee', danger: '#ef4444' },
                    borderRadius: { '3xl': '1.5rem' }
                }
            }
        }
    </script>
    <style>
        /* SiteBoS Architect Alignment & Design System */
        html, body {
            background-color: #f4f6f9 !important;
            color: #1e293b !important;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .section-card {
            background: #ffffff !important;
            border: 1px solid #e2e8f0 !important;
            border-radius: 1rem !important;
            padding: 1rem !important;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.04) !important;
            display: flex !important;
            flex-direction: column !important;
            gap: 0.75rem !important;
        }

        .section-card.accent-black { border-left: 3px solid #0f172a !important; }
        .section-card.accent-blue  { border-left: 3px solid #3b82f6 !important; }
        .section-card.accent-amber { border-left: 3px solid #f59e0b !important; }
        .section-card.accent-green { border-left: 3px solid #10b981 !important; }

        .section-label {
            font-size: 11px !important;
            font-weight: 900 !important;
            text-transform: uppercase !important;
            letter-spacing: 0.09em !important;
            color: #94a3b8 !important;
            display: flex !important;
            align-items: center !important;
            gap: 0.375rem !important;
            padding-left: 0.125rem !important;
            margin-bottom: 0.375rem !important;
        }

        .field-label {
            font-size: 10px !important;
            font-weight: 700 !important;
            text-transform: uppercase !important;
            letter-spacing: 0.07em !important;
            color: #94a3b8 !important;
            margin-bottom: 0.25rem !important;
            display: block !important;
        }

        textarea, input[type="text"] {
            font-family: 'Inter', sans-serif !important;
            font-size: 13px !important;
            font-weight: 600 !important;
            color: #1e293b !important;
            background: #f8fafc !important;
            border: 1px solid #e2e8f0 !important;
            border-radius: 0.625rem !important;
            padding: 0.625rem 0.75rem !important;
            width: 100% !important;
            box-sizing: border-box !important;
            resize: none !important;
            overflow: hidden !important;
            line-height: 1.55 !important;
            transition: border-color 0.15s, background 0.15s !important;
            word-break: break-word !important;
        }

        textarea:focus, input[type="text"]:focus {
            outline: none !important;
            border-color: #334155 !important;
            background: #ffffff !important;
        }

        .field-title {
            font-size: 15px !important;
            font-weight: 900 !important;
            color: #0f172a !important;
            line-height: 1.4 !important;
        }

        .stack-box {
            background: #f1f5f9 !important;
            border: 1px solid #cbd5e1 !important;
            border-left: 3px solid #64748b !important;
            border-radius: 0.625rem !important;
            padding: 0.75rem !important;
            display: flex !important;
            flex-direction: column !important;
            gap: 0.5rem !important;
        }
    </style>
</head>

<body class="safe-area-inset min-h-screen flex flex-col pb-24 bg-[#f4f6f9]">

    <!-- STICKY HEADER -->
    <header class="p-5 bg-white border-b border-gray-100 flex justify-between items-center z-50 shadow-sm shrink-0 sticky top-0">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-black rounded-xl flex items-center justify-center text-white shadow-xs">
                <i class="fas fa-file-alt text-sm"></i>
            </div>
            <div>
                <h1 class="text-[9px] font-black uppercase tracking-widest text-gray-500 leading-none mb-1">CONTENT ARCHITECT</h1>
                <p class="text-sm font-black tracking-tight" id="header-page-title">Editor Articolo Blog</p>
            </div>
        </div>
        <div class="flex gap-2">
            <!-- 1. Back to Menu Button -->
            <button id="btn-nav-back" onclick="goBackToMenu()" class="w-10 h-10 bg-white border border-gray-200 rounded-2xl flex items-center justify-center text-slate-500 shadow-sm active:scale-90 transition" title="Torna al Menu">
                <i class="fas fa-arrow-left text-xs"></i>
            </button>
            <!-- 2. Speech Audio Button -->
            <button id="btn-nav-audio" onclick="toggleAudio()" class="w-10 h-10 bg-white border border-gray-200 rounded-2xl flex items-center justify-center text-slate-500 shadow-sm active:scale-90 transition" title="Guida Vocale">
                <i class="fas fa-volume-high text-xs"></i>
            </button>
            <!-- 3. User Guide Button -->
            <button id="btn-nav-guide" onclick="openUserGuide('../userguide/02_catalogo.html')" class="w-10 h-10 bg-white border border-gray-200 rounded-2xl flex items-center justify-center text-slate-500 shadow-sm active:scale-90 transition" title="Manuale Utente">
                <i class="fas fa-globe text-xs"></i>
            </button>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="flex-1 max-w-md w-full mx-auto p-4 space-y-4 pb-32 fade-in-up" id="app-content">

        <!-- LOADER -->
        <div id="loader" class="hidden flex items-center justify-center p-4">
            <div class="spinner-border animate-spin w-6 h-6 border-2 border-black border-t-transparent rounded-full"></div>
        </div>

        <!-- COVER IMAGE -->
        <div>
            <span class="section-label"><i class="fas fa-image text-slate-400"></i> Immagine Copertina</span>
            <section class="section-card">
                <div id="imageBtn"
                    class="relative w-full aspect-video bg-slate-50 rounded-2xl overflow-hidden border border-slate-200 flex items-center justify-center cursor-pointer hover:bg-slate-100 transition"
                    onclick="document.getElementById('fileInput').click()">
                    <img id="featuredImage" src="" class="hidden w-full h-full object-cover">
                    <div id="imagePlaceholder" class="flex flex-col items-center text-slate-400 space-y-1">
                        <i class="fas fa-camera text-2xl mb-1 text-slate-400"></i>
                        <span class="text-[10px] font-black uppercase tracking-wider text-slate-500">Tocca per Caricare Foto</span>
                    </div>
                </div>
                <input type="file" id="fileInput" class="hidden" accept="image/*" onchange="previewFile(event)">
            </section>
        </div>

        <!-- SEO CONFIGURATION -->
        <div>
            <span class="section-label"><i class="fas fa-search text-slate-400"></i> Configurazione SEO</span>
            <section class="section-card accent-blue">
                <div>
                    <span class="field-label">Meta Title</span>
                    <textarea id="seo_meta_title" rows="1" class="field-title" placeholder="Meta Title SEO"></textarea>
                </div>
                <div>
                    <span class="field-label">Meta Description</span>
                    <textarea id="seo_meta_description" rows="2" placeholder="Breve sommario per i motori di ricerca..."></textarea>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <span class="field-label">Keywords</span>
                        <input type="text" id="seo_keywords" placeholder="Parola1, Parola2">
                    </div>
                    <div>
                        <span class="field-label">Slug URL</span>
                        <input type="text" id="seo_slug" placeholder="titolo-articolo">
                    </div>
                </div>
            </section>
        </div>

        <!-- HERO AREA -->
        <div>
            <span class="section-label"><i class="fas fa-heading text-slate-400"></i> Hero Area</span>
            <section class="section-card accent-black">
                <div>
                    <span class="field-label">Titolo H1 Principale</span>
                    <textarea id="hero_title" rows="1" class="field-title" placeholder="Titolo H1 dell'articolo"></textarea>
                </div>
                <div>
                    <span class="field-label">Sottotitolo</span>
                    <textarea id="hero_subtitle" rows="2" placeholder="Sottotitolo o sommario iniziale"></textarea>
                </div>
                <div>
                    <span class="field-label">Garantito / Risk Reversal</span>
                    <textarea id="hero_risk_reversal" rows="1" placeholder="Es. Risultato garantito o rimborso"></textarea>
                </div>
            </section>
        </div>

        <!-- DYNAMIC CONTENT SECTIONS -->
        <div id="mainContent" class="space-y-4"></div>

    </main>

    <!-- ACTION BAR (STILE ARCHITECT OUTLINE) -->
    <div class="fixed bottom-0 left-0 right-0 p-4 bg-white/95 backdrop-blur-md border-t border-gray-100 z-50">
        <div class="max-w-md mx-auto grid grid-cols-3 gap-2">
            <!-- 1. Elimina (Border Azzurro / Sky) -->
            <button onclick="deleteBlog()"
                class="py-3.5 px-3 bg-white border border-sky-400 text-sky-600 rounded-2xl font-black text-xs uppercase tracking-wider active:scale-95 transition flex items-center justify-center gap-1.5 shadow-xs hover:bg-sky-50">
                <i class="fas fa-trash-alt text-xs"></i> <span>Elimina</span>
            </button>
            <!-- 2. Salva (Border Slate) -->
            <button onclick="sendUpdate('save_blog')"
                class="py-3.5 px-3 bg-white border border-slate-300 text-slate-700 rounded-2xl font-black text-xs uppercase tracking-wider active:scale-95 transition flex items-center justify-center gap-1.5 shadow-xs hover:bg-slate-50">
                <i class="fas fa-save text-xs text-slate-500"></i> <span>Salva</span>
            </button>
            <!-- 3. Pubblica (Border Nero/Dark) -->
            <button onclick="confirmPublish()"
                class="py-3.5 px-3 bg-white border border-slate-900 text-slate-900 rounded-2xl font-black text-xs uppercase tracking-wider active:scale-95 transition flex items-center justify-center gap-1.5 shadow-xs hover:bg-slate-950 hover:text-white">
                <i class="fas fa-paper-plane text-xs"></i> <span>Pubblica</span>
            </button>
        </div>
    </div>

    <script>
        'use strict';
        const tg = window.Telegram.WebApp;
        if (tg.setHeaderColor) tg.setHeaderColor('#ffffff');
        const WEBHOOK_URL = "https://prod.workflow.trinai.it/webhook/914bd78e-8a41-46d7-8935-7eb73cbbae66";

        const urlParams = new URLSearchParams(window.location.search);
        let ash = urlParams.get('ash');
        let msg = urlParams.get('msg') || urlParams.get('message_id');
        const blogId = urlParams.get('sop_id') || urlParams.get('blog_id');

        if (ash && ash.includes('?msg=')) {
            const parts = ash.split('?msg=');
            ash = parts[0];
            if (!msg) msg = parts[1];
        }
        let currentData = null, base64Image = null;

        async function loadData() {
            if (!blogId) { console.error("ID blog mancante"); return; }
            toggleLoader(true);
            try {
                const r = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ _auth: tg.initData, action: 'get_blog', blog_id: blogId, ash: ash, msg: msg })
                });
                const res = await r.json();
                if (res.status === 'success') {
                    currentData = res.blog_content_structure;
                    renderEditor(res.image_url);
                }
            } catch (e) {
                console.error(e);
                if (tg.showAlert) tg.showAlert("Errore caricamento dati blog.");
            } finally {
                toggleLoader(false);
            }
        }

        function renderEditor(imageUrl) {
            if (imageUrl) {
                const img = document.getElementById('featuredImage');
                img.src = imageUrl + "?t=" + Date.now();
                img.classList.remove('hidden');
                document.getElementById('imagePlaceholder').classList.add('hidden');
            }
            if (currentData.seo) {
                document.getElementById('seo_meta_title').value = currentData.seo.meta_title || '';
                document.getElementById('seo_meta_description').value = currentData.seo.meta_description || '';
                document.getElementById('seo_keywords').value = currentData.seo.keywords || '';
                document.getElementById('seo_slug').value = currentData.seo.slug || '';
            }
            if (currentData.hero) {
                document.getElementById('hero_title').value = currentData.hero.title || '';
                document.getElementById('hero_subtitle').value = currentData.hero.subtitle || '';
                document.getElementById('hero_risk_reversal').value = currentData.hero.risk_reversal || '';
            }

            const container = document.getElementById('mainContent');
            container.innerHTML = '';
            if (currentData.problem) container.insertAdjacentHTML('beforeend', renderTextSection('problem', '01. Problema', 'fa-triangle-exclamation', true));
            if (currentData.solution) container.insertAdjacentHTML('beforeend', renderSolutionSection());
            if (currentData.authority) container.insertAdjacentHTML('beforeend', renderTextSection('authority', '03. Autorità', 'fa-award'));
            if (currentData.comparison) container.insertAdjacentHTML('beforeend', renderComparisonSection());
            if (currentData.cta_final) container.insertAdjacentHTML('beforeend', renderCTASection());
            if (currentData.faq) container.insertAdjacentHTML('beforeend', renderFAQSection());

            setTimeout(autoExpandTextareas, 60);
        }

        function autoExpandTextareas() {
            document.querySelectorAll('textarea').forEach(ta => {
                ta.style.height = 'auto';
                ta.style.height = (ta.scrollHeight + 6) + 'px';
                if (!ta.dataset.hasExpandListener) {
                    ta.dataset.hasExpandListener = 'true';
                    ta.addEventListener('input', () => {
                        ta.style.height = 'auto';
                        ta.style.height = (ta.scrollHeight + 6) + 'px';
                    });
                }
            });
        }

        function renderTextSection(key, label, icon, hasQuote = false) {
            const data = currentData[key] || { title: '', paragraphs: [] };
            const accentClass = key === 'problem' ? 'accent-amber' : 'accent-green';
            return `<div>
                <span class="section-label"><i class="fas ${icon} text-slate-400"></i> ${label}</span>
                <div class="section-card ${accentClass}">
                    <div>
                        <span class="field-label">Titolo</span>
                        <textarea rows="1" class="field-title" data-sec="${key}" data-field="title" placeholder="Titolo sezione">${data.title || ''}</textarea>
                    </div>
                    ${hasQuote && data.quote ? `<div>
                        <span class="field-label">Citazione / Quote</span>
                        <textarea rows="1" class="italic text-xs text-slate-700" data-sec="${key}" data-field="quote" placeholder="Citazione">${data.quote}</textarea>
                    </div>` : ''}
                    <div>
                        <span class="field-label">Contenuto</span>
                        <textarea rows="3" data-sec="${key}" data-field="paragraphs" placeholder="Paragrafi della sezione...">${(data.paragraphs || []).join('\n\n')}</textarea>
                    </div>
                </div>
            </div>`;
        }

        function renderSolutionSection() {
            const sol = currentData.solution || { title: '', paragraphs: [], subsection: { title: '', paragraphs: [] } };
            const sub = sol.subsection || { title: '', paragraphs: [] };
            return `<div>
                <span class="section-label"><i class="fas fa-lightbulb text-slate-400"></i> 02. Soluzione</span>
                <div class="section-card accent-black">
                    <div>
                        <span class="field-label">Titolo Soluzione</span>
                        <textarea rows="1" class="field-title" data-sec="solution" data-field="title" placeholder="Titolo soluzione">${sol.title || ''}</textarea>
                    </div>
                    <div>
                        <span class="field-label">Contenuto Soluzione</span>
                        <textarea rows="3" data-sec="solution" data-field="paragraphs" placeholder="Spiegazione della soluzione...">${(sol.paragraphs || []).join('\n\n')}</textarea>
                    </div>
                    <div class="stack-box">
                        <span class="field-label">Stack Tecnologico</span>
                        <div>
                            <span class="field-label">Titolo Stack</span>
                            <textarea rows="1" id="sol_sub_title" placeholder="Titolo dello stack">${sub.title || ''}</textarea>
                        </div>
                        <div>
                            <span class="field-label">Dettagli Stack</span>
                            <textarea rows="2" id="sol_sub_paragraphs" placeholder="Dettagli ed elenco tecnologie...">${(sub.paragraphs || []).join('\n\n')}</textarea>
                        </div>
                    </div>
                </div>
            </div>`;
        }

        function renderComparisonSection() {
            const comp = currentData.comparison || { title: '', table_html: '' };
            return `<div>
                <span class="section-label"><i class="fas fa-balance-scale text-slate-400"></i> 04. Confronto</span>
                <div class="section-card">
                    <div>
                        <span class="field-label">Titolo Confronto</span>
                        <textarea rows="1" class="field-title" data-sec="comparison" data-field="title" placeholder="Titolo tabella confronto">${comp.title || ''}</textarea>
                    </div>
                    <div>
                        <span class="field-label">Tabella Comparativa</span>
                        <div id="tableGrid" class="space-y-2 mt-1">${parseTable(comp.table_html || '')}</div>
                    </div>
                </div>
            </div>`;
        }

        function renderCTASection() {
            const cta = currentData.cta_final || { title: '', paragraphs: [], button_text: '' };
            return `<div>
                <span class="section-label"><i class="fas fa-bullhorn text-slate-400"></i> 05. Chiusura</span>
                <div class="section-card accent-blue">
                    <div>
                        <span class="field-label">Titolo Chiusura</span>
                        <textarea rows="1" class="field-title" data-sec="cta_final" data-field="title" placeholder="Titolo della chiamata all'azione">${cta.title || ''}</textarea>
                    </div>
                    <div>
                        <span class="field-label">Testo Chiusura</span>
                        <textarea rows="3" data-sec="cta_final" data-field="paragraphs" placeholder="Testo persuasivo finale...">${(cta.paragraphs || []).join('\n\n')}</textarea>
                    </div>
                    <div>
                        <span class="field-label">Testo Bottone Action</span>
                        <textarea rows="1" data-sec="cta_final" data-field="button_text" placeholder="Es. Richiedi una Consulenza">${cta.button_text || ''}</textarea>
                    </div>
                </div>
            </div>`;
        }

        function renderFAQSection() {
            let html = `<div>
                <span class="section-label"><i class="fas fa-circle-question text-slate-400"></i> FAQ Domande Frequenti</span>
                <div class="section-card">`;
            (currentData.faq || []).forEach((f, i) => {
                html += `<div class="pb-3 border-b border-slate-100 last:border-0 last:pb-0 space-y-2">
                    <div>
                        <span class="field-label">Domanda ${i + 1}</span>
                        <textarea rows="1" class="font-bold" id="faq_q_${i}" placeholder="Domanda...">${f.question || ''}</textarea>
                    </div>
                    <div>
                        <span class="field-label">Risposta ${i + 1}</span>
                        <textarea rows="2" id="faq_a_${i}" placeholder="Risposta dettagliata...">${f.answer || ''}</textarea>
                    </div>
                </div>`;
            });
            return html + `</div></div>`;
        }

        function parseTable(html) {
            if (!html) return '';
            const div = document.createElement('div'); div.innerHTML = html;
            const rows = div.querySelectorAll('tbody tr'); let out = '';
            for (let i = 0; i < 5; i++) {
                const tds = rows[i] ? rows[i].querySelectorAll('td') : [];
                out += `<div class="grid grid-cols-3 gap-2 table-row">
                    <textarea rows="1" class="text-xs text-center" placeholder="Caratteristica">${tds[0]?.innerText || ''}</textarea>
                    <textarea rows="1" class="text-xs text-center" placeholder="Tradizionale">${tds[1]?.innerText || ''}</textarea>
                    <textarea rows="1" class="text-xs font-bold text-center border-slate-900" placeholder="SiteBoS">${tds[2]?.innerText || ''}</textarea>
                </div>`;
            }
            return out;
        }

        function syncData() {
            if (!currentData) return;
            currentData.seo = {
                ...currentData.seo,
                meta_title: document.getElementById('seo_meta_title').value,
                meta_description: document.getElementById('seo_meta_description').value,
                keywords: document.getElementById('seo_keywords').value,
                slug: document.getElementById('seo_slug').value
            };
            if (currentData.hero) {
                currentData.hero.title = document.getElementById('hero_title').value;
                currentData.hero.subtitle = document.getElementById('hero_subtitle').value;
                currentData.hero.risk_reversal = document.getElementById('hero_risk_reversal').value;
            }
            document.querySelectorAll('[data-sec]').forEach(el => {
                const { sec, field } = el.dataset;
                if (currentData[sec]) {
                    if (field === 'paragraphs') currentData[sec][field] = el.value.split('\n\n').filter(p => p.trim());
                    else currentData[sec][field] = el.value;
                }
            });
            if (currentData.solution && currentData.solution.subsection) {
                currentData.solution.subsection.title = document.getElementById('sol_sub_title')?.value || '';
                currentData.solution.subsection.paragraphs = (document.getElementById('sol_sub_paragraphs')?.value || '').split('\n\n').filter(p => p.trim());
            }
            let tbody = '';
            document.querySelectorAll('.table-row').forEach(row => {
                const inputs = row.querySelectorAll('textarea');
                if (inputs[0] && inputs[0].value.trim()) tbody += `<tr><td>${inputs[0].value}</td><td>${inputs[1]?.value || ''}</td><td>${inputs[2]?.value || ''}</td></tr>`;
            });
            if (currentData.comparison) {
                currentData.comparison.table_html = `<table><thead><tr><th>F</th><th>T</th><th>S</th></tr></thead><tbody>${tbody}</tbody></table>`;
            }
            if (currentData.faq) {
                currentData.faq = currentData.faq.map((f, i) => ({
                    question: document.getElementById(`faq_q_${i}`)?.value || f.question,
                    answer: document.getElementById(`faq_a_${i}`)?.value || f.answer
                }));
            }
        }

        async function sendUpdate(action) {
            if (action !== 'delete_blog') syncData();
            toggleLoader(true);
            try {
                const r = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ _auth: tg.initData, action: action, blog_id: blogId, ash: ash, msg: msg, updated_content: currentData, new_image_base64: base64Image })
                });
                if (r.ok) {
                    if (tg.showAlert) tg.showAlert("SISTEMA AGGIORNATO.");
                    if (action === 'publish_blog' || action === 'delete_blog') {
                        setTimeout(() => goBackToMenu(), 1000);
                    }
                }
            } catch (err) {
                if (tg.showAlert) tg.showAlert("Errore durante il salvataggio.");
            } finally {
                toggleLoader(false);
            }
        }

        function deleteBlog() {
            if (tg.showConfirm) {
                tg.showConfirm("Eliminare definitivamente questo articolo?", (ok) => { if (ok) sendUpdate('delete_blog'); });
            } else if (confirm("Eliminare definitivamente questo articolo?")) {
                sendUpdate('delete_blog');
            }
        }

        function confirmPublish() {
            if (tg.showConfirm) {
                tg.showConfirm("Pubblicare live questo articolo?", (ok) => { if (ok) sendUpdate('publish_blog'); });
            } else if (confirm("Pubblicare live questo articolo?")) {
                sendUpdate('publish_blog');
            }
        }

        function previewFile(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                base64Image = ev.target.result.split(',')[1];
                document.getElementById('featuredImage').src = ev.target.result;
                document.getElementById('featuredImage').classList.remove('hidden');
                document.getElementById('imagePlaceholder').classList.add('hidden');
            };
            reader.readAsDataURL(file);
        }

        function toggleLoader(show) {
            const loader = document.getElementById('loader');
            if (loader) loader.classList.toggle('hidden', !show);
        }

        window.onload = loadData;
    </script>

    <!-- User Guide and Audio Guide Integration Engine -->
    <script>
    (function() {

        // 1. Determine HTML filename to play the correct WAV file
        const pathParts = window.location.pathname.split('/');
        const pageName = pathParts[pathParts.length - 1] || 'index.html';
        const baseName = pageName.replace('.html', '');
        
        let audioSrc = baseName + '.wav';
        if (baseName === 'add-product') audioSrc = 'catalog_add-product.wav';
        if (baseName === 'edit-product') audioSrc = 'catalog_edit-product.wav';

        // 2. Determine corresponding userguide page
        let guidePage = 'userguide/index.html';
        if (window.location.pathname.includes('/gestione/')) {
            guidePage = 'userguide/03_catalog.html';
        } else if (window.location.pathname.includes('/identity/')) {
            guidePage = 'userguide/02_onboarding.html';
        } else if (window.location.pathname.includes('/agents/')) {
            if (baseName.includes('controllo')) guidePage = 'userguide/09_controllo_gestione.html';
            else if (baseName.includes('sicurezza')) guidePage = 'userguide/11_agente_sicurezza.html';
            else guidePage = 'userguide/01_intro.html';
        } else {
            if (baseName === 'agenda') guidePage = 'userguide/10_agenda_radar.html';
            else if (baseName === 'certificator') guidePage = 'userguide/07_magazzino_logistica.html';
            else if (baseName === 'intelligent-warehouse') guidePage = 'userguide/07_magazzino_logistica.html';
            else if (baseName === 'orders-manager') guidePage = 'userguide/07_magazzino_logistica.html';
            else if (baseName === 'job-create') guidePage = 'userguide/07_magazzino_logistica.html';
            else if (baseName === 'pianificazione_itinerari') guidePage = 'userguide/07_magazzino_logistica.html';
            else if (baseName === 'fine-tuning') guidePage = 'userguide/12_fine_tuning.html';
            else if (baseName === 'risorse_umane') guidePage = 'userguide/06_team.html';
            else if (baseName === 'analisi-mercato') guidePage = 'userguide/09_controllo_gestione.html';
            else if (baseName === 'agent_intelligence') guidePage = 'userguide/09_controllo_gestione.html';
            else if (baseName === 'agenda') guidePage = 'userguide/10_agenda_radar.html';
            else if (baseName === 'assistente-sicurezza') guidePage = 'userguide/11_agente_sicurezza.html';
            else if (baseName === 'controllo_gestione') guidePage = 'userguide/09_controllo_gestione.html';
            else if (baseName === 'ecommerce') guidePage = 'userguide/04_online.html';
            else if (baseName === 'preventivi') guidePage = 'userguide/09_controllo_gestione.html';
        }

        // Calculate relative path depth
        const tcIndex = window.location.pathname.indexOf('/telegram_control/');
        let rootPath = '';
        if (tcIndex !== -1) {
            const subPath = window.location.pathname.substring(tcIndex + '/telegram_control/'.length);
            const slashCount = (subPath.match(/\//g) || []).length;
            rootPath = '../'.repeat(slashCount);
        }
        
        const finalGuideUrl = rootPath + guidePage;
        const finalAudioUrl = audioSrc;

        // 3. Inject Font Awesome stylesheet if missing
        if (!document.querySelector('link[href*="font-awesome"]') && !document.querySelector('link[href*="all.min.css"]')) {
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css';
            document.head.appendChild(link);
        }

        // 4. Inject Drawer HTML structure into Body
        const drawerHtml = `
        <div id="userguide-drawer-overlay" class="fixed inset-0 bg-slate-950/40 backdrop-blur-sm z-[99999] hidden opacity-0 transition-opacity duration-300" onclick="closeUserGuide()">
            <div id="userguide-drawer" class="fixed inset-0 max-w-md mx-auto h-screen bg-white shadow-2xl flex flex-col translate-y-full transition-transform duration-300 z-[100000]" onclick="event.stopPropagation()">
                <div class="w-full flex items-center justify-between p-4 border-b border-slate-100 shrink-0 select-none">
                    <div class="flex items-center gap-2">
                        <div class="w-2.5 h-2.5 rounded-full bg-blue-600 animate-pulse"></div>
                        <span class="text-xs font-black uppercase tracking-widest text-slate-800">Guida Utente</span>
                    </div>
                    <button onclick="closeUserGuide()" class="w-8 h-8 rounded-xl bg-slate-50 border border-slate-100 flex items-center justify-center text-slate-500 hover:bg-slate-100 active:scale-90 transition">
                        <i class="fas fa-times text-xs"></i>
                    </button>
                </div>
                <div class="flex-1 w-full overflow-hidden bg-slate-50 relative">
                    <iframe id="userguide-iframe" class="w-full h-full border-none" src=""></iframe>
                </div>
            </div>
        </div>`;
        document.body.insertAdjacentHTML('beforeend', drawerHtml);

        // 5. User Guide & Audio functions
        window.goBackToMenu = function() {
            if (window.Telegram?.WebApp?.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
            }
            if (window.parent && typeof window.parent.closeSubEditor === 'function') {
                window.parent.closeSubEditor();
            } else {
                location.href = `catalog.html?ash=${ash}&msg=${msg || ''}`;
            }
        };

        let voiceAudio = null;
        let isAudioPlaying = false;

        window.openUserGuide = function(url) {
            const overlay = document.getElementById('userguide-drawer-overlay');
            const drawer = document.getElementById('userguide-drawer');
            const iframe = document.getElementById('userguide-iframe');
            if (!overlay || !drawer || !iframe) return;

            window.stopAudio();
            
            iframe.src = url;
            overlay.classList.remove('hidden');
            setTimeout(() => {
                overlay.classList.remove('opacity-0');
                drawer.classList.remove('translate-y-full');
            }, 10);
        };

        window.closeUserGuide = function() {
            const overlay = document.getElementById('userguide-drawer-overlay');
            const drawer = document.getElementById('userguide-drawer');
            if (!overlay || !drawer) return;

            overlay.classList.add('opacity-0');
            drawer.classList.add('translate-y-full');
            setTimeout(() => {
                overlay.classList.add('hidden');
                document.getElementById('userguide-iframe').src = "";
            }, 300);
        };

        window.stopAudio = function() {
            if (isAudioPlaying && voiceAudio) {
                voiceAudio.pause();
                voiceAudio.currentTime = 0;
            }
            isAudioPlaying = false;
            voiceAudio = null;
            const btn = document.getElementById('btn-nav-audio');
            const icon = btn ? btn.querySelector('i') : null;
            if (icon) {
                icon.className = 'fas fa-volume-high text-xs';
            }
            if (btn) {
                btn.classList.remove('bg-black', 'text-white', 'border-black');
                btn.classList.add('bg-white', 'text-slate-500', 'border-gray-200');
            }
        };

        window.toggleAudio = function() {
            const btn = document.getElementById('btn-nav-audio');
            const icon = btn ? btn.querySelector('i') : null;

            if (!voiceAudio) {
                voiceAudio = new Audio(finalAudioUrl);
                voiceAudio.addEventListener('ended', () => {
                    isAudioPlaying = false;
                    voiceAudio.currentTime = 0;
                    if (icon) {
                        icon.className = 'fas fa-volume-high text-xs';
                        btn.classList.remove('bg-black', 'text-white', 'border-black');
                        btn.classList.add('bg-white', 'text-slate-500', 'border-gray-200');
                    }
                });
            }

            if (isAudioPlaying) {
                window.stopAudio();
            } else {
                voiceAudio.play().then(() => {
                    isAudioPlaying = true;
                    if (icon) {
                        icon.className = 'fas fa-stop text-xs';
                        btn.classList.remove('bg-white', 'text-slate-500', 'border-gray-200');
                        btn.classList.add('bg-black', 'text-white', 'border-black');
                    }
                }).catch(err => {
                    console.error("Errore riproduzione audio:", err);
                });
            }
        };
    })();
    </script>
