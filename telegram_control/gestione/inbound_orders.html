<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiTeBoS | Registro Ordini Inbound</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #090d16; color: #f3f4f6; }
    </style>
</head>
<body class="min-h-screen flex flex-col p-6 max-w-6xl mx-auto space-y-6">

    <!-- HEADER STRATEGICO INBOUND REGISTRY -->
    <header class="flex items-center justify-between bg-gray-900 border border-gray-800 p-5 rounded-3xl shadow-xl">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-2xl bg-amber-950 border border-amber-800 flex items-center justify-center text-amber-400 text-xl">
                <i class="fa-solid fa-boxes-packing"></i>
            </div>
            <div>
                <h1 class="text-lg font-black text-white">Registro Ordini Inbound</h1>
                <p class="text-xs text-gray-400">Tracciamento merci da Informatori Commerciali e Corrieri (Passaggio On-Tap & Vision a Magazzino)</p>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <button onclick="refreshOrders()" class="px-4 py-2.5 rounded-xl bg-gray-800 hover:bg-gray-700 text-white font-bold text-xs flex items-center gap-2">
                <i class="fa-solid fa-rotate-right"></i>
                <span>Aggiorna Registro</span>
            </button>
        </div>
    </header>

    <!-- FILTRI STATO & CONTROLLI SCAN -->
    <div class="flex items-center justify-between gap-4 bg-gray-900/60 border border-gray-800 p-4 rounded-2xl">
        <div class="flex items-center gap-2">
            <button onclick="filterStatus('ALL')" class="filter-btn px-3 py-1.5 rounded-xl bg-cyan-600 text-white font-bold text-xs">Tutti gli Ordini</button>
            <button onclick="filterStatus('PENDING_ARRIVAL')" class="filter-btn px-3 py-1.5 rounded-xl bg-gray-800 text-gray-400 hover:text-white font-bold text-xs">In Attesa Arrivo</button>
            <button onclick="filterStatus('ARRIVED_COMPLETE')" class="filter-btn px-3 py-1.5 rounded-xl bg-gray-800 text-gray-400 hover:text-white font-bold text-xs">Completati a Magazzino</button>
        </div>

        <div class="flex items-center gap-2">
            <input type="file" id="ddt-scan-input" accept="image/*" class="hidden" onchange="handleDdtScan(event)">
            <button onclick="document.getElementById('ddt-scan-input').click()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold text-xs px-4 py-2 rounded-xl transition-all flex items-center gap-2">
                <i class="fa-solid fa-camera"></i>
                <span>Scansiona Foto DDT Corriere</span>
            </button>
        </div>
    </div>

    <!-- TABELLA REGISTRO ORDINI INBOUND -->
    <main class="bg-gray-900 border border-gray-800 rounded-3xl overflow-hidden shadow-2xl">
        <table class="w-full text-left text-xs">
            <thead class="bg-gray-950 text-gray-400 uppercase font-extrabold tracking-wider border-b border-gray-800">
                <tr>
                    <th class="p-4">Rif. Ordine</th>
                    <th class="p-4">Origine / Fornitore</th>
                    <th class="p-4">Data Ordine</th>
                    <th class="p-4">Stato Arrivo</th>
                    <th class="p-4">Prodotti / Colli</th>
                    <th class="p-4 text-right">Azione Magazzino</th>
                </tr>
            </thead>
            <tbody id="inbound-orders-table-body" class="divide-y divide-gray-800/60 font-medium text-gray-300">
                <!-- Popolato da JS -->
            </tbody>
        </table>
    </main>

    <script>
        let ordersData = [];

        document.addEventListener('DOMContentLoaded', () => {
            refreshOrders();
        });

        async function refreshOrders() {
            // Mock dati ordini inbound
            ordersData = [
                { id: 'ORD-IN-101', source: 'Informatore: Mario Commerciale', date: '02/08/2026', status: 'PENDING_ARRIVAL', items_count: 15, pdf_url: '#' },
                { id: 'ORD-IN-102', source: 'Corriere DDT #8849', date: '08/08/2026', status: 'ARRIVED_COMPLETE', items_count: 3, pdf_url: '#' }
            ];
            renderOrders(ordersData);
        }

        function renderOrders(list) {
            const tbody = document.getElementById('inbound-orders-table-body');
            tbody.innerHTML = list.map(item => `
                <tr class="hover:bg-gray-800/40 transition">
                    <td class="p-4 font-mono font-bold text-white">${item.id}</td>
                    <td class="p-4 font-bold text-gray-200">${item.source}</td>
                    <td class="p-4 text-gray-400">${item.date}</td>
                    <td class="p-4">
                        <span class="px-2.5 py-1 rounded-full font-bold text-[10px] ${item.status === 'ARRIVED_COMPLETE' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-amber-950 text-amber-400 border border-amber-800'}">
                            ${item.status === 'ARRIVED_COMPLETE' ? '✅ IN MAGAZZINO' : '📦 IN ATTESA ARRIVO'}
                        </span>
                    </td>
                    <td class="p-4 font-semibold text-gray-300">${item.items_count} articoli</td>
                    <td class="p-4 text-right space-x-2">
                        ${item.status === 'PENDING_ARRIVAL' ? `
                            <button onclick="confirmStockArrival('${item.id}')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-[11px] px-3 py-1.5 rounded-xl transition shadow">
                                ✅ Passa in Magazzino (On-Tap)
                            </button>
                        ` : `
                            <span class="text-gray-500 italic text-[11px]">Giacenze aggiornate</span>
                        `}
                    </td>
                </tr>
            `).join('');
        }

        async function confirmStockArrival(orderId) {
            const res = await fetch('/webhook/inbound-order-confirm', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ order_id: orderId })
            });
            alert('Scorte caricate a magazzino con successo!');
            refreshOrders();
        }

        async function handleDdtScan(event) {
            if (event.target.files.length > 0) {
                alert('Foto DDT inviata a Gemini Vision per il matching automatico con gli ordini informatore.');
            }
        }
    </script>
</body>
</html>
