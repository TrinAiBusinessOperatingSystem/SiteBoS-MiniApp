<!DOCTYPE html>
<html lang="it">

<head>
    <meta name="color-scheme" content="light">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title data-i18n="page_title">Nuova Categoria</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="../twa_global_launch.js"></script>
    <script src="../sitebos_dirty_guard.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* SiteBoS Architect Alignment */
        html, body {
            background-color: #fafafa !important;
            color: #000000 !important;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            scrollbar-width: none !important;
            -ms-overflow-style: none !important;
        }

        html::-webkit-scrollbar, body::-webkit-scrollbar {
            display: none !important;
        }

        .macro-carousel-container {
            position: relative;
            width: 100%;
            height: 44px;
            perspective: 800px;
            transform-style: preserve-3d;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .macro-tab-item-3d {
            position: absolute;
            width: 140px;
            text-align: center;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), 
                        opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                        color 0.3s ease;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            backface-visibility: hidden;
        }

        .card,
        .section-card,
        .dark-card,
        .upload-box {
            background: white !important;
            border: 1px solid #e2e8f0 !important;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05) !important;
            border-radius: 1rem !important;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #000000 !important;
            box-shadow: none !important;
            outline: none !important;
        }

        /* Forza icone pesanti */
        .fas,
        .far,
        .fal {
            font-weight: 900 !important;
            font-family: "Font Awesome 6 Free" !important;
        }

        .upload-box {
            border: 2px dashed #cbd5e1 !important;
            padding: 1.5rem;
            text-align: center;
            background: #f8fafc !important;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .upload-box.success {
            border-color: #10b981 !important;
            background: rgba(16, 185, 129, 0.05) !important;
        }

        .upload-box input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }

        /* Checkbox styling */
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.5rem;
        }

        .checkbox-group input[type="checkbox"] {
            width: 1.25rem;
            height: 1.25rem;
            accent-color: #000000;
        }
    </style>
</head>

<body class="safe-area-inset min-h-screen flex flex-col pb-24 bg-[#fafafa]">

    <!-- STICKY HEADER -->
    <header class="p-5 bg-white border-b border-gray-100 flex justify-between items-center z-50 shadow-sm shrink-0 sticky top-0">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-black rounded-xl flex items-center justify-center text-white shadow-xs">
                <i class="fas fa-folder-plus text-sm"></i>
            </div>
            <div>
                <h1 class="text-[9px] font-black uppercase tracking-widest text-gray-500 leading-none mb-1">GESTIONE CATALOGO</h1>
                <p class="text-sm font-black tracking-tight" id="header-page-title">Nuova Categoria</p>
            </div>
        </div>
        <div class="flex gap-2">
            <!-- 1. Back to Menu Button -->
            <button id="btn-nav-back" onclick="goBackToMenu()" class="w-10 h-10 bg-white border border-gray-200 rounded-2xl flex items-center justify-center text-slate-500 shadow-sm active:scale-90 transition" title="Torna al Menu">
                <i class="fas fa-arrow-left text-xs"></i>
            </button>
            <!-- 2. Speech Audio Button -->
            <button id="btn-nav-audio" onclick="toggleAudio()" class="w-10 h-10 bg-white border border-gray-200 rounded-2xl flex items-center justify-center text-slate-500 shadow-sm active:scale-90 transition" title="Guida Vocale">
                <i class="fas fa-volume-high text-xs"></i>
            </button>
            <!-- 3. User Guide Button -->
            <button id="btn-nav-guide" onclick="openUserGuide('../userguide/01_intro.html')" class="w-10 h-10 bg-white border border-gray-200 rounded-2xl flex items-center justify-center text-slate-500 shadow-sm active:scale-90 transition" title="Manuale Utente">
                <i class="fas fa-globe text-xs"></i>
            </button>
        </div>
    </header>

    <!-- LOADER -->
    <div id="loader"
        class="fixed inset-0 flex flex-col items-center justify-center bg-black/60 backdrop-blur-sm z-50 transition-opacity duration-300 hidden text-white">
        <div class="spinner-border animate-spin inline-block w-8 h-8 border-4 border-white border-t-transparent rounded-full" role="status">
        </div>
        <div id="loader-text" class="mt-4 text-xs font-bold uppercase tracking-wider">AI al Lavoro...</div>
    </div>

    <!-- MAIN CONTAINER -->
    <main class="flex-1 max-w-md w-full mx-auto p-5 space-y-5 fade-in-up" id="app-content">

        <!-- MACRO SELECTOR CAROUSEL (3D Cylindrical Horizontal) -->
        <div id="macro-carousel-wrapper" class="w-full select-none z-40 py-0.5 bg-white border border-gray-200 rounded-2xl shadow-xs backdrop-blur-sm shrink-0 flex items-center justify-between mx-auto relative my-1">
            <button type="button" onclick="navigateMacro(-1)" class="w-8 h-8 flex items-center justify-center text-slate-400 hover:text-slate-900 transition active:scale-75 shrink-0 z-50">
                <i class="fas fa-chevron-left text-xs"></i>
            </button>
            <div id="macro-carousel" class="macro-carousel-container flex-1 overflow-visible relative h-[3.5rem] flex items-center justify-center">
                <button type="button" onclick="setMacro('SOP')" id="card-macro-SOP" class="macro-tab-item-3d bg-white border border-gray-300 shadow-xs py-2 px-6 rounded-2xl flex items-center justify-center gap-2 transition-all cursor-pointer">
                    <span class="text-base">📋</span>
                    <span class="text-[10px] font-black uppercase tracking-wider text-slate-900">Procedure</span>
                </button>
                <button type="button" onclick="setMacro('SER')" id="card-macro-SER" class="macro-tab-item-3d bg-white/40 border border-gray-200 py-2 px-6 rounded-2xl flex items-center justify-center gap-2 transition-all cursor-pointer">
                    <span class="text-base opacity-60">🛠️</span>
                    <span class="text-[10px] font-extrabold uppercase tracking-wider text-slate-400">Servizi</span>
                </button>
                <button type="button" onclick="setMacro('PRO')" id="card-macro-PRO" class="macro-tab-item-3d bg-white/40 border border-gray-200 py-2 px-6 rounded-2xl flex items-center justify-center gap-2 transition-all cursor-pointer">
                    <span class="text-base opacity-60">📦</span>
                    <span class="text-[10px] font-extrabold uppercase tracking-wider text-slate-400">Prodotti</span>
                </button>
            </div>
            <button type="button" onclick="navigateMacro(1)" class="w-8 h-8 flex items-center justify-center text-slate-400 hover:text-slate-900 transition active:scale-75 shrink-0 z-50">
                <i class="fas fa-chevron-right text-xs"></i>
            </button>
        </div>

        <!-- FASE 1: INPUT UNICO -->
        <div id="inputPhase">

            <div class="dark-card rounded-2xl p-5 mb-5 space-y-4">
                <div>
                    <label for="categoryName" class="block text-xs font-black uppercase tracking-wider text-gray-500 mb-2 required"
                        data-i18n="lblCatName">Nome Categoria</label>
                    <input type="text" id="categoryName" required placeholder="Es. Diagnostica Digitale"
                        class="w-full p-3.5 rounded-xl bg-white border border-gray-200 focus:ring-0 focus:border-black text-black font-semibold text-sm">
                </div>

                <div>
                    <label for="categoryDescription" class="block text-xs font-black uppercase tracking-wider text-gray-500 mb-2"
                        data-i18n="lblCatDesc">Descrizione (Opzionale)</label>
                    <textarea id="categoryDescription" rows="2" placeholder="Breve descrizione dell'area..."
                        class="w-full p-3.5 rounded-xl bg-white border border-gray-200 focus:ring-0 focus:border-black text-black font-medium text-xs"></textarea>
                </div>

                <div class="flex items-center text-center my-4 text-gray-400 text-[9px] font-black uppercase tracking-widest">
                    <div class="flex-1 border-b border-gray-200 mr-3"></div>
                    <span data-i18n="divider_text">E / O CARICA LISTINO (PDF/JSON)</span>
                    <div class="flex-1 border-b border-gray-200 ml-3"></div>
                </div>

                <div class="upload-box" id="file-upload-box">
                    <input type="file" id="file-input" accept=".pdf,.json,.txt,.csv">
                    <div class="upload-icon text-3xl mb-2 text-gray-400"><i class="fas fa-file-upload"></i></div>
                    <span class="upload-text text-xs font-bold text-gray-500 block" id="upload-text"
                        data-i18n="upload_hint">Tocca per caricare File</span>
                    <div id="file-name-display" class="text-xs text-emerald-600 mt-2 font-black"></div>
                </div>
            </div>

            <button id="generateBtn"
                class="w-full bg-black text-white font-black text-xs uppercase tracking-widest py-4 px-4 rounded-xl mb-6 shadow-sm hover:bg-gray-900 transition flex items-center justify-center gap-2 active:scale-[0.98]">
                <i class="fas fa-magic text-xs"></i> <span data-i18n="btnGenerate">Genera Servizi</span>
            </button>
        </div>

        <!-- FASE 2: REVISIONE -->
        <div id="reviewPhase" class="hidden fade-in">
            <div class="dark-card rounded-2xl p-5 mb-6 space-y-4">
                <h3 data-i18n="subcatTitle" class="text-xs font-black uppercase tracking-wider text-black pb-2 border-b border-gray-100">Servizi Rilevati
                </h3>
                <ul id="subcategoriesList" class="mb-5"></ul>

                <div class="mt-4 pt-4 border-t border-gray-100">
                    <label data-i18n="lblManualAdd" class="block text-xs font-black uppercase tracking-wider text-gray-500 mb-2">Aggiungi
                        Manualmente</label>
                    <div class="flex gap-2">
                        <input type="text" id="manualSubcat" placeholder="Altro servizio..."
                            class="flex-1 p-3 rounded-xl bg-white border border-gray-200 focus:ring-0 focus:border-black text-black font-semibold text-xs">
                        <button id="addSubcatBtn"
                            class="bg-black text-white px-4 py-3 rounded-xl hover:bg-gray-800 transition-colors active:scale-95">
                            <i class="fas fa-plus text-xs"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div style="height: 80px;"></div>
        </div>

    </main>

    <script>
(function() {
    // Riferimento locale e temporaneo all'SDK per il controllo iniziale
    const tempTg = window.Telegram?.WebApp;
    const isTelegramSession = tempTg && tempTg.initData && tempTg.initData !== "" && tempTg.platform !== "unknown";

    if (!isTelegramSession) {
        const currentPath = window.location.pathname;
        let redirectPath = "index.html";

        if (currentPath.includes('/telegram_control/')) {
            const parts = currentPath.split('/telegram_control/');
            const subPath = parts[1] || '';
            if (subPath.includes('/')) {
                redirectPath = "../../index.html";
            } else {
                redirectPath = "../index.html";
            }
        }

        window.location.replace(redirectPath);
    }
})();

        /**
         * ADD CATEGORY LOGIC (v3.0 - SIMPLE & FLAT)
         * - Single Form Flow: Name (Req) + Desc (Opt) + File (Opt) -> One Button.
         * - Full 6-language I18N.
         */

        'use strict';

        // CONFIG
        const GENERATE_WEBHOOK_URL = "https://prod.workflow.trinai.it/webhook/5e225cf6-76bb-4e19-8657-35cac49fd399";
        const SAVE_WEBHOOK_URL = "https://prod.workflow.trinai.it/webhook/7da6f424-dc2a-4476-a0bd-a3bfd21270fb";

        const tg = window.Telegram.WebApp;
        if (tg.setHeaderColor) tg.setHeaderColor('#ffffff');
        if (tg.setBackgroundColor) tg.setBackgroundColor('#ffffff');
        tg.ready(); tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        let ash = urlParams.get('ash');
        let msg = urlParams.get('msg');
        let selectedMacro = urlParams.get('macro') || 'SOP';
        let generatedCategoryData = null;

        window.goBackToMenu = function() {
            if (window.parent && typeof window.parent.closeSubEditor === 'function') {
                window.parent.closeSubEditor();
            } else {
                window.location.href = `catalog.html?ash=${ash || ''}&msg=${msg || ''}`;
            }
        };

        if (ash && ash.includes('?msg=')) {
            const parts = ash.split('?msg=');
            ash = parts[0];
            if (!msg) msg = parts[1];
        }

        // I18N COMPLETE
        const i18n = {
            it: {
                page_title: "Nuova Categoria", title: "➥ Nuova Categoria", subtitle: "Configura la nuova area di business.",
                lblCatName: "Nome Categoria", lblCatDesc: "Descrizione (Opzionale)",
                divider_text: "E / O CARICA LISTINO (PDF/JSON)",
                upload_hint: "Tocca per caricare File",
                btnGenerate: "Genera Servizi",
                subcatTitle: "Revisione Servizi", lblManualAdd: "Aggiungi altro...",
                btnSave: "Conferma e Salva",
                status_analyzing: "Analisi in corso...", status_saving: "Salvataggio...",
                status_success: "✅ Categoria Creata!",
                err_name_req: "Il nome della categoria è obbligatorio!",
                err_generic: "Errore. Riprova."
            },
            en: {
                page_title: "New Category", title: "➥ New Category", subtitle: "Setup new business area.",
                lblCatName: "Category Name", lblCatDesc: "Description (Optional)",
                divider_text: "AND / OR UPLOAD LIST (PDF/JSON)",
                upload_hint: "Tap to upload File",
                btnGenerate: "Generate Services",
                subcatTitle: "Review Services", lblManualAdd: "Add more...",
                btnSave: "Confirm & Save",
                status_analyzing: "Analyzing...", status_saving: "Saving...",
                status_success: "✅ Category Created!",
                err_name_req: "Category name is required!",
                err_generic: "Error. Retry."
            },
            fr: {
                page_title: "Nouvelle Catégorie", title: "➥ Nouvelle Catégorie", subtitle: "Configurez la nouvelle zone.",
                lblCatName: "Nom Catégorie", lblCatDesc: "Description (Optionnel)",
                divider_text: "ET / OU CHARGER FICHIER",
                upload_hint: "Touchez pour charger",
                btnGenerate: "Générer Services",
                subcatTitle: "Révision Services", lblManualAdd: "Ajouter...",
                btnSave: "Confirmer & Enregistrer",
                status_analyzing: "Analyse...", status_saving: "Enregistrement...",
                status_success: "✅ Créée !",
                err_name_req: "Nom requis !",
                err_generic: "Erreur. Réessayer."
            },
            de: {
                page_title: "Neue Kategorie", title: "➥ Neue Kategorie", subtitle: "Neuen Bereich einrichten.",
                lblCatName: "Kategoriename", lblCatDesc: "Beschreibung (Optional)",
                divider_text: "UND / ODER DATEI LADEN",
                upload_hint: "Tippen zum Laden",
                btnGenerate: "Dienste Generieren",
                subcatTitle: "Dienste Überprüfen", lblManualAdd: "Hinzufügen...",
                btnSave: "Bestätigen & Speichern",
                status_analyzing: "Analysiere...", status_saving: "Speichern...",
                status_success: "✅ Erstellt!",
                err_name_req: "Name erforderlich!",
                err_generic: "Fehler. Wiederholen."
            },
            es: {
                page_title: "Nueva Categoría", title: "➥ Nueva Categoría", subtitle: "Configura nueva área.",
                lblCatName: "Nombre Categoría", lblCatDesc: "Descripción (Opcional)",
                divider_text: "Y / O CARGAR ARCHIVO",
                upload_hint: "Toca para cargar",
                btnGenerate: "Generar Servicios",
                subcatTitle: "Revisar Servicios", lblManualAdd: "Añadir...",
                btnSave: "Confirmar y Guardar",
                status_analyzing: "Analizando...", status_saving: "Guardando...",
                status_success: "✅ ¡Creada!",
                err_name_req: "¡Nombre obligatorio!",
                err_generic: "Error. Reintentar."
            },
            pt: {
                page_title: "Nova Categoria", title: "➥ Nova Categoria", subtitle: "Configurar nova área.",
                lblCatName: "Nome Categoria", lblCatDesc: "Descrição (Opcional)",
                divider_text: "E / OU CARREGAR ARQUIVO",
                upload_hint: "Toque para carregar",
                btnGenerate: "Gerar Serviços",
                subcatTitle: "Revisar Serviços", lblManualAdd: "Adicionar...",
                btnSave: "Confirmar e Salvar",
                status_analyzing: "Analisando...", status_saving: "Salvando...",
                status_success: "✅ Criada!",
                err_name_req: "Nome obrigatório!",
                err_generic: "Erro. Tente novamente."
            }
        };

        const lang = (urlParams.get('lang') || tg.initDataUnsafe?.user?.language_code || 'it').slice(0, 2);
        const t = i18n[lang] || i18n.it; // Fallback su IT se manca lingua

        // DOM
        const dom = {
            loader: document.getElementById('loader'),
            loaderText: document.getElementById('loader-text'),
            content: document.getElementById('app-content'),
            inputPhase: document.getElementById('inputPhase'),
            reviewPhase: document.getElementById('reviewPhase'),
            subcatList: document.getElementById('subcategoriesList'),
            catName: document.getElementById('categoryName'),
            catDesc: document.getElementById('categoryDescription'),
            manualInput: document.getElementById('manualSubcat'),
            fileInput: document.getElementById('file-input'),
            fileBox: document.getElementById('file-upload-box'),
            fileText: document.getElementById('upload-text'),
            fileName: document.getElementById('file-name-display')
        };

        function init() {
            // Apply Translations
            document.title = t.page_title;
            for (const key in t) {
                const el = document.querySelector(`[data-i18n="${key}"]`);
                if (el) el.innerText = t[key];
            }
            dom.manualInput.placeholder = t.manualPlaceholder || "...";

            // Macro Init
            setMacro(selectedMacro);

            // Bind Events
            document.getElementById('generateBtn').addEventListener('click', handleGenerate);
            document.getElementById('addSubcatBtn').addEventListener('click', addManualSubcat);
            document.getElementById('saveBtn').addEventListener('click', saveCategory);

            dom.fileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    dom.fileBox.classList.add('success');
                    dom.fileName.innerText = e.target.files[0].name;
                } else {
                    dom.fileBox.classList.remove('success');
                    dom.fileName.innerText = "";
                }
            });

            // Sponsor Init removed
        }

        // RESET FORM
        window.resetForm = function () {
            dom.reviewPhase.classList.add('hidden');
            dom.inputPhase.classList.remove('hidden');
            dom.fileInput.value = '';
            dom.fileBox.classList.remove('success');
            dom.fileName.innerText = "";
            generatedCategoryData = null;

            // 👉 NASCONDI FAB SALVA
            const saveFab = document.getElementById('saveBtn');
            if (saveFab) saveFab.classList.add('hidden');
        }

        async function handleGenerate() {
            const name = dom.catName.value.trim();
            if (!name) return tg.showAlert(t.err_name_req);

            // Mostra Loader con Sponsor
            showLoader(t.status_analyzing);

            const payload = {
                category_name: name,
                category_description: dom.catDesc.value,
                _auth: tg.initData,
                ash: ash,
                language: lang
            };

            if (dom.fileInput.files.length > 0) {
                try {
                    const fileData = await readFile(dom.fileInput.files[0]);
                    payload.file_data = fileData.base64;
                    payload.mime_type = fileData.mime;
                } catch (e) {
                    console.error("File read error", e);
                }
            }

            try {
                const res = await fetch(GENERATE_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) throw new Error(`HTTP ${res.status}`);

                const jsonResponse = await res.json();
                const data = Array.isArray(jsonResponse) ? jsonResponse[0] : jsonResponse;

                handleAnalysisResult(data);

            } catch (e) {
                handleError(e);
            }
        }

        function handleAnalysisResult(data) {
            generatedCategoryData = data;
            if (data.name) dom.catName.value = data.name;
            if (data.description) dom.catDesc.value = data.description;

            dom.subcatList.innerHTML = '';
            if (data.subcategories) {
                data.subcategories.forEach(sub => createListItem(sub.name, sub.short_name));
            }

            dom.inputPhase.classList.add('hidden');
            dom.reviewPhase.classList.remove('hidden');

            // 👉 MOSTRA FAB SALVA
            const saveFab = document.getElementById('saveBtn');
            if (saveFab) saveFab.classList.remove('hidden');

            hideLoader();
        }

        function createListItem(name, display) {
            const li = document.createElement('li');
            li.className = 'mb-2';
            li.innerHTML = `
        <div class="checkbox-group">
            <input type="checkbox" checked value="${name}" data-short="${display}" id="chk_${name.replace(/[^a-zA-Z0-9]/g, '_')}">
            <label for="chk_${name.replace(/[^a-zA-Z0-9]/g, '_')}" class="text-sm font-medium">${display}</label>
        </div>`;
            dom.subcatList.appendChild(li);
        }

        function addManualSubcat() {
            const val = dom.manualInput.value.trim();
            if (val) { createListItem(val, val); dom.manualInput.value = ''; }
        }

        function readFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve({
                    base64: reader.result.split(',')[1],
                    mime: reader.result.match(/:(.*?);/)[1]
                });
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        async function saveCategory() {
            // 1. Validazione base
            if (!dom.catName.value) {
                alert(t.err_name_req || "Nome obbligatorio");
                return;
            }

            // 2. Loader
            showLoader(t.status_saving || "Salvataggio...");

            // 3. Preparazione Dati
            const selected = [];
            dom.subcatList.querySelectorAll('input:checked').forEach(cb => {
                selected.push({
                    name: cb.value,
                    short_name: cb.dataset.short,
                    callback_data: cb.value.toUpperCase().replace(/[^A-Z0-9\s]/g, '').replace(/\s/g, '_').substring(0, 60)
                });
            });

            const payload = {
                _auth: tg.initData,
                ash: ash,
                msg: msg,
                new_category_block: {
                    name: dom.catName.value,
                    description: dom.catDesc.value,
                    macrocategories: selectedMacro,
                    short_name: generatedCategoryData?.short_name || dom.catName.value,
                    callback_data: generatedCategoryData?.callback_data || dom.catName.value.toUpperCase().replace(/[^A-Z0-9\s]/g, '').replace(/\s/g, '_').substring(0, 60),
                    subcategories: selected
                }
            };

            try {
                fetch(SAVE_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                    keepalive: true
                });

                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                setTimeout(() => {
                    tg.close();
                }, 3000);

            } catch (e) {
                handleError(e);
            }
        }

        // UI UTILS AGGIORNATI
        function showLoader(text) {
            if (dom.loaderText) dom.loaderText.innerText = text;
            dom.loader.classList.remove('hidden');
        }

        function hideLoader() {
            dom.loader.classList.add('hidden');
        }

        function handleError(error) {
            console.error(error);
            hideLoader();
            tg.showAlert(t.err_generic);
        }

        const macrosList = ['SOP', 'SER', 'PRO'];

        window.navigateMacro = function(direction) {
            if (window.Telegram?.WebApp?.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
            }
            let currIdx = macrosList.indexOf(selectedMacro);
            if (currIdx === -1) currIdx = 0;
            let nextIdx = (currIdx + direction + macrosList.length) % macrosList.length;
            setMacro(macrosList[nextIdx]);
        };

        window.setMacro = function(m) {
            selectedMacro = m;
            let macroIdx = macrosList.indexOf(m);
            if (macroIdx === -1) macroIdx = 0;

            macrosList.forEach((mKey, idx) => {
                const card = document.getElementById(`card-macro-${mKey}`);
                if (!card) return;
                let diff = idx - macroIdx;
                if (diff > 1) diff -= macrosList.length;
                if (diff < -1) diff += macrosList.length;

                if (diff === 0) {
                    // Active center card
                    card.style.transform = 'translateX(0%) scale(1) translateZ(0px)';
                    card.style.opacity = '1';
                    card.style.zIndex = '30';
                    card.classList.remove('bg-white/40', 'border-gray-200');
                    card.classList.add('bg-white', 'border-gray-300', 'shadow-xs');
                    const iconSpan = card.querySelector('span:first-child');
                    if (iconSpan) iconSpan.classList.remove('opacity-60');
                    const txtSpan = card.querySelector('span:last-child');
                    if (txtSpan) {
                        txtSpan.classList.remove('text-slate-400', 'font-extrabold');
                        txtSpan.classList.add('text-slate-900', 'font-black');
                    }
                } else if (diff === 1 || diff === -2) {
                    // Right card
                    card.style.transform = 'translateX(65%) scale(0.82) translateZ(-50px)';
                    card.style.opacity = '0.5';
                    card.style.zIndex = '10';
                    card.classList.remove('bg-white', 'border-gray-300', 'shadow-xs');
                    card.classList.add('bg-white/40', 'border-gray-200');
                    const iconSpan = card.querySelector('span:first-child');
                    if (iconSpan) iconSpan.classList.add('opacity-60');
                    const txtSpan = card.querySelector('span:last-child');
                    if (txtSpan) {
                        txtSpan.classList.remove('text-slate-900', 'font-black');
                        txtSpan.classList.add('text-slate-400', 'font-extrabold');
                    }
                } else {
                    // Left card
                    card.style.transform = 'translateX(-65%) scale(0.82) translateZ(-50px)';
                    card.style.opacity = '0.5';
                    card.style.zIndex = '10';
                    card.classList.remove('bg-white', 'border-gray-300', 'shadow-xs');
                    card.classList.add('bg-white/40', 'border-gray-200');
                    const iconSpan = card.querySelector('span:first-child');
                    if (iconSpan) iconSpan.classList.add('opacity-60');
                    const txtSpan = card.querySelector('span:last-child');
                    if (txtSpan) {
                        txtSpan.classList.remove('text-slate-900', 'font-black');
                        txtSpan.classList.add('text-slate-400', 'font-extrabold');
                    }
                }
            });
        };

        window.goBackToMenu = function() {
            if (window.Telegram?.WebApp?.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
            }
            location.href = `catalog.html?ash=${ash}&msg=${msg || ''}&macro=${selectedMacro}`;
        };

        document.addEventListener('DOMContentLoaded', init);

    </script>

    <script>

            else if (baseName === 'pianificazione_itinerari') guidePage = 'userguide/07_magazzino_logistica.html';
            else if (baseName === 'fine-tuning') guidePage = 'userguide/12_fine_tuning.html';
            else if (baseName === 'risorse_umane') guidePage = 'userguide/06_team.html';
            else if (baseName === 'analisi-mercato') guidePage = 'userguide/09_controllo_gestione.html';
            else if (baseName === 'agent_intelligence') guidePage = 'userguide/09_controllo_gestione.html';
            else if (baseName === 'agenda') guidePage = 'userguide/10_agenda_radar.html';
            else if (baseName === 'assistente-sicurezza') guidePage = 'userguide/11_agente_sicurezza.html';
            else if (baseName === 'controllo_gestione') guidePage = 'userguide/09_controllo_gestione.html';
            else if (baseName === 'ecommerce') guidePage = 'userguide/04_online.html';
            else if (baseName === 'preventivi') guidePage = 'userguide/09_controllo_gestione.html';
        }

        // Calculate relative path depth
        const tcIndex = window.location.pathname.indexOf('/telegram_control/');
        let rootPath = '';
        if (tcIndex !== -1) {
            const subPath = window.location.pathname.substring(tcIndex + '/telegram_control/'.length);
            const slashCount = (subPath.match(/\//g) || []).length;
            rootPath = '../'.repeat(slashCount);
        }
        
        const finalGuideUrl = rootPath + guidePage;
        const finalAudioUrl = audioSrc;

        // 3. Inject Font Awesome stylesheet if missing
        if (!document.querySelector('link[href*="font-awesome"]') && !document.querySelector('link[href*="all.min.css"]')) {
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css';
            document.head.appendChild(link);
        }

        // 4. Inject Drawer HTML structure into Body
        const drawerHtml = `

            <div id="userguide-drawer" class="fixed inset-0 max-w-md mx-auto h-screen bg-white shadow-2xl flex flex-col translate-y-full transition-transform duration-300 z-[100000]" onclick="event.stopPropagation()">

                    <iframe id="userguide-iframe" class="w-full h-full border-none" src=""></iframe>
                </div>
            </div>
        </div>`;
        document.body.insertAdjacentHTML('beforeend', drawerHtml);

        // 5. User Guide & Audio functions
        let voiceAudio = null;
        let isAudioPlaying = false;

        window.openUserGuide = function(url) {
            const overlay = document.getElementById('userguide-drawer-overlay');
            const drawer = document.getElementById('userguide-drawer');
            const iframe = document.getElementById('userguide-iframe');
            if (!overlay || !drawer || !iframe) return;

            window.stopAudio();
            
            iframe.src = url;
            overlay.classList.remove('hidden');
            setTimeout(() => {
                overlay.classList.remove('opacity-0');
                drawer.classList.remove('translate-y-full');
            }, 10);
        };

        window.closeUserGuide = function() {
            const overlay = document.getElementById('userguide-drawer-overlay');
            const drawer = document.getElementById('userguide-drawer');
            if (!overlay || !drawer) return;

            overlay.classList.add('opacity-0');
            drawer.classList.add('translate-y-full');
            setTimeout(() => {
                overlay.classList.add('hidden');
                document.getElementById('userguide-iframe').src = "";
            }, 300);
        };

        window.stopAudio = function() {
            if (isAudioPlaying && voiceAudio) {
                voiceAudio.pause();
                voiceAudio.currentTime = 0;
            }
            isAudioPlaying = false;
            voiceAudio = null;
            const btn = document.getElementById('btn-nav-audio');
            const icon = btn ? btn.querySelector('i') : null;

                icon.className = 'fas fa-volume-high text-xs';
            }
            if (btn) {
                btn.classList.remove('bg-black', 'text-white', 'border-black');
                btn.classList.add('bg-white', 'text-slate-500', 'border-gray-200');
            }
        };

        window.openUserGuide = function(url) {
            const overlay = document.getElementById('userguide-drawer-overlay');
            const drawer = document.getElementById('userguide-drawer');
            const iframe = document.getElementById('userguide-iframe');
            if (!overlay || !drawer || !iframe) return;

            if (typeof window.stopAudio === 'function') window.stopAudio();

            iframe.src = url;
            overlay.classList.remove('hidden');
            setTimeout(() => {
                overlay.classList.remove('opacity-0');
                drawer.classList.remove('translate-y-full');
            }, 10);
        };

        window.closeUserGuide = function() {
            const overlay = document.getElementById('userguide-drawer-overlay');
            const drawer = document.getElementById('userguide-drawer');

            overlay.classList.add('opacity-0');

                document.getElementById('userguide-iframe').src = "";

        };
    })();
