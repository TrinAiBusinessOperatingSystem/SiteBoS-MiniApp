<!DOCTYPE html>
<html lang="it">
<head>
    <meta name="color-scheme" content="light">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Knowledge Editor | SiteBoS</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="../twa_global_launch.js"></script>
    <script src="../sitebos_dirty_guard.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
(function() {
    // Riferimento locale e temporaneo all'SDK per il controllo iniziale
    const tempTg = window.Telegram?.WebApp;
    const isTelegramSession = tempTg && tempTg.initData && tempTg.initData !== "" && tempTg.platform !== "unknown";

    if (!isTelegramSession) {
        const currentPath = window.location.pathname;
        let redirectPath = "index.html";

        if (currentPath.includes('/telegram_control/')) {
            const parts = currentPath.split('/telegram_control/');
            const subPath = parts[1] || '';
            if (subPath.includes('/')) {
                redirectPath = "../../index.html";
            } else {
                redirectPath = "../index.html";
            }
        }

        window.location.replace(redirectPath);
    }
})();

        tailwind.config = {
            theme: { extend: { colors: { primary: '#000000', bg: '#fafafa', border: '#eeeeee' }, borderRadius: { '3xl': '1.5rem' } } }
        }
    </script>
    <style>
        /* SiteBoS Architect Alignment */
        body { background-color: #fafafa !important; color: #000000 !important; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .card, .section-card, .dark-card, .upload-box { 
            background: white !important; 
            border: 1px solid #eeeeee !important; 
            box-shadow: none !important; 
        }
        input:focus, textarea:focus, select:focus { 
            border-color: #000000 !important; 
            box-shadow: none !important; 
            outline: none !important;
        }
        .text-primary, .text-black, .text-blue-600 { color: #000000 !important; }
        .bg-primary, .bg-black { background-color: #000000 !important; color: #ffffff !important; }
        .border-primary, .border-black { border-color: #000000 !important; }
        .spinner { border: 2px solid rgba(0,0,0,0.1); border-top-color: #000 !important; border-radius: 50%; width: 25px; height: 25px; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        input[type="checkbox"]:checked { background-color: #000 !important; border-color: #000 !important; }
        .fas, .far, .fal { font-weight: 900 !important; font-family: "Font Awesome 6 Free" !important; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-bg text-black min-h-screen flex flex-col pb-24 overflow-x-hidden">

    <div id="loader" class="fixed inset-0 bg-white z-[9999] flex flex-col items-center justify-center space-y-3">
        <div class="spinner"></div>
        <p class="text-[8px] font-black uppercase tracking-widest text-gray-500 italic">Sincronizzazione Conoscenza...</p>
    </div>

    <!-- HEADER STANDARD SITEBOS -->
    <header class="p-5 bg-white border-b border-gray-100 flex justify-between items-center z-50 shadow-sm shrink-0 sticky top-0">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-black rounded-xl flex items-center justify-center text-white shadow-xs">
                <i class="fas fa-brain text-sm"></i>
            </div>
            <div>
                <h1 class="text-[9px] font-black uppercase tracking-widest text-gray-500 leading-none mb-1">ARCHITECT</h1>
                <p class="text-sm font-black tracking-tight" id="headerTitle">Editor Conoscenza</p>
            </div>
        </div>
        <div class="flex gap-2">
            <button id="btn-nav-back" onclick="goBackToMenu()" class="w-10 h-10 bg-white border border-gray-200 rounded-2xl flex items-center justify-center text-slate-500 shadow-sm active:scale-90 transition" title="Torna al Menu">
                <i class="fas fa-arrow-left text-xs"></i>
            </button>
            <button id="btn-nav-audio" onclick="toggleAudio()" class="w-10 h-10 bg-white border border-gray-200 rounded-2xl flex items-center justify-center text-slate-500 shadow-sm active:scale-90 transition" title="Guida Vocale">
                <i class="fas fa-volume-high text-xs"></i>
            </button>
            <button id="btn-nav-guide" onclick="openUserGuide('../userguide/03_catalog.html#base-conoscenza')" class="w-10 h-10 bg-white border border-gray-200 rounded-2xl flex items-center justify-center text-slate-500 shadow-sm active:scale-90 transition" title="Manuale Utente">
                <i class="fas fa-globe text-xs"></i>
            </button>
        </div>
    </header>

    <!-- CONTENT -->
    <div id="app-content" class="hidden max-w-md w-full mx-auto p-4 space-y-6 fade-in">
        
        <!-- CARD 1: CORE INFORMATION -->
        <section class="bg-white rounded-3xl p-5 border border-border shadow-sm space-y-5">
            <div class="flex items-center justify-between border-b border-gray-50 pb-3">
                <span class="text-[8px] font-black uppercase text-gray-400 tracking-widest">Informazioni Principali</span>
                <span id="fragmentIdDisplay" class="text-[9px] font-mono font-bold text-slate-500 bg-slate-100 px-2.5 py-1 rounded-lg">ID: ...</span>
            </div>
            <div class="space-y-1">
                <label class="text-[8px] font-black uppercase text-gray-500 ml-1">Titolo Conoscenza</label>
                <textarea id="field-title" rows="1" oninput="updateField('title', this.value)" class="w-full bg-gray-50 p-3 rounded-xl text-xs font-bold border border-transparent focus:border-black outline-none transition-all resize-none leading-relaxed break-words" placeholder="Titolo Conoscenza"></textarea>
            </div>
            <div class="space-y-1">
                <label class="text-[8px] font-black uppercase text-gray-500 ml-1">Sommario Esecutivo</label>
                <textarea id="field-summary" rows="2" class="w-full bg-gray-50 p-3 rounded-xl text-xs font-medium border border-transparent focus:border-black outline-none resize-none leading-relaxed break-words" oninput="updateField('summary', this.value)" placeholder="Sommario..."></textarea>
            </div>
            <div class="space-y-1">
                <label class="text-[8px] font-black uppercase text-gray-500 ml-1">Risposta Base IA</label>
                <textarea id="field-answer" rows="4" class="w-full bg-gray-50 p-3 rounded-xl text-xs font-medium border border-transparent focus:border-black outline-none resize-none leading-relaxed break-words" oninput="updateField('answer_fragment', this.value)" placeholder="Risposta frammento..."></textarea>
            </div>
            <div class="space-y-2 pt-2 border-t border-gray-50">
                <div class="flex items-center justify-between">
                    <label class="text-[8px] font-black uppercase text-gray-500 ml-1">Frasi Intenti Utente</label>
                    <span id="utterances-count" class="text-[8px] font-black uppercase px-2.5 py-0.5 bg-slate-100 rounded-full text-slate-500">0 Frasi</span>
                </div>
                <div id="utterances-list" class="space-y-2"></div>
                <div class="flex items-center gap-2 pt-1">
                    <input type="text" id="new-utterance-input" 
                        class="flex-1 bg-gray-50 p-3 rounded-xl text-xs font-medium border border-transparent focus:border-black outline-none transition-all"
                        placeholder="Aggiungi frase o parola chiave trigger..."
                        onkeydown="if(event.key==='Enter'){ event.preventDefault(); addUtterance(); }">
                    <button type="button" onclick="addUtterance()" class="h-10 px-4 bg-black text-white rounded-xl text-[9px] font-black uppercase tracking-widest active:scale-95 transition shrink-0">
                        + Aggiungi
                    </button>
                </div>
            </div>
        </section>

        <!-- SECTIONS -->
        <div id="sections-container" class="space-y-4"></div>
    </div>

    <!-- FOOTER -->
    <footer class="fixed bottom-0 left-0 w-full p-4 bg-white/90 backdrop-blur-lg border-t border-gray-100 z-[100]">
        <div class="max-w-md mx-auto">
            <button id="save-fab" disabled onclick="handleSave()" class="w-full h-10 bg-black text-white rounded-xl shadow-sm font-black uppercase tracking-widest text-[9px] active:scale-95 transition-all disabled:opacity-20 flex items-center justify-center gap-2">
                <i class="fas fa-save text-xs"></i> <span id="saveBtnText">Aggiorna Conoscenza</span>
            </button>
        </div>
    </footer>

    <script>
        'use strict';
        const WEBHOOK_URL = "https://prod.workflow.trinai.it/webhook/0ca76af1-8c02-47f4-a3a4-fd19ad495afe";
        const tg = window.Telegram.WebApp;
        if (tg.setHeaderColor) tg.setHeaderColor('#ffffff');
        if (tg.setBackgroundColor) tg.setBackgroundColor('#ffffff');
        tg.ready(); tg.expand();
        const urlParams = new URLSearchParams(window.location.search);
        const ash = urlParams.get('ash'), sopId = urlParams.get('sop_id');
        let currentFragment = null, initialDataString = "";

        async function init() { if (!ash || !sopId) return; await loadFragment(); }

        async function loadFragment() {
            try {
                const res = await fetch(WEBHOOK_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'get_kb_details', ash: ash, fragment_id: sopId, _auth: tg.initData }) });
                const d = await res.json(); const raw = Array.isArray(d) ? d[0] : d;
                currentFragment = raw.Fragment || raw.fragment || raw;
                document.getElementById('headerTitle').innerText = "Editor Conoscenza";
                document.getElementById('fragmentIdDisplay').innerText = `ID: ${currentFragment.fragment_id || currentFragment._id}`;
                document.getElementById('field-title').value = currentFragment.title || "";
                document.getElementById('field-summary').value = currentFragment.summary || "";
                document.getElementById('field-answer').value = currentFragment.answer_fragment || "";
                renderUtterances();
                renderSections();
                initialDataString = JSON.stringify(currentFragment);
                document.getElementById('loader').classList.add('hidden');
                document.getElementById('app-content').classList.remove('hidden');
            } catch (e) { console.error(e); }
        }

        function renderUtterances() {
            const container = document.getElementById('utterances-list');
            const list = currentFragment.user_utterances || [];
            document.getElementById('utterances-count').innerText = `${list.length} Frasi`;
            if (list.length === 0) {
                container.innerHTML = `<p class="text-[9px] font-medium text-slate-400 italic p-3 bg-gray-50 rounded-xl text-center">Nessuna frase trigger configurata.</p>`;
                return;
            }
            container.innerHTML = list.map((utt, idx) => `
                <div class="flex items-center justify-between bg-slate-50 border border-slate-200/60 p-2.5 px-3 rounded-xl gap-2">
                    <span class="text-xs font-mono font-bold text-slate-800 break-words leading-tight flex-1">${utt}</span>
                    <button type="button" onclick="deleteUtterance(${idx})" class="w-6 h-6 rounded-lg text-slate-400 hover:text-red-500 hover:bg-white flex items-center justify-center transition active:scale-90 shrink-0" title="Elimina frase">
                        <i class="fas fa-times text-xs"></i>
                    </button>
                </div>
            `).join('');
        }

        window.addUtterance = function() {
            const input = document.getElementById('new-utterance-input');
            const val = input.value.trim();
            if (!val) return;
            if (!currentFragment.user_utterances) currentFragment.user_utterances = [];
            const cleanVal = val.replace(/[\(\)\[\]\{\}]/g, '').trim();
            if (cleanVal && !currentFragment.user_utterances.includes(cleanVal)) {
                currentFragment.user_utterances.push(cleanVal);
                renderUtterances();
                checkDirty();
            }
            input.value = '';
        };

        window.deleteUtterance = function(idx) {
            if (currentFragment.user_utterances && currentFragment.user_utterances[idx] !== undefined) {
                currentFragment.user_utterances.splice(idx, 1);
                renderUtterances();
                checkDirty();
            }
        };

        function renderSections() {
            const container = document.getElementById('sections-container'); container.innerHTML = '';
            (currentFragment.sections || []).forEach((s, i) => {
                const div = document.createElement('div');
                div.className = "bg-white rounded-3xl border border-gray-100 p-5 space-y-4 shadow-sm fade-in";
                div.innerHTML = `
                    <div class="space-y-1">
                        <label class="text-[8px] font-black uppercase text-gray-500 ml-1">Domanda ${i+1}</label>
                        <textarea rows="2" oninput="updateSection(${i}, 'question', this.value)" class="w-full bg-gray-50 p-3 rounded-xl text-xs font-black border border-transparent focus:border-black outline-none resize-none leading-relaxed break-words uppercase" placeholder="Domanda...">${s.question||''}</textarea>
                    </div>
                    <div class="space-y-1">
                        <label class="text-[8px] font-black uppercase text-gray-500 ml-1">Risposta Dettagliata</label>
                        <textarea rows="3" oninput="updateSection(${i}, 'answer', this.value)" class="w-full bg-gray-50 p-3 rounded-xl text-[11px] font-medium border border-transparent focus:border-black outline-none resize-none leading-relaxed shadow-inner break-words" placeholder="Risposta dettagliata...">${s.answer||''}</textarea>
                    </div>`;
                container.appendChild(div);
            });
        }

        window.updateField = (k, v) => { currentFragment[k] = v; checkDirty(); };
        window.updateSection = (idx, k, v) => { currentFragment.sections[idx][k] = v; checkDirty(); };
        function checkDirty() { document.getElementById('save-fab').disabled = JSON.stringify(currentFragment) === initialDataString; }

        window.handleSave = async function() {
            const btn = document.getElementById('save-fab'); const txt = document.getElementById('saveBtnText');
            btn.disabled = true; txt.innerText = "SALVATAGGIO...";
            try {
                const res = await fetch(WEBHOOK_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'save_kb', fragments: [currentFragment], ash: ash, _auth: tg.initData }) });
                if (res.ok) { btn.className = "w-full h-10 bg-green-600 text-white rounded-xl shadow-sm font-black uppercase text-[9px] flex items-center justify-center gap-2"; txt.innerText = "SALVATO"; if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success'); setTimeout(() => tg.close(), 1200); }
                else throw 0;
            } catch (e) { btn.disabled = false; txt.innerText = "RIPROVA"; }
        }
        init();
    </script>

    <!-- User Guide and Audio Guide Integration Engine -->
    <script>
    (function() {
        if (document.getElementById('userguide-drawer-overlay')) return;

        // 1. Determine HTML filename to play the correct WAV file
        const pathParts = window.location.pathname.split('/');
        const pageName = pathParts[pathParts.length - 1] || 'index.html';
        const baseName = pageName.replace('.html', '');
        
        let audioSrc = baseName + '.wav';
        if (baseName === 'add-product') audioSrc = 'catalog_add-product.wav';
        if (baseName === 'edit-product') audioSrc = 'catalog_edit-product.wav';

        // 2. Determine corresponding userguide page
        let guidePage = 'userguide/index.html';
        if (window.location.pathname.includes('/gestione/')) {
            guidePage = 'userguide/03_catalog.html#base-conoscenza';
        } else if (window.location.pathname.includes('/identity/')) {
            guidePage = 'userguide/02_onboarding.html';
        } else if (window.location.pathname.includes('/agents/')) {
            if (baseName.includes('controllo')) guidePage = 'userguide/09_controllo_gestione.html';
            else if (baseName.includes('sicurezza')) guidePage = 'userguide/11_agente_sicurezza.html';
            else guidePage = 'userguide/01_intro.html';
        } else {
            if (baseName === 'agenda') guidePage = 'userguide/10_agenda_radar.html';
            else if (baseName === 'certificator') guidePage = 'userguide/07_magazzino_logistica.html';
            else if (baseName === 'intelligent-warehouse') guidePage = 'userguide/07_magazzino_logistica.html';
            else if (baseName === 'orders-manager') guidePage = 'userguide/07_magazzino_logistica.html';
            else if (baseName === 'job-create') guidePage = 'userguide/07_magazzino_logistica.html';
            else if (baseName === 'pianificazione_itinerari') guidePage = 'userguide/07_magazzino_logistica.html';
            else if (baseName === 'fine-tuning') guidePage = 'userguide/12_fine_tuning.html';
            else if (baseName === 'risorse_umane') guidePage = 'userguide/06_team.html';
            else if (baseName === 'analisi-mercato') guidePage = 'userguide/09_controllo_gestione.html';
            else if (baseName === 'agent_intelligence') guidePage = 'userguide/09_controllo_gestione.html';
            else if (baseName === 'agenda') guidePage = 'userguide/10_agenda_radar.html';
            else if (baseName === 'assistente-sicurezza') guidePage = 'userguide/11_agente_sicurezza.html';
            else if (baseName === 'controllo_gestione') guidePage = 'userguide/09_controllo_gestione.html';
            else if (baseName === 'ecommerce') guidePage = 'userguide/04_online.html';
            else if (baseName === 'preventivi') guidePage = 'userguide/09_controllo_gestione.html';
        }

        // Calculate relative path depth
        const tcIndex = window.location.pathname.indexOf('/telegram_control/');
        let rootPath = '';
        if (tcIndex !== -1) {
            const subPath = window.location.pathname.substring(tcIndex + '/telegram_control/'.length);
            const slashCount = (subPath.match(/\//g) || []).length;
            rootPath = '../'.repeat(slashCount);
        }
        
        const finalGuideUrl = rootPath + guidePage;
        const finalAudioUrl = audioSrc;

        // 3. Inject Font Awesome stylesheet if missing
        if (!document.querySelector('link[href*="font-awesome"]') && !document.querySelector('link[href*="all.min.css"]')) {
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css';
            document.head.appendChild(link);
        }

        // 4. Inject Drawer HTML structure into Body
        const drawerHtml = `
        <div id="userguide-drawer-overlay" class="fixed inset-0 bg-slate-950/40 backdrop-blur-sm z-[99999] hidden opacity-0 transition-opacity duration-300" onclick="closeUserGuide()">
            <div id="userguide-drawer" class="fixed inset-0 max-w-md mx-auto h-screen bg-white shadow-2xl flex flex-col translate-y-full transition-transform duration-300 z-[100000]" onclick="event.stopPropagation()">
                <div class="w-full flex items-center justify-between p-4 border-b border-slate-100 shrink-0 select-none">
                    <div class="flex items-center gap-2">
                        <div class="w-2.5 h-2.5 rounded-full bg-blue-600 animate-pulse"></div>
                        <span class="text-xs font-black uppercase tracking-widest text-slate-800">Guida Utente</span>
                    </div>
                    <button onclick="closeUserGuide()" class="w-8 h-8 rounded-xl bg-slate-50 border border-slate-100 flex items-center justify-center text-slate-500 hover:bg-slate-100 active:scale-90 transition">
                        <i class="fas fa-times text-xs"></i>
                    </button>
                </div>
                <div class="flex-1 w-full overflow-hidden bg-slate-50 relative">
                    <iframe id="userguide-iframe" class="w-full h-full border-none" src=""></iframe>
                </div>
            </div>
        </div>`;
        document.body.insertAdjacentHTML('beforeend', drawerHtml);

        // 5. User Guide & Audio functions
        window.goBackToMenu = function() {
            if (window.Telegram?.WebApp?.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
            }
            if (window.parent && typeof window.parent.closeSubEditor === 'function') {
                window.parent.closeSubEditor();
            } else {
                location.href = `catalog.html?ash=${ash}&msg=`;
            }
        };

        // 6. Action Functions (Drawer & Audio)
        let voiceAudio = null;
        let isAudioPlaying = false;

        window.openUserGuide = function(url) {
            const overlay = document.getElementById('userguide-drawer-overlay');
            const drawer = document.getElementById('userguide-drawer');
            const iframe = document.getElementById('userguide-iframe');
            if (!overlay || !drawer || !iframe) return;

            window.stopAudio();
            
            iframe.src = url;
            overlay.classList.remove('hidden');
            setTimeout(() => {
                overlay.classList.remove('opacity-0');
                drawer.classList.remove('translate-y-full');
            }, 10);
        };

        window.closeUserGuide = function() {
            const overlay = document.getElementById('userguide-drawer-overlay');
            const drawer = document.getElementById('userguide-drawer');
            if (!overlay || !drawer) return;

            overlay.classList.add('opacity-0');
            drawer.classList.add('translate-y-full');
            setTimeout(() => {
                overlay.classList.add('hidden');
                document.getElementById('userguide-iframe').src = "";
            }, 300);
        };

        window.stopAudio = function() {
            if (isAudioPlaying && voiceAudio) {
                voiceAudio.pause();
                voiceAudio.currentTime = 0;
            }
            isAudioPlaying = false;
            voiceAudio = null;
            const btn = document.getElementById('btn-nav-audio');
            const icon = btn ? btn.querySelector('i') : null;
            if (icon) {
                icon.className = 'fas fa-volume-high text-xs';
            }
            if (btn) {
                btn.classList.remove('bg-black', 'text-white', 'border-black');
                btn.classList.add('bg-white', 'text-slate-500', 'border-gray-200');
            }
        };

        window.toggleAudio = function() {
            const btn = document.getElementById('btn-nav-audio');
            const icon = btn ? btn.querySelector('i') : null;

            if (!voiceAudio) {
                voiceAudio = new Audio(finalAudioUrl);
                voiceAudio.addEventListener('ended', () => {
                    isAudioPlaying = false;
                    voiceAudio.currentTime = 0;
                    if (icon) {
                        icon.className = 'fas fa-volume-high text-xs';
                        btn.classList.remove('bg-black', 'text-white', 'border-black');
                        btn.classList.add('bg-white', 'text-slate-500', 'border-gray-200');
                    }
                });
            }

            if (isAudioPlaying) {
                window.stopAudio();
            } else {
                voiceAudio.play().then(() => {
                    isAudioPlaying = true;
                    if (icon) {
                        icon.className = 'fas fa-stop text-xs';
                        btn.classList.remove('bg-white', 'text-slate-500', 'border-gray-200');
                        btn.classList.add('bg-black', 'text-white', 'border-black');
                    }
                }).catch(err => {
                    console.error("Errore riproduzione audio:", err);
                });
            }
        };
    })();
    </script>
</body>
</html>
