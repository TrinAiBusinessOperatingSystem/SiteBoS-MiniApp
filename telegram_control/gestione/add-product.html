<!DOCTYPE html>
<html lang="it">

<head>
    <meta name="color-scheme" content="light">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title data-i18n="page_title">Nuovo Prodotto</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* SiteBoS Architect Alignment */
        html, body {
            background-color: #fafafa !important;
            color: #000000 !important;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .card,
        .section-card,
        .dark-card,
        .upload-box {
            background: white !important;
            border: 1px solid #e2e8f0 !important;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05) !important;
            border-radius: 1rem !important;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #000000 !important;
            box-shadow: none !important;
            outline: none !important;
        }

        /* Forza icone pesanti */
        .fas,
        .far,
        .fal {
            font-weight: 900 !important;
            font-family: "Font Awesome 6 Free" !important;
        }

        .upload-box {
            border: 2px dashed #cbd5e1 !important;
            padding: 1.5rem;
            text-align: center;
            background: #f8fafc !important;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .upload-box.enabled {
            border-color: #10b981 !important;
            background: rgba(16, 185, 129, 0.05) !important;
        }

        .upload-box input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.5rem;
        }

        .checkbox-group input[type="checkbox"] {
            width: 1.25rem;
            height: 1.25rem;
            accent-color: #000000;
        }

        .section-title {
            font-size: 0.75rem;
            font-weight: 900;
            color: #000 !important;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
            margin-top: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
    </style>
</head>

<body class="safe-area-inset min-h-screen flex flex-col pb-24 bg-[#fafafa]">

    <!-- STICKY HEADER -->
    <header class="p-5 bg-white border-b border-gray-100 flex justify-between items-center z-50 shadow-sm shrink-0 sticky top-0">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-black rounded-xl flex items-center justify-center text-white shadow-xs">
                <i class="fas fa-box-open text-sm"></i>
            </div>
            <div>
                <h1 class="text-[9px] font-black uppercase tracking-widest text-gray-500 leading-none mb-1">GESTIONE CATALOGO</h1>
                <p class="text-sm font-black tracking-tight" id="header-page-title">Nuovo Prodotto</p>
            </div>
        </div>
        <div class="flex gap-2">
            <!-- 1. Back to Menu Button -->
            <button id="btn-nav-back" onclick="goBackToMenu()" class="w-10 h-10 bg-white border border-gray-200 rounded-2xl flex items-center justify-center text-slate-500 shadow-sm active:scale-90 transition" title="Torna al Menu">
                <i class="fas fa-arrow-left text-xs"></i>
            </button>
            <!-- 2. Speech Audio Button -->
            <button id="btn-nav-audio" onclick="toggleAudio()" class="w-10 h-10 bg-white border border-gray-200 rounded-2xl flex items-center justify-center text-slate-500 shadow-sm active:scale-90 transition" title="Guida Vocale">
                <i class="fas fa-volume-high text-xs"></i>
            </button>
            <!-- 3. User Guide Button -->
            <button id="btn-nav-guide" onclick="openUserGuide('../userguide/03b_verticals.html')" class="w-10 h-10 bg-white border border-gray-200 rounded-2xl flex items-center justify-center text-slate-500 shadow-sm active:scale-90 transition" title="Manuale Utente">
                <i class="fas fa-globe text-xs"></i>
            </button>
        </div>
    </header>

    <!-- LOADER -->
    <div id="loader"
        class="fixed inset-0 flex flex-col items-center justify-center bg-black/60 backdrop-blur-sm z-50 transition-opacity duration-300 hidden text-white">
        <div class="spinner-border animate-spin inline-block w-8 h-8 border-4 border-white border-t-transparent rounded-full" role="status">
        </div>
        <div id="loader-text" class="mt-4 text-xs font-bold uppercase tracking-wider">Analisi in corso...</div>
    </div>

    <!-- MAIN CONTAINER -->
    <main class="flex-1 max-w-md w-full mx-auto p-5 space-y-5 fade-in-up" id="app-content">

        <!-- SECTION 1: INPUT INIZIALE -->
        <div id="inputSection">
            <div class="dark-card rounded-2xl p-5 mb-5 space-y-4">
                <div>
                    <span class="text-[9px] font-black uppercase tracking-widest text-gray-400 block mb-1">Target Categoria</span>
                    <h3 class="text-sm font-black text-black" id="displayCatName">...</h3>
                </div>

                <div>
                    <label data-i18n="lName" class="block text-xs font-black uppercase tracking-wider text-gray-500 mb-2 required">Nome Richiesta</label>
                    <input type="text" id="inName" required autocomplete="off" placeholder="Es. Trattamento Sbiancante PRO"
                        class="w-full p-3.5 rounded-xl bg-white border border-gray-200 focus:ring-0 focus:border-black text-black font-semibold text-sm">
                </div>

                <div>
                    <label data-i18n="lDesc" class="block text-xs font-black uppercase tracking-wider text-gray-500 mb-2">Istruzioni Base</label>
                    <textarea id="inDesc" rows="3" placeholder="Descrivi le caratteristiche del prodotto o servizio..."
                        class="w-full p-3.5 rounded-xl bg-white border border-gray-200 focus:ring-0 focus:border-black text-black font-medium text-xs"></textarea>
                </div>

                <div>
                    <label data-i18n="lFile" class="block text-xs font-black uppercase tracking-wider text-gray-500 mb-2">Allegato (Foto o PDF)</label>
                    <div class="upload-box" id="uploadBox">
                        <input type="file" id="inFile" accept="image/*,application/pdf">
                        <div class="upload-icon text-3xl mb-2 text-gray-400"><i class="fas fa-cloud-upload-alt"></i></div>
                        <span id="lblFileBtn" class="upload-text text-xs font-bold text-gray-500 block" data-i18n="lFileBtn">Carica Foto/PDF</span>
                    </div>
                </div>
            </div>

            <button id="btnEnrich"
                class="w-full bg-black text-white font-black text-xs uppercase tracking-widest py-4 px-4 rounded-xl shadow-sm hover:bg-gray-900 transition flex items-center justify-center gap-2 active:scale-[0.98]">
                <i class="fas fa-magic text-xs"></i> <span data-i18n="btnEnrich">Genera Bozza AI</span>
            </button>
        </div>

        <!-- SECTION 2: EDIT FORM -->
        <form id="editForm" class="hidden fade-in">

            <div id="duplicateBanner"
                class="bg-yellow-900 border border-yellow-700 text-yellow-300 p-3 rounded-lg mb-4 hidden font-medium">
                <span>⚠️</span> <span data-i18n="dup">Possibile Duplicato!</span>
            </div>

            <div class="dark-card rounded-xl p-5 mb-6">
                <!-- IDENTITÀ -->
                <div class="section-title" data-i18n="secId">Identità Prodotto</div>
                <div class="mb-4">
                    <label data-i18n="outName" class="block text-sm font-medium text-gray-500 mb-2 required">Nome
                        Ufficiale</label>
                    <input type="text" id="outName" required
                        class="w-full p-3 rounded-lg bg-white border border-gray-200 focus:ring-0 focus:border-black text-black">
                </div>

                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label data-i18n="outSku" class="block text-sm font-medium text-gray-500 mb-2">SKU</label>
                        <input type="text" id="outSku" readonly
                            class="w-full p-3 rounded-lg bg-gray-50 border border-gray-200 text-gray-500 cursor-not-allowed outline-none">
                    </div>
                    <div>
                        <label data-i18n="outType" class="block text-sm font-medium text-gray-500 mb-2">Tipo</label>
                        <select id="outType"
                            class="w-full p-3 rounded-lg bg-white border border-gray-200 focus:ring-0 focus:border-black text-black appearance-none">
                            <option value="SERVICE">SERVICE</option>
                            <option value="PRODUCT">PRODUCT</option>
                        </select>
                    </div>
                </div>

                <div class="mb-4">
                    <label data-i18n="outShort" class="block text-sm font-medium text-gray-500 mb-2">Descrizione
                        Breve</label>
                    <input type="text" id="outShortDesc"
                        class="w-full p-3 rounded-lg bg-white border border-gray-200 focus:ring-0 focus:border-black text-black">
                </div>

                <div class="mb-4">
                    <label data-i18n="outLong" class="block text-sm font-medium text-gray-500 mb-2">Descrizione
                        Estesa</label>
                    <textarea id="outLongDesc" rows="4"
                        class="w-full p-3 rounded-lg bg-white border border-gray-200 focus:ring-0 focus:border-black text-black"></textarea>
                </div>

                <div class="mb-4">
                    <label data-i18n="outInt" class="block text-sm font-medium text-gray-500 mb-2">Note Interne</label>
                    <textarea id="outInternal" rows="2"
                        class="w-full p-3 rounded-lg bg-white border border-gray-200 focus:ring-0 focus:border-black text-black font-mono text-sm"></textarea>
                </div>

                <!-- PRICING & OPS -->
                <div class="section-title" data-i18n="secPrice">Prezzi & Operazioni</div>
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label data-i18n="outPrice" class="block text-sm font-medium text-gray-500 mb-2">Prezzo
                            (€)</label>
                        <input type="number" id="outPrice" step="0.01"
                            class="w-full p-3 rounded-lg bg-white border border-gray-200 focus:ring-0 focus:border-black text-black">
                    </div>
                    <div>
                        <label data-i18n="outUnit" class="block text-sm font-medium text-gray-500 mb-2">Unità</label>
                        <input type="text" id="outUnit" placeholder="es. hour, item"
                            class="w-full p-3 rounded-lg bg-white border border-gray-200 focus:ring-0 focus:border-black text-black">
                    </div>
                </div>

                <div class="checkbox-group mb-2">
                    <input type="checkbox" id="outDynamicPrice">
                    <label for="outDynamicPrice" class="text-sm font-medium"><span data-i18n="outDyn">Prezzo
                            Dinamico?</span></label>
                </div>

                <div class="checkbox-group mb-4">
                    <input type="checkbox" id="outBooking">
                    <label for="outBooking" class="text-sm font-medium"><span data-i18n="outBook">Richiede
                            Prenotazione?</span></label>
                </div>

                <!-- MARKETING -->
                <div class="section-title" data-i18n="secMark">Marketing & Target</div>
                <div class="mb-4">
                    <label data-i18n="outTags" class="block text-sm font-medium text-gray-500 mb-2">Tags (SEO)</label>
                    <input type="text" id="outTags" placeholder="Tag1, Tag2..."
                        class="w-full p-3 rounded-lg bg-white border border-gray-200 focus:ring-0 focus:border-black text-black">
                </div>
                <div class="mb-4">
                    <label data-i18n="outTarget" class="block text-sm font-medium text-gray-500 mb-2">Target
                        Audience</label>
                    <input type="text" id="outTarget" placeholder="PMI, Hotel..."
                        class="w-full p-3 rounded-lg bg-white border border-gray-200 focus:ring-0 focus:border-black text-black">
                </div>

                <!-- ADD-ONS -->
                <div class="section-title" data-i18n="secAddons">Add-ons</div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-500 mb-2" data-i18n="lblAddons">Aggiunte
                        Programmate</label>
                    <button type="button" onclick="addAddon()" class="text-sm font-medium text-blue-600 mb-2"
                        data-i18n="btnAddAddon">Aggiungi Opzione</button>
                    <div id="addonsContainer" class="space-y-2"></div>
                </div>
                <div class="checkbox-group mb-4">
                    <input type="checkbox" id="allowCustomerNotes">
                    <label for="allowCustomerNotes" class="text-sm font-medium"><span data-i18n="chkAllowNotes">Abilita
                            Note Cliente</span></label>
                </div>
                <div class="pt-4 border-t border-gray-100">
                    <button type="submit" id="btn-submit-save" class="w-full py-4 bg-black text-white rounded-xl text-xs font-black uppercase tracking-widest active:scale-95 transition shadow-md flex items-center justify-center gap-2">
                        <i class="fas fa-check text-xs"></i> <span data-i18n="btnSave">Salva Definitivo</span>
                    </button>
                </div>
            </div>

            <div style="height: 40px;"></div>
        </form>

    </main>

    <script>
(function() {
    // Riferimento locale e temporaneo all'SDK per il controllo iniziale
    const tempTg = window.Telegram?.WebApp;
    const isTelegramSession = tempTg && tempTg.initData && tempTg.initData !== "" && tempTg.platform !== "unknown";

    if (!isTelegramSession) {
        const currentPath = window.location.pathname;
        let redirectPath = "index.html";

        if (currentPath.includes('/telegram_control/')) {
            const parts = currentPath.split('/telegram_control/');
            const subPath = parts[1] || '';
            if (subPath.includes('/')) {
                redirectPath = "../../index.html";
            } else {
                redirectPath = "../index.html";
            }
        }

        window.location.replace(redirectPath);
    }
})();

        /**
         * ADD PRODUCT LOGIC (v7.0 - BROWSER SAFE FINAL)
         * - Niente tg.showPopup/tg.showAlert -> Solo alert() nativi.
         * - Redirect sicuri.
         * - Payload piatto.
         * - 6 Lingue.
         */

        'use strict';

        // 1. CONFIGURAZIONE
        const ENRICH_WEBHOOK = "https://prod.workflow.trinai.it/webhook/31f89350-4d7f-44b7-9aaf-e7d9e3655b6c";
        const SAVE_WEBHOOK = "https://prod.workflow.trinai.it/webhook/20fd95c0-4218-400e-ae2a-cd881a757b80";

        // Init Telegram (Solo per espansione view e aptico, non per UI critica)
        const tg = window.Telegram.WebApp;
        if (tg.setHeaderColor) tg.setHeaderColor('#ffffff');
        if (tg.setBackgroundColor) tg.setBackgroundColor('#ffffff');
        try { tg.ready(); tg.expand(); } catch (e) { }

        // 2. PARAMETRI URL
        const urlParams = new URLSearchParams(window.location.search);
        let ash = urlParams.get('ash');
        const catId = urlParams.get('catId');
        const ghostId = urlParams.get('ghostId');
        let msg = urlParams.get('msg') || urlParams.get('msg_id');

        if (ash && ash.includes('?msg=')) {
            const parts = ash.split('?msg=');
            ash = parts[0];
            if (!msg) msg = parts[1];
        }
        const langParam = urlParams.get('lang') || 'it';

        // 3. STATO GLOBALE
        let draftData = null;
        let fileData = null;
        let extraOptions = [];

        // 4. TRADUZIONI (6 LINGUE)
        const i18n = {
            it: { title: "Nuovo Prodotto", btnEnrich: "Genera Bozza AI", btnSave: "Salva Definitivo", status_ai: "Analisi AI in corso...", status_save: "Salvataggio...", err_name: "Nome mancante!", ok_saved: "Salvato!", err_generic: "Errore. Riprova.", lblAddons: "Aggiunte Programmate", lblAddonName: "Nome Add-on", lblAddonPrice: "Prezzo", btnAddAddon: "Aggiungi Opzione", chkAllowNotes: "Abilita Note Cliente", secId: "Identità Prodotto", secPrice: "Prezzi & Operazioni", secMark: "Marketing & Target", secAddons: "Add-ons" },
            en: { title: "New Product", btnEnrich: "Generate Draft", btnSave: "Save Final", status_ai: "AI Analyzing...", status_save: "Saving...", err_name: "Name missing!", ok_saved: "Saved!", err_generic: "Error. Retry.", lblAddons: "Scheduled Add-ons", lblAddonName: "Add-on Name", lblAddonPrice: "Price", btnAddAddon: "Add Option", chkAllowNotes: "Allow Customer Notes" },
            fr: { title: "Nouveau Produit", btnEnrich: "Générer Ébauche", btnSave: "Enregistrer", status_ai: "Analyse IA...", status_save: "Enregistrement...", err_name: "Nom requis !", ok_saved: "Enregistré !", err_generic: "Erreur. Réessayer.", lblAddons: "Add-ons", lblAddonName: "Nom Add-on", lblAddonPrice: "Prix", btnAddAddon: "Ajouter", chkAllowNotes: "Autoriser Notes" },
            de: { title: "Neues Produkt", btnEnrich: "Entwurf Generieren", btnSave: "Speichern", status_ai: "KI Analysiert...", status_save: "Speichern...", err_name: "Name fehlt!", ok_saved: "Gespeichert!", err_generic: "Fehler. Wiederholen.", lblAddons: "Add-ons", lblAddonName: "Name", lblAddonPrice: "Preis", btnAddAddon: "Hinzufügen", chkAllowNotes: "Notizen erlauben" },
            es: { title: "Nuevo Producto", btnEnrich: "Generar Borrador", btnSave: "Guardar", status_ai: "Analizando...", status_save: "Guardando...", err_name: "¡Nombre obligatorio!", ok_saved: "¡Guardado!", err_generic: "Error. Reintentar.", lblAddons: "Add-ons", lblAddonName: "Nombre", lblAddonPrice: "Precio", btnAddAddon: "Añadir", chkAllowNotes: "Permitir notas" },
            pt: { title: "Novo Produto", btnEnrich: "Gerar Rascunho", btnSave: "Salvar", status_ai: "Analisando...", status_save: "Salvando...", err_name: "Nome obrigatório!", ok_saved: "Salvo!", err_generic: "Erro. Tente novamente.", lblAddons: "Add-ons", lblAddonName: "Nome", lblAddonPrice: "Preço", btnAddAddon: "Adicionar", chkAllowNotes: "Permitir notas" }
        };
        const t = i18n[langParam.slice(0, 2)] || i18n.it;

        // 5. DOM CACHE
        const dom = {
            loader: document.getElementById('loader'),
            loaderText: document.getElementById('loader-text'),
            inputSection: document.getElementById('inputSection'),
            editForm: document.getElementById('editForm'),
            fileInput: document.getElementById('inFile'),
            fileBox: document.getElementById('uploadBox'),
            fileBtnText: document.getElementById('lblFileBtn')
        };

        // 6. INIT
        function init() {
            // Setup Testi
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.innerText = t[key];
            });

            document.title = t.title;
            document.getElementById('btnEnrich').innerHTML = `<i class="fas fa-magic"></i> ${t.btnEnrich}`;
            document.getElementById('displayCatName').innerText = catId || "...";

            // Eventi
            document.getElementById('btnEnrich').addEventListener('click', manualEnrich);
            document.getElementById('editForm').addEventListener('submit', handleSave);
            dom.fileInput.addEventListener('change', handleFileSelect);

            // 👉 Collega FAB Salva (usa ID diverso per evitare conflitti con form submit)
            const fabSave = document.getElementById('fab-save-product');
            if (fabSave) {
                fabSave.addEventListener('click', (e) => {
                    e.preventDefault();
                    handleSave(e);
                });
            }

            // GHOST MODE AUTO-START
            if (ghostId) {
                dom.inputSection.classList.add('hidden');
                callEnrichWebhook({ ghost_id: ghostId });
            }
        }

        // 7. FILE HANDLE
        function handleFileSelect(e) {
            const f = e.target.files[0];
            if (!f) return;
            const r = new FileReader();
            r.onload = (ev) => {
                fileData = {
                    base64: ev.target.result.split(',')[1],
                    mime: f.type
                };
                dom.fileBox.classList.add('enabled');
                dom.fileBtnText.innerText = f.name;
            };
            r.readAsDataURL(f);
        }

        // 8. TRIGGER MANUALE
        function manualEnrich() {
            const name = document.getElementById('inName').value;
            if (!name) return alert(t.err_name);

            const payloadData = {
                product_name: name,
                product_description: document.getElementById('inDesc').value
            };

            if (fileData) {
                payloadData.file_data = fileData.base64;
                payloadData.mime_type = fileData.mime;
            }

            callEnrichWebhook(payloadData);
        }

        // 9. WEBHOOK CALL
        async function callEnrichWebhook(customData) {
            showLoader(t.status_ai);

            const payload = {
                _auth: tg.initData,
                ash: ash,
                category_id: catId,
                language: langParam,
                ...customData
            };

            try {
                const res = await fetch(ENRICH_WEBHOOK, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) throw new Error(`HTTP ${res.status}`);

                const json = await res.json();
                const data = Array.isArray(json) ? json[0] : json;

                if (!data) throw new Error("Empty Data");

                populateForm(data);

            } catch (e) {
                console.error(e);
                alert(t.err_generic + "\n" + e.message);
                hideLoader();
                if (customData.ghost_id) dom.inputSection.classList.remove('hidden');
            }
        }

        // 10. POPULATE UI
        function populateForm(data) {
            console.log("DEBUG: Data received from AI:", data);
            draftData = data;

            const val = (id, v) => {
                const el = document.getElementById(id);
                if (el) el.value = v || '';
            };
            const chk = (id, v) => {
                const el = document.getElementById(id);
                if (el) el.checked = !!v;
            };

            // Mapping Sicuro
            const identity = data.identity || {};
            const pricing = data.pricing || {};
            const desc = identity.description || {};
            const ops = data.operations || {};
            const mkt = data.relations?.marketing_info || {};

            val('outName', identity.item_name);
            val('outSku', identity.item_sku);
            val('outType', identity.item_type || 'SERVICE');
            val('outShortDesc', desc.short);
            val('outLongDesc', desc.long);
            val('outInternal', desc.internal_notes);
            val('outPrice', pricing.base_price);
            val('outUnit', pricing.unit_of_measure);
            chk('outDynamicPrice', pricing.pricing_rules_engine?.is_dynamic_price);
            chk('outBooking', ops.requires_booking);
            val('outTags', (identity.tags || []).join(', '));
            val('outTarget', (mkt.target_audience_tags || []).join(', '));

            const dupBanner = document.getElementById('duplicateBanner');
            if (data.is_duplicate) dupBanner.classList.remove('hidden');
            else dupBanner.classList.add('hidden');

            dom.inputSection.classList.add('hidden');
            dom.editForm.classList.remove('hidden');

            // 👉 MOSTRA FAB SALVA
            const fabSave = document.getElementById('fab-save-product');
            if (fabSave) fabSave.classList.remove('hidden');

            // Addons
            extraOptions = data.commercial_setup?.extra_options || [];
            renderAddons();
            chk('allowCustomerNotes', data.commercial_setup?.allow_customer_notes);

            hideLoader();
            window.scrollTo(0, 0);
        }

        function renderAddons() {
            const container = document.getElementById('addonsContainer');
            container.innerHTML = '';
            extraOptions.forEach((opt, index) => {
                const row = document.createElement('div');
                row.className = 'flex items-center gap-2 bg-gray-100 p-2 rounded-lg border border-gray-200';
                row.innerHTML = `
            <input type="text" placeholder="${t.lblAddonName}" value="${opt.name}" oninput="updateAddon(${index}, 'name', this.value)" class="flex-1 bg-transparent border-none text-xs text-black outline-none">
            <input type="number" step="0.01" placeholder="${t.lblAddonPrice}" value="${opt.price}" oninput="updateAddon(${index}, 'price', this.value)" class="w-16 bg-transparent border-none text-xs text-black text-right outline-none">
            <button type="button" onclick="removeAddon(${index})" class="text-red-500 text-xs"><i class="fas fa-trash"></i></button>
        `;
                container.appendChild(row);
            });
        }

        function addAddon() {
            extraOptions.push({ name: '', price: 0 });
            renderAddons();
        }

        function updateAddon(index, field, value) {
            if (field === 'price') value = parseFloat(value) || 0;
            extraOptions[index][field] = value;
        }

        function removeAddon(index) {
            extraOptions.splice(index, 1);
            renderAddons();
        }

        async function handleSave(e) {
            if (e) e.preventDefault();

            // --- PARTE 1: RACCOLTA DATI CON SICUREZZA ---
            const get = (id) => document.getElementById(id) ? document.getElementById(id).value : '';
            const getChk = (id) => document.getElementById(id) ? document.getElementById(id).checked : false;

            if (!draftData) {
                alert("Errore: Dati bozza non caricati.");
                return;
            }

            try {
                // Assicuriamo l'esistenza della struttura base
                if (!draftData.identity) draftData.identity = {};
                if (!draftData.identity.description) draftData.identity.description = {};
                if (!draftData.pricing) draftData.pricing = {};
                if (!draftData.pricing.pricing_rules_engine) draftData.pricing.pricing_rules_engine = {};
                if (!draftData.operations) draftData.operations = {};
                if (!draftData.relations) draftData.relations = {};
                if (!draftData.relations.marketing_info) draftData.relations.marketing_info = {};
                if (!draftData.commercial_setup) draftData.commercial_setup = {};

                // Mapping campi
                draftData.identity.item_name = get('outName');
                draftData.identity.item_sku = get('outSku');
                draftData.identity.item_type = get('outType');
                draftData.identity.description.short = get('outShortDesc');
                draftData.identity.description.long = get('outLongDesc');
                draftData.identity.description.internal_notes = get('outInternal');

                draftData.pricing.base_price = parseFloat(get('outPrice')) || 0;
                draftData.pricing.unit_of_measure = get('outUnit');
                draftData.pricing.pricing_rules_engine.is_dynamic_price = getChk('outDynamicPrice');

                draftData.operations.requires_booking = getChk('outBooking');
                draftData.identity.tags = get('outTags').split(',').map(s => s.trim()).filter(Boolean);
                draftData.relations.marketing_info.target_audience_tags = get('outTarget').split(',').map(s => s.trim()).filter(Boolean);

                draftData.commercial_setup.extra_options = typeof extraOptions !== 'undefined' ? extraOptions : [];
                draftData.commercial_setup.allow_customer_notes = getChk('allowCustomerNotes');

                // --- PARTE 2: INVIO A WEBHOOK ---
                showLoader(t.status_save || "Salvataggio...");

                const n8nPayload = {
                    _auth: tg.initData,
                    ash: ash || '',
                    msg: msg || '',
                    msg_id: msg || '', // Invio entrambi per sicurezza
                    category_id: catId || '',
                    new_product_block: draftData
                };

                // Chiamata immediata con keepalive
                fetch(SAVE_WEBHOOK, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(n8nPayload),
                    keepalive: true
                });

                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');

                setTimeout(() => {
                    tg.close();
                }, 3000);

            } catch (err) {
                console.error("SAVE ERROR:", err);
                alert("Errore durante il salvataggio: " + err.message);
                hideLoader();
            }
        }

        // 12. UTILS
        function showLoader(text) {
            if (dom.loaderText) dom.loaderText.innerText = text;
            dom.loader.classList.remove('hidden');
        }

        function hideLoader() {
            dom.loader.classList.add('hidden');
        }

        document.addEventListener('DOMContentLoaded', init);

    </script>

    <!-- User Guide and Audio Guide Integration Engine -->
    <script>
    (function() {
        if (document.getElementById('userguide-drawer-overlay')) return;

        // 1. Determine HTML filename to play the correct WAV file
        const pathParts = window.location.pathname.split('/');
        const pageName = pathParts[pathParts.length - 1] || 'index.html';
        const baseName = pageName.replace('.html', '');
        
        let audioSrc = baseName + '.wav';
        if (baseName === 'add-product') audioSrc = 'catalog_add-product.wav';
        if (baseName === 'edit-product') audioSrc = 'catalog_edit-product.wav';

        // 2. Determine corresponding userguide page
        let guidePage = 'userguide/index.html';
        if (window.location.pathname.includes('/gestione/')) {
            guidePage = 'userguide/03_catalog.html';
        } else if (window.location.pathname.includes('/identity/')) {
            guidePage = 'userguide/02_onboarding.html';
        } else if (window.location.pathname.includes('/agents/')) {
            if (baseName.includes('controllo')) guidePage = 'userguide/09_controllo_gestione.html';
            else if (baseName.includes('sicurezza')) guidePage = 'userguide/11_agente_sicurezza.html';
            else guidePage = 'userguide/01_intro.html';
        } else {
            if (baseName === 'agenda') guidePage = 'userguide/10_agenda_radar.html';
            else if (baseName === 'certificator') guidePage = 'userguide/07_magazzino_logistica.html';
            else if (baseName === 'intelligent-warehouse') guidePage = 'userguide/07_magazzino_logistica.html';
            else if (baseName === 'orders-manager') guidePage = 'userguide/07_magazzino_logistica.html';
            else if (baseName === 'job-create') guidePage = 'userguide/07_magazzino_logistica.html';
            else if (baseName === 'pianificazione_itinerari') guidePage = 'userguide/07_magazzino_logistica.html';
            else if (baseName === 'fine-tuning') guidePage = 'userguide/12_fine_tuning.html';
            else if (baseName === 'risorse_umane') guidePage = 'userguide/06_team.html';
            else if (baseName === 'analisi-mercato') guidePage = 'userguide/09_controllo_gestione.html';
            else if (baseName === 'agent_intelligence') guidePage = 'userguide/09_controllo_gestione.html';
            else if (baseName === 'agenda') guidePage = 'userguide/10_agenda_radar.html';
            else if (baseName === 'assistente-sicurezza') guidePage = 'userguide/11_agente_sicurezza.html';
            else if (baseName === 'controllo_gestione') guidePage = 'userguide/09_controllo_gestione.html';
            else if (baseName === 'ecommerce') guidePage = 'userguide/04_online.html';
            else if (baseName === 'preventivi') guidePage = 'userguide/09_controllo_gestione.html';
        }

        // Calculate relative path depth
        const tcIndex = window.location.pathname.indexOf('/telegram_control/');
        let rootPath = '';
        if (tcIndex !== -1) {
            const subPath = window.location.pathname.substring(tcIndex + '/telegram_control/'.length);
            const slashCount = (subPath.match(/\//g) || []).length;
            rootPath = '../'.repeat(slashCount);
        }
        
        const finalGuideUrl = rootPath + guidePage;
        const finalAudioUrl = audioSrc;

        // 3. Inject Font Awesome stylesheet if missing
        if (!document.querySelector('link[href*="font-awesome"]') && !document.querySelector('link[href*="all.min.css"]')) {
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css';
            document.head.appendChild(link);
        }

        // 4. Inject Drawer HTML structure into Body
        const drawerHtml = `
        <div id="userguide-drawer-overlay" class="fixed inset-0 bg-slate-950/40 backdrop-blur-sm z-[99999] hidden opacity-0 transition-opacity duration-300" onclick="closeUserGuide()">
            <div id="userguide-drawer" class="fixed inset-0 max-w-md mx-auto h-screen bg-white shadow-2xl flex flex-col translate-y-full transition-transform duration-300 z-[100000]" onclick="event.stopPropagation()">
                <div class="w-full flex items-center justify-between p-4 border-b border-slate-100 shrink-0 select-none">
                    <div class="flex items-center gap-2">
                        <div class="w-2.5 h-2.5 rounded-full bg-blue-600 animate-pulse"></div>
                        <span class="text-xs font-black uppercase tracking-widest text-slate-800">Guida Utente</span>
                    </div>
                    <button onclick="closeUserGuide()" class="w-8 h-8 rounded-xl bg-slate-50 border border-slate-100 flex items-center justify-center text-slate-500 hover:bg-slate-100 active:scale-90 transition">
                        <i class="fas fa-times text-xs"></i>
                    </button>
                </div>
                <div class="flex-1 w-full overflow-hidden bg-slate-50 relative">
                    <iframe id="userguide-iframe" class="w-full h-full border-none" src=""></iframe>
                </div>
            </div>
        </div>`;
        document.body.insertAdjacentHTML('beforeend', drawerHtml);

        // 5. User Guide & Audio functions
        let voiceAudio = null;
        let isAudioPlaying = false;

        window.openUserGuide = function(url) {
            const overlay = document.getElementById('userguide-drawer-overlay');
            const drawer = document.getElementById('userguide-drawer');
            const iframe = document.getElementById('userguide-iframe');
            if (!overlay || !drawer || !iframe) return;

            window.stopAudio();
            
            iframe.src = url;
            overlay.classList.remove('hidden');
            setTimeout(() => {
                overlay.classList.remove('opacity-0');
                drawer.classList.remove('translate-y-full');
            }, 10);
        };

        window.closeUserGuide = function() {
            const overlay = document.getElementById('userguide-drawer-overlay');
            const drawer = document.getElementById('userguide-drawer');
            if (!overlay || !drawer) return;

            overlay.classList.add('opacity-0');
            drawer.classList.add('translate-y-full');
            setTimeout(() => {
                overlay.classList.add('hidden');
                document.getElementById('userguide-iframe').src = "";
            }, 300);
        };

        window.stopAudio = function() {
            if (isAudioPlaying && voiceAudio) {
                voiceAudio.pause();
                voiceAudio.currentTime = 0;
            }
            isAudioPlaying = false;
            voiceAudio = null;
            const btn = document.getElementById('btn-nav-audio');
            const icon = btn ? btn.querySelector('i') : null;
            if (icon) {
                icon.className = 'fas fa-volume-high text-xs';
            }
            if (btn) {
                btn.classList.remove('bg-black', 'text-white', 'border-black');
                btn.classList.add('bg-white', 'text-slate-500', 'border-gray-200');
            }
        };

        window.toggleAudio = function() {
            const btn = document.getElementById('btn-nav-audio');
            const icon = btn ? btn.querySelector('i') : null;

            if (!voiceAudio) {
                voiceAudio = new Audio('audio/add_product_guide.mp3');
                voiceAudio.addEventListener('ended', () => {
                    isAudioPlaying = false;
                    voiceAudio.currentTime = 0;
                    if (icon) {
                        icon.className = 'fas fa-volume-high text-xs';
                        btn.classList.remove('bg-black', 'text-white', 'border-black');
                        btn.classList.add('bg-white', 'text-slate-500', 'border-gray-200');
                    }
                });
            }

            if (isAudioPlaying) {
                window.stopAudio();
            } else {
                voiceAudio.play().then(() => {
                    isAudioPlaying = true;
                    if (icon) {
                        icon.className = 'fas fa-stop text-xs';
                        btn.classList.remove('bg-white', 'text-slate-500', 'border-gray-200');
                        btn.classList.add('bg-black', 'text-white', 'border-black');
                    }
                }).catch(err => {
                    console.error("Errore riproduzione audio:", err);
                });
            }
        };
        window.goBackToMenu = function() {
            if (window.Telegram?.WebApp?.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
            }
            if (catId) {
                location.href = `catalog.html?ash=${ash}&msg=${msg || ''}&catId=${catId}`;
            } else {
                location.href = `catalog.html?ash=${ash}&msg=${msg || ''}`;
            }
        };

        window.openUserGuide = function(url) {
            const overlay = document.getElementById('userguide-drawer-overlay');
            const drawer = document.getElementById('userguide-drawer');
            const iframe = document.getElementById('userguide-iframe');
            if (!overlay || !drawer || !iframe) return;

            if (typeof window.stopAudio === 'function') window.stopAudio();

            iframe.src = url;
            overlay.classList.remove('hidden');
            setTimeout(() => {
                overlay.classList.remove('opacity-0');
                drawer.classList.remove('translate-y-full');
            }, 10);
        };

        window.closeUserGuide = function() {
            const overlay = document.getElementById('userguide-drawer-overlay');
            const drawer = document.getElementById('userguide-drawer');
            if (!overlay || !drawer) return;

            overlay.classList.add('opacity-0');
            drawer.classList.add('translate-y-full');
            setTimeout(() => {
                overlay.classList.add('hidden');
                document.getElementById('userguide-iframe').src = "";
            }, 300);
        };
    })();
    </script>
