            const formattedNodes = courseNodes.map(n => formatCourseNode(n));

            nodesDataset = new vis.DataSet(formattedNodes);
            edgesDataset = new vis.DataSet(courseEdges.map(e => ({
                ...e,
                color: {
                    color: (e.color && e.color.color) ? e.color.color : '#94a3b8',
                    highlight: '#1e293b',
                    hover: '#0f172a'
                },
                width: e.width || 1.5,
                smooth: { type: 'continuous' },
                font: {
                    color: '#0f172a',
                    size: 9,
                    face: 'Plus Jakarta Sans',
                    align: 'top',
                    strokeWidth: 3,
                    strokeColor: '#ffffff'
                },
                arrows: { to: { enabled: true, scaleFactor: 0.5 } }
            })));

            const data = { nodes: nodesDataset, edges: edgesDataset };

            const options = {
                physics: {
                    solver: 'forceAtlas2Based',
                    forceAtlas2Based: {
                        gravitationalConstant: -100,
                        centralGravity: 0.008,
                        springLength: 85,
                        springConstant: 0.1,
                        avoidOverlap: 0.8
                    },
                    stabilization: { iterations: 180 }
                },
                interaction: {
                    hover: true,
                    dragNodes: true,
                    zoomView: true,
                    dragView: true
                }
            };

            network = new vis.Network(container, data, options);

            network.on('click', function (params) {
                if (params.nodes.length > 0) {
                    const nodeId = params.nodes[0];
                    const nodeObj = courseNodes.find(n => n.id === nodeId);
                    if (nodeObj) {
                        openDrawer(nodeObj);
                    }
                } else {
                    closeDrawer();
                }
            });
        }

        function formatCourseNode(n) {
            const isHub = n.id === 'HUB_CORSO';
            const isPilastro = n.cluster === 'PILASTR';
            const isPartner = n.cluster === 'PARTNER';

            let size = isHub ? 48 : (isPilastro || isPartner ? 34 : 26);
            let fontSize = isHub ? 15 : (isPilastro || isPartner ? 12 : 10.5);
            let iconColor = n.color || '#334155';

            return {
                id: n.id,
                label: n.name,
                shape: 'icon',
                icon: {
                    face: '"Font Awesome 6 Free"',
                    code: n.faIcon || '\uf068',
                    size: size,
                    color: iconColor,
                    weight: '900'
                },
                font: {
                    color: '#091322',
                    size: fontSize,
                    face: 'Plus Jakarta Sans',
                    fontBold: true,
                    strokeWidth: 4,
                    strokeColor: '#ffffff'
                },
                data: n
            };
        }

        function openDrawer(data) {
            const drawer = document.getElementById('node-drawer');
            document.getElementById('drawer-title').innerText = data.name;
            document.getElementById('drawer-desc').innerText = data.desc;

            const badge = document.getElementById('drawer-badge');
            if (data.cluster === 'HUB') {
                badge.innerText = 'CORSO PRINCIPALE';
                badge.className = 'px-2 py-0.5 rounded-full text-[8px] font-black uppercase tracking-wider bg-slate-900 text-white shrink-0';
            } else if (data.cluster === 'PARTNER') {
                badge.innerText = 'ATENEO & PARTNER';
                badge.className = 'px-2 py-0.5 rounded-full text-[8px] font-black uppercase tracking-wider bg-blue-600 text-white shrink-0';
            } else if (data.cluster === 'PILASTR') {
                badge.innerText = 'PILASTRO DIDATTICO';
                badge.className = 'px-2 py-0.5 rounded-full text-[8px] font-black uppercase tracking-wider bg-indigo-700 text-white shrink-0';
            } else if (data.cluster === 'AGENT') {
                badge.innerText = 'FUNZIONE CLINIC AGENT';
                badge.className = 'px-2 py-0.5 rounded-full text-[8px] font-black uppercase tracking-wider bg-slate-800 text-white shrink-0';
            } else if (data.cluster === 'DELIVER') {
                badge.innerText = 'KIT & GARANZIE';
                badge.className = 'px-2 py-0.5 rounded-full text-[8px] font-black uppercase tracking-wider bg-emerald-700 text-white shrink-0';
            }

            const extraBox = document.getElementById('drawer-extra');
            if (data.extra) {
                extraBox.innerHTML = `<span class="font-bold text-slate-800 uppercase text-[9px] tracking-wider block">Note Operative:</span><p class="text-slate-600">${data.extra}</p>`;
                extraBox.classList.remove('hidden');
            } else {
                extraBox.classList.add('hidden');
            }

            const linkBtn = document.getElementById('drawer-link');
            linkBtn.href = data.link || 'index.html';

            drawer.classList.remove('closed');
        }

        function closeDrawer() {
            document.getElementById('node-drawer').classList.add('closed');
        }

        function toggleCluster(cluster) {
            if (activeClusters.has(cluster)) {
                activeClusters.delete(cluster);
            } else {
                activeClusters.add(cluster);
            }

            if (activeClusters.size === 0) {
                activeClusters = new Set(['HUB', 'PARTNER', 'PILASTR', 'AGENT', 'DELIVER']);
            }

            updateFilterUI();
            applyFilter();
        }

        function resetAllClusters() {
            activeClusters = new Set(['HUB', 'PARTNER', 'PILASTR', 'AGENT', 'DELIVER']);
            updateFilterUI();
            applyFilter();
        }

        function updateFilterUI() {
            ['HUB', 'PARTNER', 'PILASTR', 'AGENT', 'DELIVER'].forEach(k => {
                const btn = document.getElementById(`btn-cluster-${k}`);
                if (!btn) return;
                if (activeClusters.has(k)) {
                    btn.className = 'cluster-btn active w-10 h-10 rounded-xl flex flex-col items-center justify-center transition-all shadow-xs bg-slate-900 text-white ring-2 ring-slate-900';
                } else {
                    btn.className = 'cluster-btn w-10 h-10 rounded-xl flex flex-col items-center justify-center transition-all shadow-xs bg-white text-slate-400 hover:text-slate-700 border border-slate-200';
                }
            });
        }

        function applyFilter() {
            const filteredNodes = courseNodes.filter(n => {
                if (activeClusters.size === 5) return true;
                return activeClusters.has(n.cluster);
            });

            const visibleIds = new Set(filteredNodes.map(n => n.id));
            const filteredEdges = courseEdges.filter(e => visibleIds.has(e.from) && visibleIds.has(e.to));

            nodesDataset.clear();
            nodesDataset.add(filteredNodes.map(n => formatCourseNode(n)));

            edgesDataset.clear();
            edgesDataset.add(filteredEdges.map(e => ({
                ...e,
                color: {
                    color: (e.color && e.color.color) ? e.color.color : '#94a3b8',
                    highlight: '#1e293b',
                    hover: '#0f172a'
                },
                width: e.width || 1.5,
                smooth: { type: 'continuous' },
                font: {
                    color: '#0f172a',
                    size: 9,
                    face: 'Plus Jakarta Sans',
                    align: 'top',
                    strokeWidth: 3,
                    strokeColor: '#ffffff'
                },
                arrows: { to: { enabled: true, scaleFactor: 0.5 } }
            })));

            if (network) {
                setTimeout(() => {
                    network.fit({
                        animation: { duration: 500, easingFunction: 'easeInOutQuad' }
                    });
                }, 40);
            }
        }

        function resetGraphView() {
            resetAllClusters();
            if (network) {
                network.fit({
                    animation: { duration: 600, easingFunction: 'easeInOutQuad' }
                });
            }
        }

        // Attende il caricamento di loghi e immagini prima di aprire la finestra di stampa

            const immagini = Array.from(contenitore.querySelectorAll('img'));
            const attese = immagini.map(img => (img.complete && img.naturalWidth > 0)
                ? Promise.resolve()
                : new Promise(risolvi => { img.onload = risolvi; img.onerror = risolvi; }));
            const limite = new Promise(risolvi => setTimeout(risolvi, 4000));
            Promise.race([Promise.all(attese), limite]).then(() => {
                const fontPronti = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();

            });
