        function initGraph() {
            const container = document.getElementById('network-graph');

            const formattedNodes = rawNodes.map(n => {
                if (n.id.startsWith('HUB_')) {
                    return {
                        ...n
                    };
                }

                // PALETTE RIGOROSA IN TONI DI GRIGIO
                let bg = '#ffffff', border = '#0f172a', fontColor = '#0f172a';
                if (n.isBot) { bg = '#0f172a'; border = '#0f172a'; fontColor = '#ffffff'; }
                else if (n.isAI) { bg = '#f8fafc'; border = '#334155'; fontColor = '#0f172a'; }
                else if (n.cluster === 'OWNER') { bg = '#ffffff'; border = '#1e293b'; fontColor = '#0f172a'; }
                else if (n.cluster === 'OPERATOR') { bg = '#f1f5f9'; border = '#475569'; fontColor = '#0f172a'; }
                else if (n.cluster === 'CUSTOMER') { bg = '#f8fafc'; border = '#64748b'; fontColor = '#0f172a'; }

                return {
                    id: n.id,
                    label: n.label,
                    shape: 'circle',
                    color: { background: bg, border: border, highlight: { background: '#0f172a', border: '#0f172a' } },
                    font: { color: n.isBot ? '#ffffff' : fontColor, size: 20, face: 'Plus Jakarta Sans', fontBold: true },
                    size: 20,
                    data: n
                };
            });

            nodesDataset = new vis.DataSet(formattedNodes);
            edgesDataset = new vis.DataSet(rawEdges.map(e => ({
                ...e,
                width: e.width || 1.5,
                smooth: { type: 'continuous' },
                font: { size: 8, fill: '#475569', strokeWidth: 0, align: 'middle' },
                arrows: { to: { enabled: true, scaleFactor: 0.5 } }
            })));

            const data = { nodes: nodesDataset, edges: edgesDataset };

            const options = {
                physics: {
                    solver: 'forceAtlas2Based',
                    forceAtlas2Based: {
                        gravitationalConstant: -35,
                        centralGravity: 0.015,
                        springLength: 95,
                        springConstant: 0.05
                    },
                    stabilization: { iterations: 140 }
                },
                interaction: {
                    hover: true,
                    dragNodes: true,
                    zoomView: true,
                    dragView: true
                }
            };

            network = new vis.Network(container, data, options);

            // CLICK NODO -> SHOW FLOATING CARD
            network.on('click', function (params) {
                if (params.nodes.length > 0) {
                    const nodeId = params.nodes[0];
                    const nodeObj = formattedNodes.find(n => n.id === nodeId);
                    if (nodeObj && (nodeObj.data || nodeObj.title)) {
                        openDrawer(nodeObj.data || nodeObj);
                    }
                } else {
                    closeDrawer();
                }
            });

            // HOVER NODO -> SHOW FLOATING CARD
            network.on('hoverNode', function (params) {
                const nodeId = params.node;
                const nodeObj = formattedNodes.find(n => n.id === nodeId);
                if (nodeObj && nodeObj.data) {
                    openDrawer(nodeObj.data);
                }
            });
        }

        function openDrawer(data) {
            const drawer = document.getElementById('node-drawer');
            document.getElementById('drawer-title').innerText = `${data.label || ''} ${data.name || data.title || ''}`;
            document.getElementById('drawer-desc').innerText = data.desc || 'Modulo interconnesso nell architettura SiTeBoS.';
            document.getElementById('drawer-link').href = data.link || '#';

            const badge = document.getElementById('drawer-badge');
            if (data.isBot) {
                badge.innerText = 'TELEGRAM BOT';
                badge.className = 'inline-block px-2.5 py-0.5 rounded-full text-[9px] font-black uppercase tracking-wider bg-black text-white';
            } else if (data.isAI || data.cluster === 'AI') {
                badge.innerText = 'AI PIPELINE';
                badge.className = 'inline-block px-2.5 py-0.5 rounded-full text-[9px] font-black uppercase tracking-wider bg-gray-800 text-white';
            } else if (data.cluster === 'OWNER') {
                badge.innerText = 'OWNER CLUSTER';
                badge.className = 'inline-block px-2.5 py-0.5 rounded-full text-[9px] font-black uppercase tracking-wider bg-gray-900 text-white';
            } else if (data.cluster === 'OPERATOR') {
                badge.innerText = 'OPERATOR CLUSTER';
                badge.className = 'inline-block px-2.5 py-0.5 rounded-full text-[9px] font-black uppercase tracking-wider bg-gray-700 text-white';
            } else if (data.cluster === 'CUSTOMER') {
                badge.innerText = 'CUSTOMER CLUSTER';
                badge.className = 'inline-block px-2.5 py-0.5 rounded-full text-[9px] font-black uppercase tracking-wider bg-gray-600 text-white';
            }

            drawer.classList.remove('closed');
        }

        function closeDrawer() {
            document.getElementById('node-drawer').classList.add('closed');
        }

        function filterCluster(cluster) {
            document.querySelectorAll('.flt-btn').forEach(btn => {

            if (activeBtn) {
                activeBtn.className = 'flt-btn px-3 py-1 rounded-full text-[9px] font-black uppercase tracking-wider bg-black text-white shadow-md';
            }

            if (cluster === 'ALL') {
                nodesDataset.clear();
                nodesDataset.add(rawNodes.map(n => formattedNode(n)));
            } else if (cluster === 'BOT') {
                const filtered = rawNodes.filter(n => n.isBot);
                nodesDataset.clear();
                nodesDataset.add(filtered.map(n => formattedNode(n)));
            } else if (cluster === 'AI') {
                const filtered = rawNodes.filter(n => n.isAI || n.cluster === 'AI');
                nodesDataset.clear();
                nodesDataset.add(filtered.map(n => formattedNode(n)));
            } else {
                const filtered = rawNodes.filter(n => n.cluster === cluster || n.id === `HUB_${cluster}` || n.id === 'HUB_AI_ENGINE');
                nodesDataset.clear();
                nodesDataset.add(filtered.map(n => formattedNode(n)));
            }
            network.fit({ animation: true });
        }

        function formattedNode(n) {
            if (n.id === 'HUB_AI_ENGINE') return n;
            if (n.shape === 'circle' && n.id.startsWith('HUB_')) return n;

            let bg = '#ffffff', border = '#0f172a', fontColor = '#0f172a';
            if (n.isBot) { bg = '#0f172a'; border = '#0f172a'; fontColor = '#ffffff'; }
            else if (n.isAI) { bg = '#f8fafc'; border = '#334155'; fontColor = '#0f172a'; }
            else if (n.cluster === 'OPERATOR') { bg = '#f1f5f9'; border = '#475569'; fontColor = '#0f172a'; }
            else if (n.cluster === 'CUSTOMER') { bg = '#f8fafc'; border = '#64748b'; fontColor = '#0f172a'; }

            return {
                id: n.id,
                label: n.label,
                shape: 'circle',
                color: { background: bg, border: border },
                font: { color: n.isBot ? '#ffffff' : fontColor, size: 20, face: 'Plus Jakarta Sans', fontBold: true },
                size: 20,
                data: n
            };
        }

        function resetGraphView() {
            if (network) network.fit({ animation: true });
        }

        window.onload = function () {
            initGraph();
        };
    </script>
</body>

</html>
