        function initGraph() {
            const container = document.getElementById('network-graph');

            const formattedNodes = rawNodes.map(n => formattedNode(n));

            nodesDataset = new vis.DataSet(formattedNodes);
            edgesDataset = new vis.DataSet(rawEdges.map(e => ({
                ...e,
                color: {
                    color: (e.color && e.color.color) ? e.color.color : '#94a3b8',
                    highlight: '#475569',
                    hover: '#334155'
                },
                width: e.width || 1.5,
                smooth: { type: 'continuous' },
                font: {
                    color: '#0f172a',
                    size: 9,
                    face: 'Inter, system-ui, sans-serif',
                    align: 'top',
                    strokeWidth: 4,
                    strokeColor: '#ffffff'
                },
                arrows: { to: { enabled: true, scaleFactor: 0.5 } }
            })));

            const data = { nodes: nodesDataset, edges: edgesDataset };

            const options = {
                physics: {
                    solver: 'forceAtlas2Based',
                    forceAtlas2Based: {
                        gravitationalConstant: -95,
                        centralGravity: 0.004,
                        springLength: 160,
                        springConstant: 0.03
                    },
                    stabilization: { iterations: 160 }
                },
                interaction: {
                    hover: true,
                    dragNodes: true,
                    zoomView: true,
                    dragView: true
                }
            };

            network = new vis.Network(container, data, options);

            // CLICK NODO -> SHOW FLOATING CARD
            network.on('click', function (params) {
                if (params.nodes.length > 0) {
                    const nodeId = params.nodes[0];
                    const nodeObj = formattedNodes.find(n => n.id === nodeId);
                    if (nodeObj && (nodeObj.data || nodeObj.title)) {
                        openDrawer(nodeObj.data || nodeObj);
                    }
                } else {
                    closeDrawer();
                }
            });

            // SALVA E MANTIENI LA POSIZIONE DI TRASCINAMENTO DEL NODO
            network.on('dragEnd', function (params) {
                if (params.nodes && params.nodes.length > 0) {
                    params.nodes.forEach(function (nodeId) {
                        const pos = network.getPosition(nodeId);
                        nodesDataset.update({
                            id: nodeId,
                            x: pos.x,
                            y: pos.y,
                            physics: false,
                            fixed: false
                        });
                    });
                    saveGraphPositions();
                }
            });

            // DOPPIO CLICK SULLO SCHERMO / NODO -> ESPANSIONE REATTIVA DELLE CONNESSIONI & FOCUS
            network.on('doubleClick', function (params) {
                if (params.nodes && params.nodes.length > 0) {
                    const selectedNode = params.nodes[0];
                    // Trova tutti i nodi connessi direttamente (1-hop neighbors)
                    const connectedNodes = network.getConnectedNodes(selectedNode);
                    const focusCluster = [selectedNode, ...connectedNodes];
                    
                    // Seleziona il gruppo di nodi e flussi connessi
                    network.selectNodes(focusCluster);

                    // Animazione fluida di zoom & focus sulle connessioni del nodo
                    network.fit({
                        nodes: focusCluster,
                        animation: {
                            duration: 700,
                            easingFunction: 'easeInOutQuad'
                        }
                    });
                } else {
                    // Doppio click su spazio vuoto dello schermo -> Espansione totale a schermo intero (Reset View)
                    network.fit({
                        animation: {
                            duration: 700,
                            easingFunction: 'easeInOutQuad'
                        }
                    });
                }
            });
        }

        function saveGraphPositions() {
            if (!network) return;
            const positions = network.getPositions();
            localStorage.setItem('sitebos_userguide_graph_positions', JSON.stringify(positions));
        }

        function getSavedGraphPositions() {
            try {
                const saved = localStorage.getItem('sitebos_userguide_graph_positions');
                return saved ? JSON.parse(saved) : {};
            } catch (e) {
                return {};
            }
        }

        let activeClusters = new Set(['OWNER', 'OPERATOR', 'CUSTOMER', 'AI']);

        function openDrawer(data) {
            const drawer = document.getElementById('node-drawer');
            const iframe = document.getElementById('guide-iframe');
            
            document.getElementById('drawer-title').innerHTML = `<i class="${data.faClass || 'fas fa-cube'} text-slate-900 mr-1.5"></i> ${data.name || data.title || ''}`;
            
            const targetUrl = data.link || '01_intro.html';
            document.getElementById('drawer-fullscreen-link').href = targetUrl;
            
            if (iframe.src !== targetUrl && !iframe.src.endsWith(targetUrl)) {
                iframe.src = targetUrl;
            }

            const badge = document.getElementById('drawer-badge');
            if (data.isAI || data.cluster === 'AI') {
                badge.innerText = 'SITEBOS ENGINE';
                badge.className = 'px-2 py-0.5 rounded-full text-[8px] font-black uppercase tracking-wider bg-slate-900 text-white shrink-0';
            } else if (data.cluster === 'OWNER') {
                badge.innerText = 'OWNER';
                badge.className = 'px-2 py-0.5 rounded-full text-[8px] font-black uppercase tracking-wider bg-slate-900 text-white shrink-0';
            } else if (data.cluster === 'OPERATOR') {
                badge.innerText = 'STAFF';
                badge.className = 'px-2 py-0.5 rounded-full text-[8px] font-black uppercase tracking-wider bg-slate-800 text-white shrink-0';
            } else if (data.cluster === 'CUSTOMER') {
                badge.innerText = 'CLIENT';
                badge.className = 'px-2 py-0.5 rounded-full text-[8px] font-black uppercase tracking-wider bg-slate-700 text-white shrink-0';
            }

            drawer.classList.remove('closed');
        }

        function closeDrawer() {
            document.getElementById('node-drawer').classList.add('closed');
        }

        function toggleCluster(cluster) {
            if (activeClusters.has(cluster)) {
                activeClusters.delete(cluster);
            } else {
                activeClusters.add(cluster);
            }

            // Se disattivati tutti e 4, riattiva automaticamente tutti
            if (activeClusters.size === 0) {
                activeClusters = new Set(['OWNER', 'OPERATOR', 'CUSTOMER', 'AI']);
            }

            updateClusterButtonsUI();
            applyClusterFilter();
        }

        function resetAllClusters() {
            activeClusters = new Set(['OWNER', 'OPERATOR', 'CUSTOMER', 'AI']);
            updateClusterButtonsUI();
            applyClusterFilter();
        }

        function updateClusterButtonsUI() {
            ['OWNER', 'OPERATOR', 'CUSTOMER', 'AI'].forEach(c => {
                const btn = document.getElementById(`btn-cluster-${c}`);
                if (btn) {
                    if (activeClusters.has(c)) {
                        btn.className = 'cluster-btn active w-11 h-11 rounded-full flex flex-col items-center justify-center transition-all duration-200 shadow-md bg-slate-900 text-white ring-2 ring-slate-900 scale-105';
                    } else {
                        btn.className = 'cluster-btn w-11 h-11 rounded-full flex flex-col items-center justify-center transition-all duration-200 bg-white/90 text-slate-400 border border-slate-200 opacity-60 hover:opacity-100 hover:scale-105';
                    }
                }
            });
        }

        function applyClusterFilter() {
            const filteredNodes = rawNodes.filter(n => {
                if (activeClusters.size === 4) return true;
                
                const isAI = n.isAI || n.cluster === 'AI';
                if (isAI && activeClusters.has('AI')) return true;
                if (n.id === 'lavagna_jobs' && (activeClusters.has('OWNER') || activeClusters.has('OPERATOR'))) return true;
                if (n.cluster === 'OWNER' && activeClusters.has('OWNER')) return true;
                if (n.cluster === 'OPERATOR' && activeClusters.has('OPERATOR')) return true;
                if (n.cluster === 'CUSTOMER' && activeClusters.has('CUSTOMER')) return true;
                if (n.id === 'HUB_AI_ENGINE' && activeClusters.has('AI')) return true;
                if (n.id === 'HUB_OWNER' && activeClusters.has('OWNER')) return true;
                if (n.id === 'HUB_OPERATOR' && (activeClusters.has('OPERATOR') || activeClusters.has('OWNER'))) return true;
                if (n.id === 'HUB_CUSTOMER' && (activeClusters.has('CUSTOMER') || activeClusters.has('OWNER'))) return true;
                
                return false;
            });

            nodesDataset.clear();
            nodesDataset.add(filteredNodes.map(n => formattedNode(n)));

            // Filtra solo gli archi le cui due estremità sono visibili
            const visibleNodeIds = new Set(filteredNodes.map(n => n.id));
            const filteredEdges = rawEdges.filter(e => visibleNodeIds.has(e.from) && visibleNodeIds.has(e.to));

            edgesDataset.clear();
            edgesDataset.add(filteredEdges.map(e => ({
                ...e,
                color: {
                    color: (e.color && e.color.color) ? e.color.color : '#94a3b8',
                    highlight: '#475569',
                    hover: '#334155'
                },
                width: e.width || 1.5,
                smooth: { type: 'continuous' },
                font: {
                    color: '#0f172a',
                    size: 9,
                    face: 'Inter, system-ui, sans-serif',
                    align: 'top',
                    strokeWidth: 4,
                    strokeColor: '#ffffff'
                },
                arrows: { to: { enabled: true, scaleFactor: 0.5 } }
            })));

            network.fit({ animation: true });
        }

        function formattedNode(n) {
            const savedPositions = getSavedGraphPositions();
            const savedPos = savedPositions[n.id];

            let iconColor = '#0f172a';
            if (n.id.startsWith('HUB_')) {
                iconColor = '#0f172a';
            } else if (n.isAI) {
                iconColor = '#1e293b';
            } else if (n.cluster === 'OPERATOR') {
                iconColor = '#334155';
            } else if (n.cluster === 'CUSTOMER') {
                iconColor = '#475569';
            }

            return {
                id: n.id,
                label: n.name || n.title || n.label,
                shape: 'icon',
                icon: {
                    face: '"Font Awesome 6 Free"',
                    code: n.faIcon || '\uf068',
                    size: n.id.startsWith('HUB_') ? 36 : 24,
                    color: iconColor,
                    weight: '900'
                },
                font: {
                    color: '#0f172a',
                    size: 11,
                    face: 'Plus Jakarta Sans',
                    fontBold: true
                },
                data: n,
                ...(savedPos ? { x: savedPos.x, y: savedPos.y, physics: false, fixed: false } : {})
            };
        }

        function resetGraphView() {
            localStorage.removeItem('sitebos_userguide_graph_positions');
            if (nodesDataset) {
                const updates = nodesDataset.get().map(n => ({
                    id: n.id,
                    physics: true,
                    fixed: false
                }));
                nodesDataset.update(updates);
            }
            if (network) network.fit({ animation: true });
        }

        window.onload = function () {
            if (document.fonts && document.fonts.load) {
                Promise.all([
                    document.fonts.load('900 20px "Font Awesome 6 Free"'),
                    document.fonts.ready
                ]).then(function () {
                    initGraph();
                }).catch(function () {
                    initGraph();
                });
            } else {
                setTimeout(initGraph, 300);
            }
        };
    </script>
</body>

</html>
