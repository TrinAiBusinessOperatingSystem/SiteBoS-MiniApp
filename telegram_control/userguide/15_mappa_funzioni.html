        function initGraph() {
            const container = document.getElementById('network-graph');

            const formattedNodes = rawNodes.map(n => formattedNode(n));

            nodesDataset = new vis.DataSet(formattedNodes);
            edgesDataset = new vis.DataSet(rawEdges.map(e => ({
                ...e,
                color: {
                    color: (e.color && e.color.color) ? e.color.color : '#94a3b8',
                    highlight: '#475569',
                    hover: '#334155'
                },
                width: e.width || 1.5,
                smooth: { type: 'continuous' },
                font: {
                    color: '#0f172a',
                    size: 9,
                    face: 'Inter, system-ui, sans-serif',
                    align: 'top',
                    strokeWidth: 4,
                    strokeColor: '#ffffff'
                },
                arrows: { to: { enabled: true, scaleFactor: 0.5 } }
            })));

            const data = { nodes: nodesDataset, edges: edgesDataset };

            const options = {
                physics: {
                    solver: 'forceAtlas2Based',
                    forceAtlas2Based: {
                        gravitationalConstant: -110,
                        centralGravity: 0.005,
                        springLength: 75,
                        springConstant: 0.12,
                        avoidOverlap: 0.7
                    },
                    stabilization: { iterations: 200 }
                },
                interaction: {
                    hover: true,
                    dragNodes: true,
                    zoomView: true,
                    dragView: true
                }
            };

            network = new vis.Network(container, data, options);



            // CLICK NODO O SPAZIO VUOTO (SUL BIANCO) -> EVENTO UNICO E DEBOUCED DI VIS-NETWORK
            // CLICK NODO O SPAZIO VUOTO (SUL BIANCO) -> ARRESTA SPIN 3D E RIPRISTINA LAYOUT PIATTO
            network.on('click', function (params) {
                if (params.nodes.length > 0) {
                    const nodeId = params.nodes[0];
                    stopJarvisSphereMode();
                    reLayoutPyramidFromRoot(nodeId);

                    const nodeObj = rawNodes.find(n => n.id === nodeId);
                    if (nodeObj) {
                        openDrawer(nodeObj);
                    }
                } else {
                    // CLICK SU BIANCO / SPAZIO VUOTO -> ARRESTA LO SPIN E RIPRISTINA LAYOUT PIATTO
                    closeDrawer();
                    if (network) network.unselectNodes();
                    if (isJarvisSphereActive) {
                        stopJarvisSphereMode();
                        applyClusterFilter();
                    }
                }
            });

            // TRASCINAMENTO (DRAG START) -> ARRESTA LO SPIN 3D E RIPRISTINA LAYOUT PIATTO
            network.on('dragStart', function (params) {
                if (isJarvisSphereActive) {
                    stopJarvisSphereMode();
                    applyClusterFilter();
                }
            });

            // ZOOM -> ARRESTA LO SPIN 3D E RIPRISTINA LAYOUT PIATTO
            network.on('zoom', function (params) {
                if (isJarvisSphereActive) {
                    stopJarvisSphereMode();
                    applyClusterFilter();
                }
            });

            // AVVIO SFERA OLOGRAFICA FLUTTUANTE 3D TYPE JARVIS ALL'INGRESSO
            startJarvisSphereMode();

            // SALVA E MANTIENI LA POSIZIONE DI TRASCINAMENTO DEL NODO
            network.on('dragEnd', function (params) {
                if (params.nodes && params.nodes.length > 0) {
                    params.nodes.forEach(function (nodeId) {
                        const pos = network.getPosition(nodeId);
                        nodesDataset.update({
                            id: nodeId,
                            x: pos.x,
                            y: pos.y,
                            physics: false,
                            fixed: false
                        });
                    });
                    saveGraphPositions();
                }
            });

            // DOPPIO CLICK SULLO SCHERMO / NODO -> ESPANSIONE REATTIVA DELLE CONNESSIONI & FOCUS
            network.on('doubleClick', function (params) {
                if (params.nodes && params.nodes.length > 0) {
                    const selectedNode = params.nodes[0];
                    // Trova tutti i nodi connessi direttamente (1-hop neighbors)
                    const connectedNodes = network.getConnectedNodes(selectedNode);
                    const focusCluster = [selectedNode, ...connectedNodes];
                    
                    // Seleziona il gruppo di nodi e flussi connessi
                    network.selectNodes(focusCluster);

                    // Animazione fluida di zoom & focus sulle connessioni del nodo
                    network.fit({
                        nodes: focusCluster,
                        animation: {
                            duration: 700,
                            easingFunction: 'easeInOutQuad'
                        }
                    });
                } else {
                    // Doppio click su spazio vuoto dello schermo -> Espansione totale a schermo intero (Reset View)
                    network.fit({
                        animation: {
                            duration: 700,
                            easingFunction: 'easeInOutQuad'
                        }
                    });
                }
            });
        }

        function saveGraphPositions() {
            if (!network) return;
            const positions = network.getPositions();
            localStorage.setItem('sitebos_userguide_graph_positions', JSON.stringify(positions));

        // MOTORE SFERA OLOGRAFICA FLUTTUANTE 3D TYPE JARVIS (SOLO NODI ROTANTI, SFONDO FISSO SENZA TILT)
        let jarvisAnimationFrame = null;
        let sphereAngleY = 0;
        let sphereAngleX = 0.12;
        let isJarvisSphereActive = false;
        let rawCoords3D = {};

        function assign3DSphericalCoordinates(nodes) {
            const numNodes = nodes.length;
            const phi = (1 + Math.sqrt(5)) / 2; // Sezione Aurea Fibonacci
            const radius = 380;

            const coords = {};
            nodes.forEach((n, i) => {
                if (n.id === 'HUB_OWNER') {
                    // VERTICE TOP DEL TRIANGOLO MAESTRO
                    coords[n.id] = { x: 0, y: -450, z: 0, isFixedVertex: true };
                } else if (n.id === 'HUB_OPERATOR') {
                    // VERTICE BASSO-SINISTRA DEL TRIANGOLO MAESTRO
                    coords[n.id] = { x: -550, y: 350, z: 0, isFixedVertex: true };
                } else if (n.id === 'HUB_CUSTOMER') {
                    // VERTICE BASSO-DESTRA DEL TRIANGOLO MAESTRO
                    coords[n.id] = { x: 550, y: 350, z: 0, isFixedVertex: true };
                } else if (n.id === 'HUB_AI_ENGINE') {
                    coords[n.id] = { x: 0, y: -650, z: -100 };
                } else {
                    const y = 0.7 - (i / (numNodes - 1)) * 1.4;
                    const rAtY = Math.sqrt(Math.max(0.1, 1 - y * y));
                    const theta = 2 * Math.PI * i / phi;

                    coords[n.id] = {
                        x: Math.cos(theta) * rAtY * radius,
                        y: y * radius,
                        z: Math.sin(theta) * rAtY * radius
                    };
                }
            });
            return coords;
        }

        function startJarvisSphereMode() {
            if (isJarvisSphereActive) return;
            isJarvisSphereActive = true;

            if (network) {
                network.setOptions({ physics: false });
            }

            const btn3D = document.getElementById('btn-toggle-3d');
            if (btn3D) {
                btn3D.className = 'w-11 h-11 rounded-full flex flex-col items-center justify-center bg-slate-900 text-white shadow-lg ring-2 ring-slate-900 scale-105 transition-all';
            }

            const visibleNodes = nodesDataset.get();
            rawCoords3D = assign3DSphericalCoordinates(visibleNodes);

            if (jarvisAnimationFrame) {
                cancelAnimationFrame(jarvisAnimationFrame);
                jarvisAnimationFrame = null;
            }
            animateJarvisSphere();
        }

        function stopJarvisSphereMode() {
            isJarvisSphereActive = false;
            if (jarvisAnimationFrame) {
                cancelAnimationFrame(jarvisAnimationFrame);
                jarvisAnimationFrame = null;
            }
            if (network) {
                network.setOptions({ physics: false });
            }
            const btn3D = document.getElementById('btn-toggle-3d');
            if (btn3D) {
                btn3D.className = 'w-11 h-11 rounded-full flex flex-col items-center justify-center bg-gray-100 hover:bg-black hover:text-white text-gray-700 transition-all shadow-sm';
            }
        }

        let lastToggleTime = 0;
        function toggleJarvisSphereMode() {
            const now = Date.now();
            if (now - lastToggleTime < 300) return; // Guard anti-doppio trigger
            lastToggleTime = now;

            if (isJarvisSphereActive) {
                stopJarvisSphereMode();
            } else {
                startJarvisSphereMode();
            }
        }

        function animateJarvisSphere() {
            if (!isJarvisSphereActive || !nodesDataset) {
                if (jarvisAnimationFrame) {
                    cancelAnimationFrame(jarvisAnimationFrame);
                    jarvisAnimationFrame = null;
                }
                return;
            }

            sphereAngleY += 0.007; // Rotazione continua 3D orbita Y
            const cosY = Math.cos(sphereAngleY);
            const sinY = Math.sin(sphereAngleY);
            const cosX = Math.cos(sphereAngleX);
            const sinX = Math.sin(sphereAngleX);

            const focalLength = 650;
            const updates = [];

            const visibleNodes = nodesDataset.get();
            visibleNodes.forEach(n => {
                const orig = rawCoords3D[n.id];
                if (!orig) return;

                // I 3 NODI DEL TRIANGOLO MAESTRO (OWNER TOP, OPERATOR BASSO-SX, CUSTOMER BASSO-DX) STANNO BLOCCATI AI VERTICI
                if (n.id === 'HUB_OWNER') {
                    updates.push({ id: n.id, x: 0, y: -450, physics: false });
                    return;
                }
                if (n.id === 'HUB_OPERATOR') {
                    updates.push({ id: n.id, x: -550, y: 350, physics: false });
                    return;
                }
                if (n.id === 'HUB_CUSTOMER') {
                    updates.push({ id: n.id, x: 550, y: 350, physics: false });
                    return;
                }

                // Calcolo Matrice di Rotazione Spaziale 3D per i nodi interni del triangolo
                const x1 = orig.x * cosY - orig.z * sinY;
                const z1 = orig.x * sinY + orig.z * cosY;
                const y1 = orig.y * cosX - z1 * sinX;
                const z2 = orig.y * sinX + z1 * cosX;

                // Proiezione Prospettica Spaziale 3D -> 2D
                const scale = focalLength / (focalLength + z2);
                const screenX = x1 * scale;
                const screenY = y1 * scale;

                updates.push({
                    id: n.id,
                    x: screenX,
                    y: screenY,
                    physics: false
                });
            });

            nodesDataset.update(updates);

            if (isJarvisSphereActive) {
                jarvisAnimationFrame = requestAnimationFrame(animateJarvisSphere);
            }
        }

        function toggle3DMode() {
            if (isJarvisSphereActive) {
                stopJarvisSphereMode();
                applyClusterFilter();
            } else {
                startJarvisSphereMode();

        // CALCOLO GERARCHICO DELLA PROSSIMITÀ A PIRAMIDE DALL'ALTO VERSO IL BASSO
        function computeHubProximities(visibleNodes, visibleEdges, activeHubIds, hubPositions) {
            const nodePositions = {};
            const adj = {};

            visibleNodes.forEach(n => { adj[n.id] = []; });
            visibleEdges.forEach(e => {
                if (adj[e.from]) adj[e.from].push(e.to);
                if (adj[e.to]) adj[e.to].push(e.from);
            });

            const queue = [];
            const visited = new Set();
            const hubHopGroups = {};

            activeHubIds.forEach(hId => {
                if (hubPositions[hId]) {
                    nodePositions[hId] = { x: hubPositions[hId].x, y: hubPositions[hId].y, hop: 0, hubOwner: hId };
                    queue.push({ id: hId, hubOwner: hId, hop: 0 });
                    visited.add(hId);
                    hubHopGroups[hId] = {};
                }
            });

            while (queue.length > 0) {
                const current = queue.shift();
                const neighbors = adj[current.id] || [];

                neighbors.forEach(nbrId => {
                    if (!visited.has(nbrId)) {
                        visited.add(nbrId);
                        const nextHop = current.hop + 1;
                        queue.push({ id: nbrId, hubOwner: current.hubOwner, hop: nextHop });

                        if (!hubHopGroups[current.hubOwner][nextHop]) {
                            hubHopGroups[current.hubOwner][nextHop] = [];
                        }
                        hubHopGroups[current.hubOwner][nextHop].push(nbrId);
                    }
                });
            }

            // Svolgimento a Piramide per ciascun Hub: Vertice in alto -> Righe orizzontali in basso
            activeHubIds.forEach(hubId => {
                const hPos = hubPositions[hubId];
                if (!hPos) return;

                const hops = hubHopGroups[hubId] || {};
                Object.keys(hops).forEach(hopStr => {
                    const hopLevel = parseInt(hopStr, 10);
                    const nodeList = hops[hopStr];
                    const count = nodeList.length;
                    const spacing = 160; // Spaziatura orizzontale della piramide
                    const levelY = hPos.y + 140 * hopLevel; // Avanzamento verticale verso il basso

                    const totalWidth = (count - 1) * spacing;
                    const startX = hPos.x - totalWidth / 2;

                    nodeList.forEach((nId, idx) => {
                        nodePositions[nId] = {
                            x: (count === 1) ? hPos.x : startX + idx * spacing,
                            y: levelY,
                            hop: hopLevel,
                            hubOwner: hubId
                        };
                    });
                });
            });

            return nodePositions;
        }

        // RIMODULAZIONE ISTANTANEA DELL'INTERO GRAFO A PIRAMIDE (NODO CLICCATO AL VERTICE RADICE TOP)
        function reLayoutPyramidFromRoot(rootId) {
            if (!rootId || !network) return;

            const visibleNodes = nodesDataset.get();
            const visibleEdges = edgesDataset.get();

            const adj = {};
            visibleNodes.forEach(n => { adj[n.id] = []; });
            visibleEdges.forEach(e => {
                if (adj[e.from]) adj[e.from].push(e.to);
                if (adj[e.to]) adj[e.to].push(e.from);
            });

            // BFS da rootId per calcolare la distanza di Hop di tutti i nodi visibili
            const hopLevels = {};
            const queue = [{ id: rootId, hop: 0 }];
            const visited = new Set([rootId]);
            const levelGroups = { 0: [rootId] };

            while (queue.length > 0) {
                const current = queue.shift();
                const neighbors = adj[current.id] || [];

                neighbors.forEach(nbrId => {
                    if (!visited.has(nbrId)) {
                        visited.add(nbrId);
                        const nextHop = current.hop + 1;
                        queue.push({ id: nbrId, hop: nextHop });

                        if (!levelGroups[nextHop]) {
                            levelGroups[nextHop] = [];
                        }
                        levelGroups[nextHop].push(nbrId);
                    }
                });
            }

            // Se ci sono nodi non raggiungibili da BFS (es. grappoli separati), mettili al livello più in basso
            const maxHop = Math.max(...Object.keys(levelGroups).map(k => parseInt(k, 10)));
            const unvisitedHop = maxHop + 1;
            visibleNodes.forEach(n => {
                if (!visited.has(n.id)) {
                    if (!levelGroups[unvisitedHop]) levelGroups[unvisitedHop] = [];
                    levelGroups[unvisitedHop].push(n.id);
                }
            });

            // Calcolo posizioni istantanee per ciascuna riga della Piramide
            const updates = [];
            const startY = -450;
            const rowHeight = 160;

            Object.keys(levelGroups).forEach(hopStr => {
                const hopLevel = parseInt(hopStr, 10);
                const nodesInRow = levelGroups[hopStr];
                const count = nodesInRow.length;
                const rowY = startY + hopLevel * rowHeight;

                const spacing = Math.max(140, Math.min(220, 1400 / Math.max(1, count)));
                const totalWidth = (count - 1) * spacing;
                const startX = -totalWidth / 2;

                nodesInRow.forEach((nId, idx) => {
                    const posX = (count === 1) ? 0 : startX + idx * spacing;

                    // CALCOLO ICON SIZE E FONT SIZE A SCALARE (DIMENSIONE MINIMA = 42PX COME SECONDA RIGA)
                    let iconSize = 42;
                    let fontSize = 13;

                    if (hopLevel === 0) {
                        iconSize = 76; // Nodo Selezionato Radice Top (Ultra-Large)
                        fontSize = 20;
                    } else if (hopLevel === 1) {
                        iconSize = 58; // Nodi Figli Primo Livello
                        fontSize = 16;
                    } else {
                        iconSize = 42; // Nodi Secondo Livello e Successivi (Minimo 42px)
                        fontSize = 13;
                    }

                    const isMainHub = nId.startsWith('HUB_');
                    if (isMainHub) {
                        const hubObj = rawNodes.find(rn => rn.id === nId);
                        let iconColor = '#0f172a';
                        if (nId === 'HUB_AI_ENGINE') iconColor = '#2563eb';
                        else if (nId === 'HUB_OWNER') iconColor = '#eab308';
                        else if (nId === 'HUB_OPERATOR') iconColor = '#92400e';
                        else if (nId === 'HUB_CUSTOMER') iconColor = '#16a34a';

                        updates.push({
                            id: nId,
                            x: posX,
                            y: rowY,
                            physics: false,
                            shape: 'icon',
                            icon: {
                                face: '"Font Awesome 6 Free"',
                                code: (hubObj && hubObj.faIcon) ? hubObj.faIcon : '\uf068',
                                size: hopLevel === 0 ? 76 : 56,
                                color: iconColor,
                                weight: '900'
                            },
                            font: {
                                color: '#0f172a',
                                size: hopLevel === 0 ? 18 : 15,
                                face: 'Plus Jakarta Sans',
                                fontBold: true,
                                strokeWidth: 5,
                                strokeColor: '#ffffff'
                            }
                        });
                        return;
                    }

                    const existingNode = nodesDataset.get(nId);
                    const iconCode = (existingNode && existingNode.icon && existingNode.icon.code) ? existingNode.icon.code : '\uf068';
                    const iconColor = (nId === 'HUB_AI_ENGINE') ? '#2563eb' : ((existingNode && existingNode.icon && existingNode.icon.color) ? existingNode.icon.color : '#0f172a');

                    updates.push({
                        id: nId,
                        x: posX,
                        y: rowY,
                        physics: false,
                        // ICONE ED ETICHETTE SEMPRE IN PRIMISSIMO PIANO CON BACKGROUND STACCO RIGIDO SUGLI ARCHI
                        icon: {
                            face: '"Font Awesome 6 Free"',
                            code: iconCode,
                            size: iconSize,
                            color: iconColor,
                            weight: '900'
                        },
                        font: {
                            color: '#0f172a',
                            size: fontSize,
                            face: 'Plus Jakarta Sans',
                            fontBold: true,
                            strokeWidth: 5,
                            strokeColor: '#ffffff'
                        }
                    });
                });
            });

            // Aggiornamento istantaneo del dataset dei nodi
            nodesDataset.update(updates);

            // Inquadratura immediata ed allargamento della fotocamera sull'intero grafo rimodulato
            setTimeout(() => {
                network.fit({
                    animation: {
                        duration: 450,
                        easingFunction: 'easeInOutQuad'
                    }
                });
            }, 30);
        }

        function resetProximityHighlight() {
            if (!network) return;
            applyClusterFilter();
        }

        function applyClusterFilter() {
            const filteredNodes = rawNodes.filter(n => {
                if (activeClusters.size === 4) return true;
                
                const isAI = n.isAI || n.cluster === 'AI';
                if (isAI && activeClusters.has('AI')) return true;
                if (n.id === 'lavagna_jobs' && (activeClusters.has('OWNER') || activeClusters.has('OPERATOR'))) return true;
                if (n.cluster === 'OWNER' && activeClusters.has('OWNER')) return true;
                if (n.cluster === 'OPERATOR' && activeClusters.has('OPERATOR')) return true;
                if (n.cluster === 'CUSTOMER' && activeClusters.has('CUSTOMER')) return true;
                if (n.id === 'HUB_AI_ENGINE' && activeClusters.has('AI')) return true;
                if (n.id === 'HUB_OWNER' && activeClusters.has('OWNER')) return true;
                if (n.id === 'HUB_OPERATOR' && (activeClusters.has('OPERATOR') || activeClusters.has('OWNER'))) return true;
                if (n.id === 'HUB_CUSTOMER' && (activeClusters.has('CUSTOMER') || activeClusters.has('OWNER'))) return true;
                
                return false;
            });

            const visibleNodeIds = new Set(filteredNodes.map(n => n.id));

            // DISPOSIZIONE GEOMETRICA DINAMICA DEI 4 NODI PRINCIPALI (1 CENTRO, 2 ORIZZONTALE, 3 TRIANGOLO, 4 QUADRATO)
            const allHubIds = ['HUB_AI_ENGINE', 'HUB_OWNER', 'HUB_OPERATOR', 'HUB_CUSTOMER'];
            const activeHubIds = allHubIds.filter(id => visibleNodeIds.has(id));
            
            const hubPositions = {};
            if (activeHubIds.length === 1) {
                hubPositions[activeHubIds[0]] = { x: 0, y: -450 };
            } else if (activeHubIds.length === 2) {
                hubPositions[activeHubIds[0]] = { x: -650, y: 0 };
                hubPositions[activeHubIds[1]] = { x: 650, y: 0 };
            } else if (activeHubIds.length === 3) {
                // TRIANGOLO AMPIO CHE RACCHIUDE L'INTERO GRAFO
                hubPositions[activeHubIds[0]] = { x: 0, y: -650 };
                hubPositions[activeHubIds[1]] = { x: -780, y: 500 };
                hubPositions[activeHubIds[2]] = { x: 780, y: 500 };
            } else if (activeHubIds.length === 4) {
                // PERIMETRO AMPIO CHE RACCHIUDE L'INTERO GRAFO
                hubPositions['HUB_AI_ENGINE'] = { x: 0, y: -650 };
                hubPositions['HUB_OWNER'] = { x: -800, y: 0 };
                hubPositions['HUB_OPERATOR'] = { x: 800, y: 0 };
                hubPositions['HUB_CUSTOMER'] = { x: 0, y: 650 };
            }

            // Filtra solo gli archi le cui due estremità sono visibili
            const filteredEdges = rawEdges.filter(e => visibleNodeIds.has(e.from) && visibleNodeIds.has(e.to));

            // ALGORITMO DI PROSSIMITÀ BFS PER LIVELLO DI HOP DAI 4 HUB PRINCIPALI
            const proximityPositions = computeHubProximities(filteredNodes, filteredEdges, activeHubIds, hubPositions);
            const savedPositions = getSavedGraphPositions();

            nodesDataset.clear();
            nodesDataset.add(filteredNodes.map(n => {
                const formatted = formattedNode(n);
                if (hubPositions[n.id]) {
                    return {
                        ...formatted,
                        x: hubPositions[n.id].x,
                        y: hubPositions[n.id].y,
                        physics: false
                    };
                }
                if (proximityPositions[n.id] && !savedPositions[n.id]) {
                    return {
                        ...formatted,
                        x: proximityPositions[n.id].x,
                        y: proximityPositions[n.id].y,
                        physics: false
                    };
                }
                return formatted;
            }));

            edgesDataset.clear();
            edgesDataset.add(filteredEdges.map(e => ({
                ...e,
                color: {
                    color: (e.color && e.color.color) ? e.color.color : '#94a3b8',
                    highlight: '#475569',
                    hover: '#334155'
                },
                width: e.width || 1.5,
                smooth: { type: 'continuous' },
                font: {
                    color: '#0f172a',
                    size: 9,
                    face: 'Inter, system-ui, sans-serif',
                    align: 'top',
                    strokeWidth: 4,
                    strokeColor: '#ffffff'
                },
                arrows: { to: { enabled: true, scaleFactor: 0.5 } }
            })));

            if (network) {
                setTimeout(() => {
                    network.fit({
                        animation: {
                            duration: 700,
                            easingFunction: 'easeInOutQuad'
                        }
                    });
                }, 50);
            }
        }

        function formattedNode(n) {
            const savedPositions = getSavedGraphPositions();
            const savedPos = savedPositions[n.id];
            const isMainHub = n.id.startsWith('HUB_');

            if (isMainHub) {
                let iconColor = '#0f172a';
                if (n.id === 'HUB_AI_ENGINE') {
                    iconColor = '#2563eb'; // Rotelle Engine in BLU ELETTORALE
                } else if (n.id === 'HUB_OWNER') {
                    iconColor = '#eab308'; // Corona Owner ORO
                } else if (n.id === 'HUB_OPERATOR') {
                    iconColor = '#92400e'; // Ventiquattrore Staff MARRONE CUOIO
                } else if (n.id === 'HUB_CUSTOMER') {
                    iconColor = '#16a34a'; // Utente Cliente VERDE SMERALDO
                }

                return {
                    id: n.id,
                    label: n.title || n.name || n.label,
                    shape: 'icon',
                    icon: {
                        face: '"Font Awesome 6 Free"',
                        code: n.faIcon || '\uf068',
                        size: 56,
                        color: iconColor,
                        weight: '900'
                    },
                    font: {
                        color: '#0f172a',
                        size: 16,
                        face: 'Plus Jakarta Sans',
                        fontBold: true,
                        strokeWidth: 5,
                        strokeColor: '#ffffff'
                    },
                    data: n,
                    ...(savedPos ? { x: savedPos.x, y: savedPos.y, physics: false, fixed: false } : {})
                };
            }

            let iconColor = '#0f172a';
            if (n.isAI) {
                iconColor = '#1e293b';
            } else if (n.cluster === 'OPERATOR') {
                iconColor = '#334155';
            } else if (n.cluster === 'CUSTOMER') {
                iconColor = '#475569';
            }

            return {
                id: n.id,
                label: n.name || n.title || n.label,
                shape: 'icon',
                icon: {
                    face: '"Font Awesome 6 Free"',
                    code: n.faIcon || '\uf068',
                    size: 42,
                    color: iconColor,
                    weight: '900'
                },
                font: {
                    color: '#0f172a',
                    size: 13,
                    face: 'Plus Jakarta Sans',
                    fontBold: true,
                    strokeWidth: 4,
                    strokeColor: '#ffffff'
                },
                data: n,
                ...(savedPos ? { x: savedPos.x, y: savedPos.y, physics: false, fixed: false } : {})
            };
        }

        function resetGraphView() {
            localStorage.removeItem('sitebos_userguide_graph_positions');
            resetAllClusters();
            startJarvisSphereMode();
        }

        window.onload = function () {
            if (document.fonts && document.fonts.load) {
                Promise.all([
                    document.fonts.load('900 20px "Font Awesome 6 Free"'),
                    document.fonts.ready
                ]).then(function () {
                    initGraph();
                }).catch(function () {
                    initGraph();
                });
            } else {
                setTimeout(initGraph, 300);
            }
        };
    </script>
